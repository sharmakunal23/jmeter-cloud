# KUBE-1 — two Services, one selector:
#   postgres     — ClusterIP, the client entry point. Named exactly like
#                  the compose service (service-name parity, convention 2)
#                  so every JDBC URL default works unchanged.
#   postgres-hl  — headless, owned by the StatefulSet for stable pod DNS.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: pg
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-hl
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: pg
