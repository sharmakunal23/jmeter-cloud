# KUBE-1 — Postgres 16, single instance, persistent volume. The K8s
# equivalent of the compose `postgres` service: same image, same env, same
# initdb mount, pg_isready probes matching the compose healthcheck.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  serviceName: postgres-hl
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Convention 5 (infra/deploy/k8s/README.md): kubelet's legacy
      # docker-link env injection collides with ${VAR:default} bindings.
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: pg
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: postgresUser
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: postgresPassword
            # Same as compose: the entrypoint creates jmetercloud_metrics;
            # initdb SQL adds jmetercloud_globalrun + the per-app users.
            - name: POSTGRES_DB
              value: jmetercloud_metrics
            # Subdirectory of the PVC mount: block-storage provisioners
            # put lost+found at the mount root, which the postgres
            # entrypoint refuses as a non-empty data dir.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # Runs once on first boot against an empty PVC — identical
            # semantics to the compose bind-mount. Re-running init means
            # deleting the PVC (the `docker compose down -v` analog).
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "jmetercloud_metrics"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "jmetercloud_metrics"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            # Request only — no memory limit by design: the metrics store
            # leans on the OS page cache for the heavy /timeseries reads,
            # and a cgroup limit would count that cache toward an OOM
            # kill. Private clouds that mandate limits add one via overlay
            # patch, sized to node capacity.
            requests:
              memory: 1Gi
              cpu: 250m
      volumes:
        - name: initdb
          configMap:
            name: postgres-initdb
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # No storageClassName: cluster default (kind: local-path). The
        # privateCloud overlay patches in the mandated class + size.
        resources:
          requests:
            storage: 10Gi
