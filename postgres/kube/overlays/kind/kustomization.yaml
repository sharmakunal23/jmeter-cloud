# KUBE-1 — kind overlay: local validation cluster. Generates the
# credentials Secret with the same dev defaults the compose fragment uses
# (already public in this repo — nothing secret about localdev).
#
# Images: the base already references local :dev tags; kind pulls nothing
# — side-load before applying:
#   docker build -t jmeter-cloud-flyway:dev postgres/
#   kind load docker-image jmeter-cloud-flyway:dev postgres:16
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
secretGenerator:
  - name: postgres-credentials
    literals:
      - postgresUser=jmetercloud
      - postgresPassword=localdev
    options:
      # Fixed name — a hash suffix would change the flyway Job spec on
      # every credential edit and trip Job immutability on re-apply.
      disableNameSuffixHash: true
