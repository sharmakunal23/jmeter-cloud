# postgres subsystem — Compose fragment.
#
# Runs Postgres 16 (current LTS-equivalent — Postgres maintains 5 major
# versions concurrently; 16 is the second-newest stable). Provisions two
# databases via the init script:
#   - jmetercloud_metrics — written by jmeter-metrics-consumer, read by
#                           jmeter-global-orchestrator
#   - jmetercloud_globalRun — owned by jmeter-global-orchestrator (run state)
#
# Real Flyway-managed schemas land in Step 9. This step provides only the
# connection target so the consumer + global-orchestrator can come up
# healthy.
#
# Standalone:
#   docker compose -f postgres/docker-compose.yml --profile default up

services:

  # -------------------------------------------------------------------------
  # flyway-migrate — runs Flyway against both databases on every stack
  # start, then exits. Idempotent: on re-runs Flyway no-ops because the
  # versions in flyway_schema_history are already applied.
  #
  # Connects as the cluster-owner user (jmetercloud) which has the
  # privileges needed to CREATE SCHEMA, CREATE TABLE, GRANT, and CREATE
  # FUNCTION. Per-app users have only the runtime grants the migrations
  # confer.
  #
  # Two invocations because Flyway tracks one schema_history per
  # database; the consumer + global-orchestrator schemas live in
  # different databases.
  # -------------------------------------------------------------------------
  flyway-migrate:
    image: flyway/flyway:10
    profiles: [default]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations/metrics:/flyway/sql/metrics:ro
      - ./migrations/globalrun:/flyway/sql/globalrun:ro
    entrypoint:
      - /bin/sh
      - -c
      - >-
        flyway
        -url=jdbc:postgresql://postgres:5432/jmetercloud_metrics
        -user=${POSTGRES_USER:-jmetercloud}
        -password=${POSTGRES_PASSWORD:-localdev}
        -locations=filesystem:/flyway/sql/metrics
        -connectRetries=10
        migrate &&
        flyway
        -url=jdbc:postgresql://postgres:5432/jmetercloud_globalrun
        -user=${POSTGRES_USER:-jmetercloud}
        -password=${POSTGRES_PASSWORD:-localdev}
        -locations=filesystem:/flyway/sql/globalrun
        -connectRetries=10
        migrate
    restart: "no"

  postgres:
    image: postgres:16
    profiles: [default]
    # Reliability: self-heal on crash/OOM
    # or host reboot. Postgres is the metrics + run-state store — a dead DB
    # loses no committed data (named volume) but stalls the whole platform
    # until manually restarted. `unless-stopped` brings it back automatically.
    # (The one-shot flyway-migrate job above keeps `restart: "no"` — correct.)
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      # Local-only credentials. Cloud uses RDS-managed users wired via
      # CloudFormation parameters → Secrets Manager.
      POSTGRES_USER:     ${POSTGRES_USER:-jmetercloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      POSTGRES_DB:       ${POSTGRES_DB:-jmetercloud_metrics}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # /docker-entrypoint-initdb.d/*.sql runs once on first container start
      # against an empty data dir. Subsequent restarts re-use the persisted
      # volume; to re-run init, `docker compose down -v`.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jmetercloud} -d ${POSTGRES_DB:-jmetercloud_metrics}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
