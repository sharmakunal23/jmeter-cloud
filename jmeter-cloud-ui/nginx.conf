# Step 7 skeleton nginx config.
#
# Three jobs:
#   1. Serve the static SPA bundle (/usr/share/nginx/html) with HTML5
#      history-mode fallback to index.html.
#   2. Reverse-proxy /api/* to the global-orchestrator container.
#   3. Expose /healthz as a Compose-friendly health endpoint.
#
# OBSERVABILITY Phase E (2026-05-25): JSON access logs. This file is
# included inside the base image's `http {}` context (via
# /etc/nginx/conf.d/*.conf), so `log_format` and `map` directives
# are valid here.

# JSON access-log shape mirrors the Java services' AccessLogFilter:
# method / path / status / clientIp / userAgent + a few nginx-specific
# fields (upstreamRespTime is helpful when triaging "was it the proxy
# or the backend"). $time_iso8601 matches the Java services' @timestamp
# format closely enough that an operator can correlate by eye.
#
# Note: latency is reported as `requestTimeSec` (nginx native unit —
# seconds with millisecond resolution, e.g. "0.045"). The Java services
# use integer `latencyMs`; the different key names avoid silent unit
# mismatches in dashboards.
#
# `escape=json` makes nginx JSON-escape string values automatically so
# embedded quotes / backslashes in the URI or User-Agent don't produce
# malformed lines.
log_format json escape=json '{'
    '"@timestamp":"$time_iso8601",'
    '"service":"jmeter-cloud-ui",'
    '"method":"$request_method",'
    '"path":"$request_uri",'
    '"status":$status,'
    '"requestTimeSec":$request_time,'
    '"upstreamRespTime":"$upstream_response_time",'
    '"clientIp":"$remote_addr",'
    '"userAgent":"$http_user_agent",'
    '"traceparent":"$http_traceparent"'
'}';

# Suppress non-critical paths from access logs so the signal-to-noise
# ratio stays high. Mirrors the CriticalPaths policy on the Java side:
# static assets, openapi spec, favicon, and the Compose healthz probe
# don't carry operator value.
map $request_uri $accessLoggable {
    default                1;
    ~^/assets/             0;
    ~^/favicon\.ico        0;
    ~^/healthz             0;
    # /actuator/ is proxied to the global-orch's actuator — the Java
    # side already drops it from MDC/tracing; no point double-logging.
    ~^/actuator/           0;
}

# SECURITY S-1 — per-client-IP request rate limits (the cheap edge layer that
# absorbs brute floods; the global-orchestrator's RateLimitFilter adds the
# per-endpoint granularity nginx can't easily express). $binary_remote_addr is
# the DIRECT peer — in the compose stack the browser hits nginx directly, so
# that's the real client. Behind a cloud LB it would be the LB's IP, collapsing
# everyone onto one bucket; there, enable the real_ip module so the key is the
# true client:
#     set_real_ip_from <lb-subnet-cidr>;
#     real_ip_header   X-Forwarded-For;
# Uploads (blobPerIp) get a tighter rate — a flood of large bodies is the most
# expensive thing an unauth client can do. 10m holds ~160k distinct IPs/zone.
limit_req_zone $binary_remote_addr zone=apiPerIp:10m  rate=50r/s;
limit_req_zone $binary_remote_addr zone=blobPerIp:10m rate=5r/s;
# 429 (not nginx's default 503) so clients/SDKs treat it as throttling. The
# global-orchestrator's filter adds an accurate Retry-After on the requests it
# sees; nginx-rejected blob floods get the status without the header.
limit_req_status 429;

# Without this resolver + the variable-based proxy_pass below, nginx
# resolves the upstream hostname ONCE at startup and caches the IP
# forever — so when `docker compose up -d --build global-orchestrator`
# recreates the container with a new IP, nginx silently 502s until
# someone manually restarts it (502 Bad Gateway, "connection refused"
# in error log). `valid=10s` re-checks DNS every 10 seconds.
#
# KUBE-6 (2026-07-22): the resolver address is environment-specific —
# Docker's embedded DNS lives at 127.0.0.11 on user-defined networks,
# Kubernetes' CoreDNS at a cluster-assigned ClusterIP. ${DNS_RESOLVER}
# is filled at container start by resolverEnv.envsh (sourced from
# /docker-entrypoint.d), which reads the first nameserver in
# /etc/resolv.conf — correct in BOTH environments with zero config; an
# explicit DNS_RESOLVER env var still overrides. This file is therefore
# shipped as an nginx template (/etc/nginx/templates/, envsubst on
# defined env vars only — nginx's own $lowercase variables pass through
# untouched).
#
# ${SVC_SUFFIX} (in the `set $upstream` lines below) exists because
# nginx's resolver does NOT apply /etc/resolv.conf search domains — it
# queries the short name as an FQDN. On Kubernetes, CoreDNS then
# forwards the unknown zone upstream (worst case resolving some
# unrelated host; otherwise NXDOMAIN → 502). resolverEnv.envsh exports
# SVC_SUFFIX="" on docker (embedded DNS handles short names natively)
# and ".<first resolv.conf search domain>" in-cluster
# (→ ".jmeter-cloud.svc.cluster.local"), making every upstream name
# fully qualified where it must be and unchanged where it mustn't.
resolver ${DNS_RESOLVER} valid=10s ipv6=off;
# PRIVATE-CLOUD-ALIGNMENT Track 7: the two upstreams are whole URLs so the
# cross-namespace case (one namespace per service, hosted D10) can point at
# the other services' ingress FQDNs over https — resolverEnv.envsh defaults
# them to the in-cluster / compose Service names. Host is the upstream's
# (an ingress routes by it); the page host travels as X-Forwarded-Host.

server {
    # Listen on both stacks — alpine glibc resolves "localhost" to ::1 first,
    # so an IPv4-only listener trips the in-container healthcheck.
    listen 80;
    listen [::]:80;
    server_name _;

    # Phase E: JSON access log; /var/log/nginx/access.log is symlinked
    # to /dev/stdout in the official nginx image, so this flows out as
    # container stdout. `if=$accessLoggable` skips static + healthz lines.
    access_log /var/log/nginx/access.log json if=$accessLoggable;

    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed build assets (index-<hash>.js / .css) never change
    # under a given name, so cache them hard. Listed via `^~` so it wins
    # over the SPA fallback's no-cache below.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Single-page-app fallback: any unknown URL serves index.html so the
    # client-side router can pick it up.
    #
    # `Cache-Control: no-cache` (revalidate, NOT no-store) on the SPA shell
    # + unhashed root files (index.html, favicon.svg). Without it nginx sends
    # no cache header at all, so browsers apply heuristic caching — a stale
    # index.html then pins the OLD hashed JS bundle (in-app marks don't
    # update) AND the old favicon link, so a redeploy's branding silently
    # fails to appear. no-cache makes the browser revalidate via ETag each
    # load (304 when unchanged — cheap), so new builds show immediately.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # /api/v1/blob[/...] → document-service (Step 18 blob uploads).
    # `^~` makes nginx prefer this prefix over the regex/prefix matchers
    # below, so /api/v1/blob doesn't accidentally fall through to the
    # global-orchestrator. The `set $documentService` + variable in
    # proxy_pass forces nginx to re-resolve DNS via the resolver above
    # — see the resolver comment for why this matters.
    location ^~ /api/v1/blob {
        # S-1: blob uploads/downloads → document-service. Tighter bucket
        # (large bodies). burst=20 absorbs a legitimate multi-file upload
        # batch; sustained excess gets 429.
        limit_req zone=blobPerIp burst=20 nodelay;
        set $documentService "${BLOB_UPSTREAM}";
        proxy_pass         $documentService;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header   Host              $proxy_host;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Uploads are streamed; bump the body limit + read timeout.
        client_max_body_size 1024m;
        proxy_read_timeout   600s;
        proxy_request_buffering off;
    }

    # D-AppRegistry: /api/v1/applications → global-orchestrator (was
    # document-service's tag-derived endpoint). The new registry adds
    # operator-managed metadata + a 30s health poller; the legacy blob-
    # tag aggregation stays available on document-service:8084 directly
    # for one-off lookups, but the UI hits this route for all app data.
    # `^~` precedence stops a /api/v1/applications/<id> path from
    # accidentally falling through to the catchall below.
    location ^~ /api/v1/applications {
        limit_req zone=apiPerIp burst=200 nodelay;
        set $globalOrchestrator "${API_UPSTREAM}";
        proxy_pass         $globalOrchestrator;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header   Host              $proxy_host;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # All other /api/* → global-orchestrator (run mgmt + pod registry).
    location /api/ {
        limit_req zone=apiPerIp burst=200 nodelay;
        set $globalOrchestrator "${API_UPSTREAM}";
        proxy_pass         $globalOrchestrator;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header   Host              $proxy_host;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # /actuator/* — same pattern; lets the UI render Spring Boot's actuator
    # response when /api/v1/health is still 501 in this skeleton.
    location /actuator/ {
        set $globalOrchestrator "${API_UPSTREAM}";
        proxy_pass         $globalOrchestrator;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # Local healthz for the Compose health check.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
