# KUBE-6 — the platform's single user-facing entry point. Everything
# routes through the UI pod's nginx (SPA + /api/* + /actuator/* proxy),
# so one Ingress rule covers the whole platform — no per-service Ingress.
#
# BODY-SIZE TRAP: most Ingress controllers cap request bodies around
# 1 MiB by default, which would break blob uploads (test plans, dataFiles
# zips up to 1 GiB) long before they reach the pod nginx's own
# client_max_body_size 1024m. The annotations below are for
# ingress-nginx — translate them if the private cloud runs a different
# controller, keeping them ≥ the pod-nginx limits (1024m / 600s).
#
# TLS: terminate here (SECURITY S-15 — lands with KUBE-11 hardening).
# Uncomment the tls block once the cluster has a cert story.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jmeter-cloud-ui
  labels:
    app: jmeter-cloud-ui
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1024m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
spec:
  # Set the controller's class for the private cloud (e.g. nginx).
  ingressClassName: nginx
  rules:
    - host: jmeter-cloud.internal.example.com   # ← real hostname here
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jmeter-cloud-ui
                port:
                  name: http
  # tls:
  #   - hosts: [jmeter-cloud.internal.example.com]
  #     secretName: jmeter-cloud-ui-tls
