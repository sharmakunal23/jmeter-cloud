# KUBE-6 — `jmeter-cloud-ui` ClusterIP (parity with the compose name).
# In-cluster port is 80 (the compose host mapping 8086→80 has no
# in-cluster equivalent; external access is the privateCloud Ingress, or
# `kubectl port-forward svc/jmeter-cloud-ui 8086:80` on kind).
apiVersion: v1
kind: Service
metadata:
  name: jmeter-cloud-ui
  labels:
    app: jmeter-cloud-ui
spec:
  selector:
    app: jmeter-cloud-ui
  ports:
    - name: http
      port: 80
      targetPort: http
