# Strategic-merge patch over the base Deployment for the `dev` tier.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jmeter-cloud-ui
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: jmeter-cloud-ui
          image: ${containerImageUri}
          env:
            - name: API_UPSTREAM
              value: "https://global-orchestrator.REPLACE_ME_PLATFORM_DOMAIN"
            - name: BLOB_UPSTREAM
              value: "https://document-service.REPLACE_ME_PLATFORM_DOMAIN"
          resources:
            requests:
              memory: 128Mi
              ephemeral-storage: 10Gi
            limits:
              memory: 128Mi
              ephemeral-storage: 10Gi
