# Top-level docker-compose.yml — pulls every implemented subsystem into a
# single Compose project (jmeter-cloud) via `include:`. Each subsystem owns
# its own fragment so it stays runnable standalone.
#
# Usage:
#
#   docker compose up                            # default profile
#                                                # = full stack: kafka + UI + 1 orchestrator
#                                                #   + postgres + global-orchestrator
#                                                #   + metrics-consumer + document-service
#                                                #   + jmeter-cloud-ui
#
#   docker compose --profile minimal up          # kafka core only (no UI,
#                                                # no postgres, no greenfield services)
#
# The default-profile activation comes from COMPOSE_PROFILES=default in
# repo-root .env, so plain `docker compose up` does the right thing without
# requiring a flag.
#
# Worker containers (formerly the static `orchestrator-1` / `orchestrator-2`
# services) are no longer in compose — they're spun up dynamically per
# application by the global-orchestrator's PodProvisioner. See the
# Capacity tab in the UI (`/capacity/{appName}`) to add workers.

include:
  - path: ./kafka/docker-compose.yml
  - path: ./postgres/docker-compose.yml
  - path: ./jmeter-local-orchestrator/docker-compose.yml
  - path: ./document-service/docker-compose.yml
  - path: ./jmeter-global-orchestrator/docker-compose.yml
  - path: ./jmeter-metrics-consumer/docker-compose.yml
  - path: ./jmeter-cloud-ui/docker-compose.yml
  - path: ./grafana/docker-compose.yml
