# kafka subsystem — Compose fragment.
#
# Two equivalent ways to run this:
#
#   1. From the repo root (preferred — gives you the full stack):
#        docker compose up                      # default profile (full stack)
#        docker compose --profile minimal up    # kafka core only, no UI / postgres / etc.
#
#   2. Standalone for kafka work:
#        docker compose -f kafka/docker-compose.yml --profile default up
#
# When run from the repo root, the project name is jmeterCloud (set in
# repo-root .env), so all containers join the jmeterCloud_default network and
# can resolve each other by Compose service name (kafka, schema-registry, …).

services:

  # -------------------------------------------------------------------------
  # Kafka — KRaft mode with separate internal and external listeners.
  #
  # Listener split:
  #   EXTERNAL://localhost:9092   — host machine → Kafka (kcat, host-run JAR)
  #   INTERNAL://kafka:29092      — container → container (Schema Registry,
  #                                  the orchestrator, etc.)
  #
  # ADVERTISED_LISTENERS is what clients actually connect to after the
  # initial bootstrap. If we advertised only localhost:9092, in-network
  # containers would resolve "localhost" to themselves and fail.
  # -------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka
    profiles: [minimal, default]
    # Self-heal on crash/OOM or host/daemon reboot. The broker is the
    # data backbone — without a
    # restart policy a single OOM left it dead until a manual
    # `docker compose up`, which is the reported "Kafka died mid/after a test"
    # symptom. `unless-stopped` (not `on-failure`) so it also comes back after
    # a host reboot but respects an explicit operator `docker compose stop`.
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 10
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    # Phase G follow-up (G-fix-2): pin Docker Desktop's per-container memory
    # so a busy run + sibling projects on the same host don't OOM-kill the
    # broker. Heap stays at the cp-kafka default (~1 GB); 2 GiB leaves
    # headroom for the kafka-clients native buffers + page cache. cpus
    # cap keeps the broker cooperative under host CPU pressure.
    mem_limit: 2g
    mem_reservation: 1g
    cpus: 1.5
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------------
  # Schema Registry — connects via the INTERNAL listener (kafka:29092)
  # -------------------------------------------------------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    hostname: schema-registry
    profiles: [minimal, default]
    # Reliability (Round 5): self-heal — a dead Schema Registry stalls every
    # Avro produce/consume, so it must come back on crash/reboot.
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------------
  # Kafka UI — http://localhost:8085
  #
  # Excluded from the `minimal` profile: it's a developer tool, not a
  # production-shape requirement. Use `--profile default` (the default when
  # COMPOSE_PROFILES=default is set in repo-root .env) to bring it up.
  # -------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: [default]
    restart: unless-stopped   # Reliability (Round 5): self-heal.
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      DYNAMIC_CONFIG_ENABLED: "true"

  # -------------------------------------------------------------------------
  # Topic initialiser — runs once on stack boot.
  #
  # KAFKA-PER-APP Phase E (2026-05-16): cutover from single-topic to
  # per-app topics is complete. This job no longer creates the legacy
  # jmeter.metrics.perSecond + perSecond-dlt topics — per-app topics are
  # created on-demand by the global-orchestrator's KafkaTopicProvisioner
  # at POST /api/v1/applications time (Phase B).
  #
  # What this job DOES do now:
  #   1. Delete the legacy jmeter.metrics.perSecond + jmeter.metrics.perSecond-dlt
  #      topics (idempotent --if-exists). Cleanup-on-boot so a stack that
  #      came from a pre-Phase-E checkout doesn't keep the orphan topics
  #      cluttering Kafka UI / Grafana.
  #   2. Create a single placeholder topic jmeter.metrics.placeholder so
  #      kafka-exporter has at least one topic matching the per-app
  #      pattern to scrape on a fresh boot — otherwise its
  #      kafka_topic_partitions{topic=~"jmeter\.metrics\..+"} query NaNs
  #      until the operator registers their first app, and the Grafana
  #      template-var dropdown is empty.
  #
  # Downstream services still wait via `depends_on: service_completed_successfully`
  # so they only start once cleanup + placeholder are done.
  # -------------------------------------------------------------------------
  topic-init:
    image: confluentinc/cp-kafka:7.6.0
    profiles: [minimal, default]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      LEGACY_TOPIC: ${LEGACY_KAFKA_TOPIC:-jmeter.metrics.perSecond}
      PLACEHOLDER_TOPIC: ${KAFKA_PLACEHOLDER_TOPIC:-jmeter.metrics.placeholder}
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-3}
    entrypoint:
      - /bin/bash
      - -c
      - >-
        LEGACY_DLT="$${LEGACY_TOPIC}-dlt";
        LEGACY_DLT_NEW="$${LEGACY_TOPIC}.DLT";
        echo "[Phase E] Deleting legacy topics if present: $${LEGACY_TOPIC}, $${LEGACY_DLT}, $${LEGACY_DLT_NEW}..." &&
        kafka-topics --delete
        --bootstrap-server kafka:29092
        --topic "$${LEGACY_TOPIC}"
        --if-exists &&
        kafka-topics --delete
        --bootstrap-server kafka:29092
        --topic "$${LEGACY_DLT}"
        --if-exists &&
        kafka-topics --delete
        --bootstrap-server kafka:29092
        --topic "$${LEGACY_DLT_NEW}"
        --if-exists &&
        echo "[Phase E] Legacy topics removed (or already absent)." &&
        echo "[Phase E] Creating placeholder $${PLACEHOLDER_TOPIC} ($${KAFKA_PARTITIONS} partitions, kafka-exporter scrape target)..." &&
        kafka-topics --create
        --bootstrap-server kafka:29092
        --topic "$${PLACEHOLDER_TOPIC}"
        --partitions "$${KAFKA_PARTITIONS}"
        --replication-factor 1
        --config retention.ms=604800000
        --config compression.type=zstd
        --if-not-exists &&
        echo "[Phase E] topic-init done. Per-app topics will be created by global-orchestrator on POST /api/v1/applications."
    restart: "no"

volumes:
  kafka-data:
