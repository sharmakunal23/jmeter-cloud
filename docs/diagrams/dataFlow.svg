<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 280" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#475569"/></marker>
    <marker id="ak" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#0d9488"/></marker>
  </defs>
  <rect width="1380" height="280" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#0f172a">Metrics data flow — sample to chart</text>

  <g font-size="13">
    <rect x="30" y="86" width="150" height="78" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="105" y="118" text-anchor="middle" font-weight="600" fill="#115e59">JMeter</text>
    <text x="105" y="137" text-anchor="middle" font-size="11" fill="#0f766e">child process</text>
    <text x="105" y="153" text-anchor="middle" font-size="10.5" fill="#0f766e" font-family="monospace">results.jtl</text>

    <rect x="252" y="86" width="218" height="78" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="361" y="114" text-anchor="middle" font-weight="600" fill="#115e59">local-orchestrator</text>
    <text x="361" y="133" text-anchor="middle" font-size="11" fill="#0f766e">tail JTL → aggregate 1s window</text>
    <text x="361" y="151" text-anchor="middle" font-size="10.5" fill="#0f766e">→ Avro WorkerMetricBatch</text>

    <rect x="542" y="86" width="160" height="78" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="622" y="114" text-anchor="middle" font-weight="600" fill="#115e59">Kafka</text>
    <text x="622" y="133" text-anchor="middle" font-size="10.5" fill="#0f766e" font-family="monospace">metrics.perSecond</text>
    <text x="622" y="151" text-anchor="middle" font-size="10.5" fill="#0f766e">12 partitions · Avro</text>

    <rect x="774" y="86" width="180" height="78" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="864" y="114" text-anchor="middle" font-weight="600" fill="#115e59">metrics-consumer</text>
    <text x="864" y="133" text-anchor="middle" font-size="11" fill="#0f766e">batch listener</text>
    <text x="864" y="151" text-anchor="middle" font-size="10.5" fill="#0f766e">idempotent upsert</text>

    <rect x="1026" y="86" width="170" height="78" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="1111" y="114" text-anchor="middle" font-weight="600" fill="#065f46">Postgres</text>
    <text x="1111" y="133" text-anchor="middle" font-size="10.5" fill="#047857" font-family="monospace">"workerMetric"</text>
    <text x="1111" y="151" text-anchor="middle" font-size="10.5" fill="#047857">weekly partitions</text>

    <rect x="1268" y="86" width="82" height="78" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="1309" y="118" text-anchor="middle" font-weight="600" font-size="12" fill="#3730a3">Grafana</text>
    <text x="1309" y="136" text-anchor="middle" font-size="10.5" fill="#4f46e5">+ UI uPlot</text>
  </g>

  <g stroke="#475569" stroke-width="1.6" fill="none">
    <line x1="180" y1="125" x2="250" y2="125" marker-end="url(#a)"/>
    <line x1="954" y1="125" x2="1024" y2="125" marker-end="url(#a)"/>
    <line x1="1196" y1="125" x2="1266" y2="125" marker-end="url(#a)"/>
  </g>
  <g stroke="#0d9488" stroke-width="1.8" fill="none" stroke-dasharray="7 4">
    <line x1="470" y1="125" x2="540" y2="125" marker-end="url(#ak)"/>
    <line x1="702" y1="125" x2="772" y2="125" marker-end="url(#ak)"/>
  </g>

  <g font-size="10.5" fill="#64748b">
    <text x="215" y="116" text-anchor="middle">read</text>
    <text x="505" y="116" text-anchor="middle" fill="#0f766e">publish</text>
    <text x="737" y="116" text-anchor="middle" fill="#0f766e">consume</text>
    <text x="989" y="116" text-anchor="middle">INSERT</text>
    <text x="1231" y="116" text-anchor="middle">SQL</text>
  </g>

  <rect x="30" y="200" width="1320" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="50" y="227" font-size="12.5" fill="#334155"><tspan font-weight="700">Solid</tspan> = synchronous read / SQL · <tspan font-weight="700" fill="#0f766e">dashed</tspan> = Kafka (async, at-least-once, Avro). End-to-end latency from a JMeter sample to a live chart is typically <tspan font-weight="700">1–2 s</tspan>.</text>
</svg>
