<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400"
     font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="d" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="16" y="22" font-size="11" font-weight="600" fill="#334155">One JMeter sample → a live chart, and the technology at each hop</text>

  <!-- lane 1 : worker -->
  <rect x="16" y="36" width="868" height="104" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="28" y="52" font-size="10" font-weight="600" fill="#115e59" letter-spacing="1">WORKER POD</text>

  <g font-size="10" text-anchor="middle">
    <rect x="30"  y="62" width="96" height="46" rx="5" fill="#ffffff" stroke="#5eead4"/>
    <text x="78"  y="80" font-size="11" font-weight="600" fill="#115e59">JMeter</text>
    <text x="78"  y="95" fill="#64748b">child process</text>

    <rect x="158" y="62" width="96" height="46" rx="5" fill="#ffffff" stroke="#5eead4"/>
    <text x="206" y="80" font-size="11" font-weight="600" fill="#115e59">results.jtl</text>
    <text x="206" y="95" fill="#64748b">CSV, 1 row/req</text>

    <rect x="286" y="62" width="104" height="46" rx="5" fill="#ffffff" stroke="#5eead4"/>
    <text x="338" y="80" font-size="11" font-weight="600" fill="#115e59">FilePoller</text>
    <text x="338" y="95" fill="#64748b">RandomAccessFile</text>

    <rect x="422" y="62" width="128" height="46" rx="5" fill="#ccfbf1" stroke="#0f766e"/>
    <text x="486" y="80" font-size="11" font-weight="600" fill="#115e59">Aggregator</text>
    <text x="486" y="95" fill="#475569">HDRHistogram · 1-s</text>

    <rect x="582" y="62" width="120" height="46" rx="5" fill="#ffffff" stroke="#5eead4"/>
    <text x="642" y="80" font-size="11" font-weight="600" fill="#115e59">Disk buffer</text>
    <text x="642" y="95" fill="#64748b">gzip · atomic swap</text>

    <rect x="734" y="62" width="132" height="46" rx="5" fill="#ffffff" stroke="#5eead4"/>
    <text x="800" y="80" font-size="11" font-weight="600" fill="#115e59">JDK HttpClient</text>
    <text x="800" y="95" fill="#64748b">Jackson → JSON</text>
  </g>
  <g stroke="#64748b" stroke-width="1.3" marker-end="url(#d)">
    <line x1="126" y1="85" x2="154" y2="85"/><line x1="254" y1="85" x2="282" y2="85"/>
    <line x1="390" y1="85" x2="418" y2="85"/><line x1="550" y1="85" x2="578" y2="85"/>
    <line x1="702" y1="85" x2="730" y2="85"/>
  </g>
  <text x="486" y="126" font-size="9" text-anchor="middle" fill="#475569">one WorkerMetricBatch per (worker, second) — persisted before it is sent, so an outage costs latency, not data</text>

  <!-- hop -->
  <path d="M800,140 C800,158 470,152 470,172" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#d)"/>
  <text x="646" y="164" font-size="9" text-anchor="middle" fill="#475569">POST /api/v1/ingest · application/json</text>

  <!-- lane 2 : consumer -->
  <rect x="16" y="178" width="868" height="94" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="28" y="194" font-size="10" font-weight="600" fill="#1e3a8a" letter-spacing="1">METRICS-CONSUMER</text>

  <g font-size="10" text-anchor="middle">
    <rect x="120" y="204" width="150" height="48" rx="5" fill="#ffffff" stroke="#93c5fd"/>
    <text x="195" y="223" font-size="11" font-weight="600" fill="#1e3a8a">Jackson decode</text>
    <text x="195" y="238" fill="#64748b">+ validate identity</text>

    <rect x="330" y="204" width="240" height="48" rx="5" fill="#dbeafe" stroke="#2563eb"/>
    <text x="450" y="222" font-size="11" font-weight="600" fill="#1e3a8a">JdbcTemplate — one statement</text>
    <text x="450" y="237" fill="#475569">INSERT … ON CONFLICT DO NOTHING RETURNING</text>

    <rect x="630" y="204" width="200" height="48" rx="5" fill="#ffffff" stroke="#93c5fd"/>
    <text x="730" y="222" font-size="11" font-weight="600" fill="#1e3a8a">rollup upserts</text>
    <text x="730" y="237" fill="#64748b">fed only by rows that landed</text>
  </g>
  <g stroke="#64748b" stroke-width="1.3" marker-end="url(#d)">
    <line x1="270" y1="228" x2="326" y2="228"/><line x1="570" y1="228" x2="626" y2="228"/>
  </g>

  <path d="M450,272 L450,292" stroke="#64748b" stroke-width="1.4" marker-end="url(#d)"/>

  <!-- lane 3 : storage + readers -->
  <rect x="16" y="298" width="868" height="90" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="28" y="314" font-size="10" font-weight="600" fill="#065f46" letter-spacing="1">DATABASE → READERS</text>

  <g font-size="10" text-anchor="middle">
    <rect x="150" y="320" width="188" height="42" rx="5" fill="#d1fae5" stroke="#047857"/>
    <text x="244" y="337" font-size="11" font-weight="600" fill="#065f46">workerMetric</text>
    <text x="244" y="352" fill="#475569">weekly partitions · raw</text>

    <rect x="384" y="320" width="188" height="42" rx="5" fill="#d1fae5" stroke="#047857"/>
    <text x="478" y="337" font-size="11" font-weight="600" fill="#065f46">runSecond · runLabel</text>
    <text x="478" y="352" fill="#475569">rollups · sums, never ratios</text>

    <rect x="616" y="320" width="116" height="42" rx="5" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="674" y="337" font-size="11" font-weight="600" fill="#065f46">uPlot</text>
    <text x="674" y="352" fill="#64748b">UI Metrics tab</text>

    <rect x="750" y="320" width="116" height="42" rx="5" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="808" y="337" font-size="11" font-weight="600" fill="#065f46">Grafana</text>
    <text x="808" y="352" fill="#64748b">dashboard</text>
  </g>

  <line x1="338" y1="341" x2="380" y2="341" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#d)"/>
  <line x1="572" y1="341" x2="612" y2="341" stroke="#64748b" stroke-width="1.3" marker-end="url(#d)"/>
  <text x="592" y="332" font-size="9" text-anchor="middle" fill="#475569">reads</text>

  <path d="M244,362 L244,378 L790,378 L790,366" stroke="#94a3b8" stroke-width="1.2" fill="none"
        stroke-dasharray="3,3" marker-end="url(#d)"/>
  <text x="517" y="391" font-size="9" text-anchor="middle" fill="#64748b">Grafana is the only reader of the raw table — the orchestrators read the rollups</text>
</svg>
