<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 340" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#475569"/></marker>
    <marker id="ak" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#0d9488"/></marker>
  </defs>
  <rect width="1060" height="340" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#0f172a">jmeter-metrics-consumer — Kafka → Postgres</text>
  <text x="30" y="56" font-size="12.5" fill="#64748b">Batch listener, idempotent multi-row upsert, disk-backed buffer, poison records routed to a DLT.</text>

  <g font-size="12.5">
    <rect x="30" y="104" width="170" height="78" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
    <text x="115" y="134" text-anchor="middle" font-weight="600" fill="#115e59">Kafka topic</text>
    <text x="115" y="153" text-anchor="middle" font-size="10" fill="#0f766e" font-family="monospace">metrics.perSecond</text>
    <text x="115" y="169" text-anchor="middle" font-size="10" fill="#0f766e">Avro WorkerMetricBatch</text>

    <rect x="250" y="104" width="180" height="78" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <text x="340" y="130" text-anchor="middle" font-weight="600" fill="#1e3a8a">batch listener</text>
    <text x="340" y="149" text-anchor="middle" font-size="10" fill="#2563eb">poll batch · manual ack</text>
    <text x="340" y="166" text-anchor="middle" font-size="10" fill="#2563eb">disk-backed buffer</text>

    <rect x="480" y="104" width="190" height="78" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <text x="575" y="130" text-anchor="middle" font-weight="600" fill="#1e3a8a">WorkerMetricWriter</text>
    <text x="575" y="149" text-anchor="middle" font-size="10" fill="#2563eb">multi-row INSERT</text>
    <text x="575" y="166" text-anchor="middle" font-size="10" fill="#2563eb">ON CONFLICT DO NOTHING</text>

    <rect x="720" y="104" width="180" height="78" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="810" y="130" text-anchor="middle" font-weight="600" fill="#065f46">Postgres</text>
    <text x="810" y="149" text-anchor="middle" font-size="10" fill="#047857" font-family="monospace">metrics."workerMetric"</text>
    <text x="810" y="166" text-anchor="middle" font-size="10" fill="#047857">weekly partitions</text>

    <!-- DLT -->
    <rect x="250" y="244" width="180" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="340" y="270" text-anchor="middle" font-weight="600" fill="#991b1b">dead-letter topic</text>
    <text x="340" y="289" text-anchor="middle" font-size="10" fill="#b91c1c" font-family="monospace">…perSecond.DLT</text>
  </g>

  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="430" y1="143" x2="478" y2="143"/>
    <line x1="670" y1="143" x2="718" y2="143"/>
  </g>
  <g stroke="#0d9488" stroke-width="1.8" fill="none" stroke-dasharray="7 4" marker-end="url(#ak)">
    <line x1="200" y1="143" x2="248" y2="143"/>
  </g>
  <g stroke="#dc2626" stroke-width="1.5" fill="none" stroke-dasharray="5 3" marker-end="url(#a)">
    <path d="M340,182 V242"/>
  </g>

  <g font-size="10.5" fill="#64748b">
    <text x="224" y="135" text-anchor="middle" fill="#0f766e">consume</text>
    <text x="454" y="135" text-anchor="middle">map</text>
    <text x="694" y="135" text-anchor="middle">persist</text>
    <text x="356" y="216" text-anchor="middle" fill="#b91c1c">poison record</text>
  </g>
</svg>
