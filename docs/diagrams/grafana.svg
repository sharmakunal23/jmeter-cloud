<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 430" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#4f46e5"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#475569"/></marker>
  </defs>
  <rect width="1020" height="430" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#0f172a">grafana — observability stack</text>
  <text x="30" y="56" font-size="12.5" fill="#64748b">Prometheus scrapes app + exporter metrics; Grafana renders them plus per-run series read from Postgres.</text>

  <!-- sources -->
  <g font-size="11.5">
    <rect x="30" y="92" width="220" height="46" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.3"/>
    <text x="140" y="120" text-anchor="middle" font-size="11.5" fill="#1e3a8a">Java services · <tspan font-family="monospace">/actuator/prometheus</tspan></text>

    <rect x="30" y="156" width="220" height="46" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.3"/>
    <text x="140" y="184" text-anchor="middle" font-size="11.5" fill="#115e59">kafka-exporter <tspan font-family="monospace">:9308</tspan></text>

    <rect x="30" y="220" width="220" height="46" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.3"/>
    <text x="140" y="248" text-anchor="middle" font-size="11.5" fill="#065f46">postgres-exporter <tspan font-family="monospace">:9187</tspan></text>

    <rect x="30" y="312" width="220" height="56" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="140" y="336" text-anchor="middle" font-weight="600" font-size="12" fill="#065f46">Postgres</text>
    <text x="140" y="354" text-anchor="middle" font-size="10" fill="#047857" font-family="monospace">metrics."workerMetric"</text>
  </g>

  <!-- prometheus + grafana -->
  <g font-size="12.5">
    <rect x="360" y="150" width="180" height="80" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="450" y="180" text-anchor="middle" font-weight="600" fill="#3730a3">Prometheus</text>
    <text x="450" y="199" text-anchor="middle" font-size="10.5" fill="#4f46e5" font-family="monospace">:9090</text>
    <text x="450" y="216" text-anchor="middle" font-size="10" fill="#4f46e5">scrape + TSDB</text>

    <rect x="630" y="150" width="180" height="80" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="720" y="180" text-anchor="middle" font-weight="600" fill="#3730a3">Grafana</text>
    <text x="720" y="199" text-anchor="middle" font-size="10.5" fill="#4f46e5" font-family="monospace">:3000</text>
    <text x="720" y="216" text-anchor="middle" font-size="10" fill="#4f46e5">2 datasources</text>

    <!-- dashboards -->
    <rect x="860" y="92" width="140" height="240" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="930" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#4338ca">5 dashboards</text>
    <g font-size="10.5" fill="#3730a3">
      <text x="876" y="146">• perTestLiveMetrics</text>
      <text x="876" y="172">• orchestrator JVM</text>
      <text x="876" y="198">• JMeter JVM</text>
      <text x="876" y="224">• Kafka broker</text>
      <text x="876" y="250">• Postgres</text>
    </g>
    <text x="930" y="300" text-anchor="middle" font-size="9.5" fill="#4f46e5">deep-linked from</text>
    <text x="930" y="314" text-anchor="middle" font-size="9.5" fill="#4f46e5">the UI by runId</text>
  </g>

  <!-- scrape edges -->
  <g stroke="#4f46e5" stroke-width="1.5" fill="none" stroke-dasharray="2 4" marker-end="url(#a)">
    <path d="M250,115 Q320,140 358,165"/>
    <line x1="250" y1="179" x2="358" y2="184"/>
    <path d="M250,243 Q320,220 358,205"/>
  </g>
  <!-- prometheus -> grafana -->
  <g stroke="#4f46e5" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="540" y1="190" x2="628" y2="190"/>
  </g>
  <!-- grafana dashboards -->
  <g stroke="#4f46e5" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <line x1="810" y1="190" x2="858" y2="200"/>
  </g>
  <!-- postgres -> grafana datasource -->
  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#ag)">
    <path d="M250,338 Q540,350 700,232"/>
  </g>

  <g font-size="10.5" fill="#4f46e5">
    <text x="316" y="158" text-anchor="middle">scrape</text>
    <text x="584" y="182" text-anchor="middle">query</text>
  </g>
  <g font-size="10.5" fill="#475569"><text x="470" y="360" text-anchor="middle">SQL datasource (per-run series)</text></g>
</svg>
