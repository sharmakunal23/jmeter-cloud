<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 420" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#475569"/></marker>
    <marker id="ak" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#0d9488"/></marker>
  </defs>
  <rect width="1240" height="420" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#0f172a">jmeter-local-orchestrator — one worker pod</text>
  <text x="30" y="56" font-size="12.5" fill="#64748b">HTTP-driven: stage artifacts → launch JMeter → tail JTL → aggregate per second → publish Avro.</text>

  <!-- pod boundary -->
  <rect x="20" y="76" width="990" height="180" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-dasharray="6 4"/>
  <text x="38" y="98" font-size="11" font-weight="700" fill="#0f766e" letter-spacing="1">POD (single JMeter worker)</text>

  <g font-size="12.5">
    <rect x="36" y="120" width="150" height="76" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <text x="111" y="150" text-anchor="middle" font-weight="600" fill="#1e3a8a">REST API</text>
    <text x="111" y="168" text-anchor="middle" font-size="10.5" fill="#2563eb" font-family="monospace">/api/v1 · :8080</text>
    <text x="111" y="184" text-anchor="middle" font-size="10" fill="#2563eb">plan · data · start</text>

    <rect x="242" y="120" width="150" height="76" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="317" y="150" text-anchor="middle" font-weight="600" fill="#115e59">ArtifactStager</text>
    <text x="317" y="170" text-anchor="middle" font-size="10" fill="#0f766e">stage plan +</text>
    <text x="317" y="184" text-anchor="middle" font-size="10" fill="#0f766e">dataFiles.zip</text>

    <rect x="448" y="120" width="150" height="76" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="523" y="146" text-anchor="middle" font-weight="600" fill="#115e59">JMeter child</text>
    <text x="523" y="165" text-anchor="middle" font-size="10" fill="#0f766e">runs test plan</text>
    <text x="523" y="183" text-anchor="middle" font-size="10" fill="#0f766e" font-family="monospace">→ results.jtl</text>

    <rect x="654" y="120" width="160" height="76" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="734" y="146" text-anchor="middle" font-weight="600" fill="#115e59">JTL tailer +</text>
    <text x="734" y="164" text-anchor="middle" font-weight="600" fill="#115e59">aggregator</text>
    <text x="734" y="184" text-anchor="middle" font-size="10" fill="#0f766e">1 s windows / label</text>

    <rect x="870" y="120" width="120" height="76" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="930" y="150" text-anchor="middle" font-weight="600" fill="#115e59">Avro</text>
    <text x="930" y="168" text-anchor="middle" font-weight="600" fill="#115e59">publisher</text>
    <text x="930" y="184" text-anchor="middle" font-size="10" fill="#0f766e">WorkerMetricBatch</text>
  </g>

  <!-- external -->
  <g font-size="12.5">
    <rect x="1060" y="120" width="140" height="76" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
    <text x="1130" y="150" text-anchor="middle" font-weight="600" fill="#115e59">Kafka</text>
    <text x="1130" y="170" text-anchor="middle" font-size="10" fill="#0f766e" font-family="monospace">metrics.perSecond</text>
    <text x="1130" y="186" text-anchor="middle" font-size="10" fill="#0f766e">+ Schema Registry</text>

    <rect x="320" y="300" width="220" height="68" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <text x="430" y="328" text-anchor="middle" font-weight="600" fill="#1e3a8a">document-service</text>
    <text x="430" y="347" text-anchor="middle" font-size="10.5" fill="#2563eb">ARTIFACT_SOURCE · RESULT_SINK</text>

    <rect x="628" y="300" width="190" height="68" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <text x="723" y="328" text-anchor="middle" font-weight="600" fill="#1e3a8a">global-orchestrator</text>
    <text x="723" y="347" text-anchor="middle" font-size="10.5" fill="#2563eb">registers pod · heartbeat</text>
  </g>

  <!-- pipeline arrows -->
  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="186" y1="158" x2="240" y2="158"/>
    <line x1="392" y1="158" x2="446" y2="158"/>
    <line x1="598" y1="158" x2="652" y2="158"/>
    <!-- stager -> document-service (fetch) -->
    <path d="M300,196 Q318,250 398,298"/>
    <!-- result -> document-service (push results) -->
    <path d="M520,196 Q498,250 462,298"/>
    <!-- API -> global-orch heartbeat (routes below document-service) -->
    <path d="M95,196 C80,408 480,428 723,408 L723,370"/>
  </g>
  <g stroke="#0d9488" stroke-width="1.8" fill="none" stroke-dasharray="7 4" marker-end="url(#ak)">
    <line x1="814" y1="158" x2="868" y2="158"/>
    <line x1="990" y1="158" x2="1058" y2="158"/>
  </g>

  <g font-size="10.5" fill="#64748b">
    <text x="213" y="150" text-anchor="middle">stage</text>
    <text x="419" y="150" text-anchor="middle">launch</text>
    <text x="625" y="150" text-anchor="middle">tail</text>
    <text x="841" y="150" text-anchor="middle" fill="#0f766e">batch</text>
    <text x="1024" y="150" text-anchor="middle" fill="#0f766e">produce</text>
    <text x="338" y="276" text-anchor="middle" fill="#2563eb">fetch plan</text>
    <text x="527" y="276" text-anchor="middle" fill="#2563eb">push results</text>
  </g>
</svg>
