<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" width="900" height="424"
     font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#64748b"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="900" height="424" fill="#ffffff"/>

  <rect x="16" y="30"  width="868" height="92"  rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="16" y="146" width="868" height="112" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
  <rect x="16" y="282" width="868" height="124" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="28" y="46"  font-size="10" font-weight="600" fill="#1e3a8a" letter-spacing="1">CONTROL PLANE</text>
  <text x="28" y="162" font-size="10" font-weight="600" fill="#115e59" letter-spacing="1">DATA PLANE</text>
  <text x="28" y="298" font-size="10" font-weight="600" fill="#065f46" letter-spacing="1">DATA STORAGE</text>

  <!-- control plane -->
  <rect x="32" y="58" width="94" height="46" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="79" y="79" font-size="12" font-weight="600" text-anchor="middle" fill="#1e3a8a">Browser</text>
  <text x="79" y="94" font-size="10" text-anchor="middle" fill="#64748b">operator</text>

  <rect x="176" y="58" width="130" height="46" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="241" y="78" font-size="12" font-weight="600" text-anchor="middle" fill="#1e3a8a">jmeter-cloud-ui</text>
  <text x="241" y="93" font-size="10" text-anchor="middle" fill="#64748b">nginx + React · 8086</text>

  <rect x="380" y="58" width="176" height="46" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="468" y="78" font-size="12" font-weight="600" text-anchor="middle" fill="#1e3a8a">global-orchestrator</text>
  <text x="468" y="93" font-size="10" text-anchor="middle" fill="#475569">runs · capacity · pod registry · 8082</text>

  <line x1="126" y1="81" x2="172" y2="81" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="306" y1="81" x2="376" y2="81" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="341" y="74" font-size="9" text-anchor="middle" fill="#475569">/api/*</text>

  <!-- data plane -->
  <rect x="34" y="180" width="146" height="52" rx="6" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="107" y="200" font-size="12" font-weight="600" text-anchor="middle" fill="#115e59">document-service</text>
  <text x="107" y="215" font-size="10" text-anchor="middle" fill="#475569">plans · data · results · 8084</text>

  <rect x="286" y="172" width="170" height="70" rx="6" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="371" y="192" font-size="12" font-weight="600" text-anchor="middle" fill="#115e59">local-orchestrator</text>
  <text x="371" y="206" font-size="10" text-anchor="middle" fill="#475569">worker · 8080</text>
  <rect x="302" y="212" width="138" height="22" rx="4" fill="#ffffff" stroke="#5eead4"/>
  <text x="371" y="227" font-size="10" text-anchor="middle" fill="#115e59">JMeter (child)</text>

  <rect x="600" y="180" width="150" height="52" rx="6" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="675" y="200" font-size="12" font-weight="600" text-anchor="middle" fill="#115e59">metrics-consumer</text>
  <text x="675" y="215" font-size="10" text-anchor="middle" fill="#475569">ingest · 8083</text>

  <path d="M228,104 C210,132 168,146 140,176" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <text x="118" y="148" font-size="9" text-anchor="middle" fill="#475569">/api/v1/blob/*</text>

  <path d="M414,104 L390,168" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <text x="316" y="130" font-size="9" text-anchor="middle" fill="#475569">provision · fan out</text>
  <text x="316" y="141" font-size="9" text-anchor="middle" fill="#94a3b8">POST /api/v1/test</text>
  <path d="M436,168 L456,104" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <text x="516" y="130" font-size="9" text-anchor="middle" fill="#475569">register ·</text>
  <text x="516" y="141" font-size="9" text-anchor="middle" fill="#475569">heartbeat 30 s</text>

  <line x1="282" y1="206" x2="186" y2="206" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="234" y="199" font-size="9" text-anchor="middle" fill="#475569">fetch · upload</text>

  <line x1="456" y1="206" x2="596" y2="206" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="532" y="199" font-size="9" text-anchor="start" fill="#475569">POST /ingest</text>
  <text x="532" y="222" font-size="9" text-anchor="start" fill="#94a3b8">1×/sec · JSON</text>
  <text x="371" y="252" font-size="9" text-anchor="middle" fill="#64748b">one pod per JMeter · N pods per run</text>

  <!-- data storage -->
  <rect x="256" y="312" width="300" height="76" rx="6" fill="#d1fae5" stroke="#047857"/>
  <text x="406" y="334" font-size="12" font-weight="600" text-anchor="middle" fill="#065f46">Database</text>
  <text x="406" y="352" font-size="10" text-anchor="middle" fill="#475569">run state · pod registry</text>
  <text x="406" y="368" font-size="10" text-anchor="middle" fill="#475569">metrics fact table · rollups</text>

  <rect x="624" y="326" width="128" height="48" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="688" y="346" font-size="12" font-weight="600" text-anchor="middle" fill="#065f46">Cache</text>
  <text x="688" y="361" font-size="10" text-anchor="middle" fill="#64748b">terminal-run results</text>

  <rect x="52" y="326" width="128" height="48" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="116" y="346" font-size="12" font-weight="600" text-anchor="middle" fill="#065f46">Grafana</text>
  <text x="116" y="361" font-size="10" text-anchor="middle" fill="#64748b">dashboard</text>

  <line x1="252" y1="350" x2="186" y2="350" stroke="#047857" stroke-width="1.4" marker-end="url(#ag)"/>
  <text x="219" y="343" font-size="9" text-anchor="middle" fill="#065f46">reads raw</text>

  <!-- orchestrator → Database, straight down the free corridor between worker and consumer -->
  <path d="M520,104 L520,308" stroke="#047857" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>
  <text x="452" y="276" font-size="9" text-anchor="end" fill="#065f46">run state ·</text>
  <text x="452" y="288" font-size="9" text-anchor="end" fill="#065f46">reads rollups</text>

  <!-- metrics-consumer → Database -->
  <path d="M640,236 L560,306" stroke="#047857" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>
  <text x="652" y="272" font-size="9" text-anchor="start" fill="#065f46">writes rows</text>
  <text x="652" y="284" font-size="9" text-anchor="start" fill="#065f46">+ rollups</text>

  <!-- orchestrator → Cache, down the free right margin -->
  <path d="M556,86 C680,86 842,112 842,246 C842,314 796,344 756,350"
        stroke="#047857" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>
  <text x="858" y="182" font-size="9" text-anchor="middle" fill="#065f46">cache</text>
  <text x="858" y="194" font-size="9" text-anchor="middle" fill="#065f46">reads</text>
</svg>
