<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" width="900" height="424"
     font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#64748b"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="900" height="424" fill="#fafaf9"/>

  <rect x="16" y="30"  width="868" height="92"  rx="8" fill="none" stroke="#bfdbfe"/>
  <rect x="16" y="140" width="868" height="136" rx="8" fill="none" stroke="#99f6e4"/>
  <rect x="16" y="294" width="868" height="116" rx="8" fill="none" stroke="#a7f3d0"/>
  <text x="28" y="46"  font-size="10" font-weight="600" fill="#1e3a8a" letter-spacing="1">CONTROL PLANE</text>
  <text x="28" y="156" font-size="10" font-weight="600" fill="#115e59" letter-spacing="1">DATA PLANE</text>
  <text x="28" y="310" font-size="10" font-weight="600" fill="#065f46" letter-spacing="1">DATA STORAGE</text>

  <!-- control plane -->
  <rect x="32" y="58" width="94" height="46" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="79" y="79" font-size="12" font-weight="600" text-anchor="middle" fill="#1e3a8a">Browser</text>
  <text x="79" y="94" font-size="10" text-anchor="middle" fill="#64748b">operator</text>

  <rect x="176" y="58" width="130" height="46" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="241" y="78" font-size="12" font-weight="600" text-anchor="middle" fill="#1e3a8a">jmeter-cloud-ui</text>
  <text x="241" y="93" font-size="10" text-anchor="middle" fill="#64748b">nginx + React · 8086</text>

  <rect x="372" y="58" width="196" height="46" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="470" y="78" font-size="12" font-weight="600" text-anchor="middle" fill="#1e3a8a">global-orchestrator</text>
  <text x="470" y="93" font-size="10" text-anchor="middle" fill="#475569">runs · capacity · registry · 8082</text>

  <line x1="126" y1="81" x2="172" y2="81" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="306" y1="81" x2="368" y2="81" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="341" y="74" font-size="9" text-anchor="middle" fill="#475569">/api/*</text>

  <!-- data plane: the hub's arm sits above the workers it creates -->
  <rect x="276" y="166" width="200" height="32" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="376" y="180" font-size="12" font-weight="600" text-anchor="middle" fill="#1e3a8a">regional-orchestrator</text>
  <text x="376" y="193" font-size="10" text-anchor="middle" fill="#64748b">8088 · pods · liveness · relay</text>

  <rect x="20" y="212" width="172" height="52" rx="6" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="106" y="232" font-size="12" font-weight="600" text-anchor="middle" fill="#115e59">document-service</text>
  <text x="106" y="247" font-size="10" text-anchor="middle" fill="#475569">plans · data · results · 8084</text>

  <rect x="276" y="212" width="200" height="56" rx="6" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="376" y="229" font-size="12" font-weight="600" text-anchor="middle" fill="#115e59">local-orchestrator</text>
  <text x="376" y="242" font-size="10" text-anchor="middle" fill="#475569">worker · 8080 · N per run</text>
  <rect x="306" y="247" width="140" height="16" rx="4" fill="#ffffff" stroke="#5eead4"/>
  <text x="376" y="259" font-size="10" text-anchor="middle" fill="#115e59">JMeter (child)</text>

  <rect x="600" y="212" width="150" height="52" rx="6" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="675" y="232" font-size="12" font-weight="600" text-anchor="middle" fill="#115e59">metrics-consumer</text>
  <text x="675" y="247" font-size="10" text-anchor="middle" fill="#475569">ingest · 8083</text>

  <path d="M228,104 C210,140 160,176 130,208" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <text x="176" y="180" font-size="9" text-anchor="start" fill="#475569">/api/v1/blob/*</text>

  <!-- global → regional (the only way the hub touches a data center) -->
  <path d="M420,104 L420,162" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <text x="412" y="130" font-size="9" text-anchor="end" fill="#475569">/api/v1/pods · /workers (liveness)</text>
  <text x="412" y="141" font-size="9" text-anchor="end" fill="#475569">/workers/status · /workers/{pod}/…</text>
  <!-- regional → worker -->
  <path d="M376,200 L376,208" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <text x="384" y="208" font-size="9" text-anchor="start" fill="#94a3b8">relays POST /test · status</text>
  <!-- no worker → hub control traffic: the kubelet is the liveness truth -->
  <text x="556" y="182" font-size="9" text-anchor="start" fill="#94a3b8">no heartbeats —</text>
  <text x="556" y="193" font-size="9" text-anchor="start" fill="#94a3b8">the Pod list is liveness</text>

  <line x1="272" y1="238" x2="194" y2="238" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="233" y="231" font-size="9" text-anchor="middle" fill="#475569">fetch · upload</text>

  <line x1="476" y1="244" x2="596" y2="244" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="556" y="237" font-size="9" text-anchor="start" fill="#475569">ingest</text>
  <text x="556" y="259" font-size="9" text-anchor="start" fill="#94a3b8">1×/s</text>

  <!-- data storage -->
  <rect x="256" y="322" width="300" height="72" rx="6" fill="#d1fae5" stroke="#047857"/>
  <text x="406" y="344" font-size="12" font-weight="600" text-anchor="middle" fill="#065f46">Database</text>
  <text x="406" y="362" font-size="10" text-anchor="middle" fill="#475569">run state · pod registry</text>
  <text x="406" y="378" font-size="10" text-anchor="middle" fill="#475569">metrics fact table · rollups</text>

  <rect x="624" y="334" width="128" height="48" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="688" y="354" font-size="12" font-weight="600" text-anchor="middle" fill="#065f46">Cache</text>
  <text x="688" y="369" font-size="10" text-anchor="middle" fill="#64748b">terminal-run results</text>

  <rect x="52" y="334" width="128" height="48" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="116" y="354" font-size="12" font-weight="600" text-anchor="middle" fill="#065f46">Grafana</text>
  <text x="116" y="369" font-size="10" text-anchor="middle" fill="#64748b">dashboard</text>

  <line x1="252" y1="358" x2="186" y2="358" stroke="#047857" stroke-width="1.4" marker-end="url(#ag)"/>
  <text x="219" y="351" font-size="9" text-anchor="middle" fill="#065f46">reads raw</text>

  <!-- orchestrator → Database, straight down the free corridor between worker and consumer -->
  <path d="M548,104 L548,318" stroke="#047857" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>
  <text x="540" y="290" font-size="9" text-anchor="end" fill="#065f46">run state · reads rollups</text>

  <!-- metrics-consumer → Database -->
  <path d="M640,268 L566,318" stroke="#047857" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>
  <text x="652" y="288" font-size="9" text-anchor="start" fill="#065f46">writes rows + rollups</text>

  <!-- orchestrator → Cache, down the free right margin -->
  <path d="M568,80 C690,80 842,112 842,246 C842,322 796,352 756,358"
        stroke="#047857" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>
  <text x="858" y="182" font-size="9" text-anchor="middle" fill="#065f46">cache</text>
  <text x="858" y="194" font-size="9" text-anchor="middle" fill="#065f46">reads</text>
</svg>
