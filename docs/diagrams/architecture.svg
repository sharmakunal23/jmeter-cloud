<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 860" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#475569"/>
    </marker>
    <marker id="arrowK" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#0d9488"/>
    </marker>
    <marker id="arrowO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <rect width="1120" height="860" fill="#ffffff"/>
  <text x="40" y="30" font-size="20" font-weight="700" fill="#0f172a">jmeter-cloud — system architecture</text>

  <!-- ── Swimlane backgrounds ── -->
  <rect x="24" y="48" width="1072" height="150" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="38" y="68" font-size="12" font-weight="700" fill="#1e40af" letter-spacing="1">CONTROL PLANE</text>

  <rect x="24" y="210" width="1072" height="200" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="38" y="230" font-size="12" font-weight="700" fill="#0f766e" letter-spacing="1">DATA PLANE</text>

  <rect x="24" y="422" width="1072" height="120" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="38" y="442" font-size="12" font-weight="700" fill="#047857" letter-spacing="1">STORAGE</text>

  <rect x="24" y="554" width="1072" height="150" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="38" y="574" font-size="12" font-weight="700" fill="#4338ca" letter-spacing="1">OBSERVABILITY</text>

  <!-- ── Control plane boxes ── -->
  <g font-size="14">
    <rect x="48" y="90" width="150" height="60" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="123" y="118" text-anchor="middle" font-weight="600" fill="#1e293b">Browser</text>
    <text x="123" y="136" text-anchor="middle" font-size="11" fill="#64748b">operator / engineer</text>

    <rect x="262" y="90" width="180" height="60" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <text x="352" y="114" text-anchor="middle" font-weight="600" fill="#1e3a8a">jmeter-cloud-ui</text>
    <text x="352" y="133" text-anchor="middle" font-size="11" fill="#2563eb" font-family="monospace">nginx · :8086</text>

    <rect x="506" y="84" width="230" height="72" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <text x="621" y="110" text-anchor="middle" font-weight="600" fill="#1e3a8a">global-orchestrator</text>
    <text x="621" y="128" text-anchor="middle" font-size="11" fill="#2563eb">run fan-out · pod registry</text>
    <text x="621" y="145" text-anchor="middle" font-size="11" fill="#2563eb" font-family="monospace">:8082</text>

    <rect x="800" y="84" width="200" height="72" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <text x="900" y="110" text-anchor="middle" font-weight="600" fill="#1e3a8a">document-service</text>
    <text x="900" y="128" text-anchor="middle" font-size="11" fill="#2563eb">blob gateway</text>
    <text x="900" y="145" text-anchor="middle" font-size="11" fill="#2563eb" font-family="monospace">:8084</text>
  </g>

  <!-- ── Data plane boxes ── -->
  <g font-size="14">
    <rect x="48" y="248" width="250" height="140" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="173" y="272" text-anchor="middle" font-weight="600" fill="#115e59">local-orchestrator  ×N</text>
    <text x="173" y="290" text-anchor="middle" font-size="11" fill="#0f766e">one per pod · tails JTL · aggregates 1s</text>
    <text x="173" y="307" text-anchor="middle" font-size="11" fill="#0f766e" font-family="monospace">:8080</text>
    <rect x="80" y="320" width="186" height="50" rx="6" fill="#f0fdfa" stroke="#0d9488" stroke-dasharray="3 2"/>
    <text x="173" y="343" text-anchor="middle" font-size="12" font-weight="600" fill="#115e59">JMeter child process</text>
    <text x="173" y="360" text-anchor="middle" font-size="10.5" fill="#0f766e">spawned · writes results.jtl</text>

    <rect x="360" y="262" width="210" height="96" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="465" y="288" text-anchor="middle" font-weight="600" fill="#115e59">Kafka  (KRaft)</text>
    <text x="465" y="306" text-anchor="middle" font-size="10.5" fill="#0f766e" font-family="monospace">jmeter.metrics.perSecond</text>
    <text x="465" y="322" text-anchor="middle" font-size="10.5" fill="#0f766e">+ .DLT</text>
    <text x="465" y="345" text-anchor="middle" font-size="10.5" fill="#0f766e" font-family="monospace">:9092 · schema-registry :8081</text>

    <rect x="636" y="270" width="200" height="80" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="736" y="298" text-anchor="middle" font-weight="600" fill="#115e59">metrics-consumer</text>
    <text x="736" y="316" text-anchor="middle" font-size="11" fill="#0f766e">batch INSERT · DLT routing</text>
    <text x="736" y="335" text-anchor="middle" font-size="11" fill="#0f766e" font-family="monospace">:8083</text>
  </g>

  <!-- ── Storage ── -->
  <g font-size="14">
    <rect x="360" y="450" width="380" height="80" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <line x1="550" y1="450" x2="550" y2="530" stroke="#059669" stroke-dasharray="3 3"/>
    <text x="455" y="480" text-anchor="middle" font-weight="600" font-size="12.5" fill="#065f46">jmetercloud_globalrun</text>
    <text x="455" y="500" text-anchor="middle" font-size="10.5" fill="#047857">run state · pods · apps · capacity</text>
    <text x="455" y="517" text-anchor="middle" font-size="10.5" fill="#047857" font-family="monospace">Postgres :5432</text>
    <text x="645" y="480" text-anchor="middle" font-weight="600" font-size="12.5" fill="#065f46">jmetercloud_metrics</text>
    <text x="645" y="500" text-anchor="middle" font-size="10.5" fill="#047857">"workerMetric" · weekly partitions</text>
    <text x="645" y="517" text-anchor="middle" font-size="10.5" fill="#047857">writer / reader roles</text>
  </g>

  <!-- ── Observability ── -->
  <g font-size="13.5">
    <rect x="48" y="600" width="180" height="64" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="138" y="628" text-anchor="middle" font-weight="600" fill="#3730a3">Prometheus</text>
    <text x="138" y="647" text-anchor="middle" font-size="11" fill="#4f46e5" font-family="monospace">:9090</text>

    <rect x="262" y="600" width="180" height="64" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="352" y="628" text-anchor="middle" font-weight="600" fill="#3730a3">Grafana</text>
    <text x="352" y="647" text-anchor="middle" font-size="11" fill="#4f46e5" font-family="monospace">:3000</text>

    <rect x="476" y="600" width="180" height="64" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="566" y="628" text-anchor="middle" font-weight="600" fill="#3730a3">Jaeger</text>
    <text x="566" y="647" text-anchor="middle" font-size="11" fill="#4f46e5" font-family="monospace">:16686 · OTLP :4318</text>
  </g>

  <!-- ── Edges: REST (solid) ── -->
  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <!-- Browser -> UI -->
    <line x1="198" y1="120" x2="256" y2="120"/>
    <!-- UI -> global-orchestrator -->
    <line x1="442" y1="116" x2="500" y2="116"/>
    <!-- UI -> document-service (arcs below the control lane) -->
    <path d="M442,138 Q640,196 798,140"/>
    <!-- global-orch -> local-orch (fan-out) -->
    <path d="M560,156 Q400,205 190,246"/>
    <!-- global-orch -> Postgres globalrun (down the gap between Kafka and metrics-consumer) -->
    <path d="M608,156 Q600,300 490,448"/>
    <!-- metrics-consumer -> Postgres metrics -->
    <line x1="710" y1="350" x2="660" y2="448"/>
    <!-- local-orch -> document-service (fetch plan / push results) -->
    <path d="M298,290 Q580,225 880,158"/>
    <!-- Grafana -> Postgres metrics -->
    <path d="M380,598 Q520,560 660,532"/>
    <!-- Grafana -> Prometheus -->
    <line x1="260" y1="632" x2="230" y2="632"/>
  </g>

  <!-- ── Edges: Kafka (dashed) ── -->
  <g stroke="#0d9488" stroke-width="1.8" fill="none" stroke-dasharray="7 4" marker-end="url(#arrowK)">
    <line x1="298" y1="320" x2="358" y2="310"/>
    <line x1="570" y1="310" x2="634" y2="310"/>
  </g>

  <!-- ── Edges: observability (dotted) ── -->
  <g stroke="#4f46e5" stroke-width="1.6" fill="none" stroke-dasharray="2 4" marker-end="url(#arrowO)">
    <path d="M150,600 Q170,470 360,360"/>            <!-- prometheus scrape data plane -->
    <path d="M120,600 Q90,400 90,160"/>               <!-- prometheus scrape control plane -->
    <path d="M560,600 Q560,460 600,360"/>             <!-- services -> jaeger (visual) -->
  </g>

  <!-- ── Edge labels ── -->
  <g font-size="11" fill="#334155">
    <text x="228" y="112" text-anchor="middle">HTTP</text>
    <text x="473" y="110" text-anchor="middle">REST</text>
    <text x="338" y="192" text-anchor="middle" fill="#1e293b">fan-out POST /api/v1/test</text>
    <text x="662" y="176" text-anchor="middle" fill="#2563eb">/api/v1/blob*</text>
    <text x="762" y="232" text-anchor="middle" fill="#2563eb">fetch plan · push results</text>
  </g>
  <g font-size="11" fill="#0f766e">
    <text x="329" y="306" text-anchor="middle">Avro</text>
    <text x="603" y="302" text-anchor="middle">consume</text>
  </g>
  <g font-size="11" fill="#065f46">
    <text x="712" y="398" text-anchor="middle">INSERT … ON CONFLICT</text>
    <text x="520" y="556" text-anchor="middle">SQL datasource</text>
  </g>
  <g font-size="11" fill="#4338ca">
    <text x="250" y="500" text-anchor="middle">scrape /actuator/prometheus</text>
    <text x="762" y="440" text-anchor="middle">OTLP traces</text>
  </g>

  <!-- ── Legend ── -->
  <g transform="translate(720,580)" font-size="12.5">
    <rect x="0" y="0" width="376" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="16" y="24" font-weight="700" fill="#0f172a">Legend</text>
    <line x1="16" y1="44" x2="56" y2="44" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="64" y="48" fill="#334155">REST / HTTP (synchronous)</text>
    <line x1="16" y1="70" x2="56" y2="70" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#arrowK)"/>
    <text x="64" y="74" fill="#334155">Kafka (async, Avro)</text>
    <line x1="16" y1="96" x2="56" y2="96" stroke="#4f46e5" stroke-width="1.6" stroke-dasharray="2 4" marker-end="url(#arrowO)"/>
    <text x="64" y="100" fill="#334155">Metrics scrape / trace export</text>
  </g>
</svg>
