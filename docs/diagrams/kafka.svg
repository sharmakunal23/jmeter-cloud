<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ak" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#0d9488"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#dc2626"/></marker>
    <marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#4f46e5"/></marker>
  </defs>
  <rect width="1040" height="440" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#0f172a">kafka — metrics transport (local KRaft)</text>
  <text x="30" y="56" font-size="12.5" fill="#64748b">Single-broker KRaft + Schema Registry. Avro-encoded; key = {region}|{workerId}|{label}.</text>

  <g font-size="12.5">
    <rect x="30" y="148" width="170" height="76" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="115" y="178" text-anchor="middle" font-weight="600" fill="#115e59">local-orchestrator</text>
    <text x="115" y="197" text-anchor="middle" font-size="10.5" fill="#0f766e">producer</text>

    <!-- broker -->
    <rect x="244" y="100" width="380" height="220" rx="12" fill="#f0fdfa" stroke="#5eead4"/>
    <text x="264" y="124" font-size="11" font-weight="700" fill="#0f766e" letter-spacing="1">KAFKA BROKER · :9092 / :29092</text>

    <rect x="272" y="146" width="220" height="64" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="382" y="172" text-anchor="middle" font-weight="600" font-size="12" fill="#115e59">metrics.perSecond</text>
    <text x="382" y="192" text-anchor="middle" font-size="10" fill="#0f766e">12 partitions · snappy</text>

    <rect x="272" y="234" width="220" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="382" y="259" text-anchor="middle" font-weight="600" font-size="12" fill="#991b1b">…perSecond.DLT</text>
    <text x="382" y="278" text-anchor="middle" font-size="10" fill="#b91c1c">12 partitions</text>

    <rect x="668" y="148" width="170" height="76" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <text x="753" y="178" text-anchor="middle" font-weight="600" fill="#1e3a8a">metrics-consumer</text>
    <text x="753" y="197" text-anchor="middle" font-size="10.5" fill="#2563eb">consumer group</text>

    <!-- schema registry below -->
    <rect x="330" y="356" width="220" height="64" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="440" y="382" text-anchor="middle" font-weight="600" fill="#3730a3">Schema Registry <tspan font-family="monospace" font-size="10.5">:8081</tspan></text>
    <text x="440" y="401" text-anchor="middle" font-size="10" fill="#4f46e5" font-family="monospace">WorkerMetric.avsc</text>
  </g>

  <!-- main flow (dashed amber) -->
  <g stroke="#0d9488" stroke-width="1.8" fill="none" stroke-dasharray="7 4" marker-end="url(#ak)">
    <line x1="200" y1="184" x2="270" y2="178"/>
    <line x1="492" y1="178" x2="666" y2="184"/>
  </g>
  <!-- poison -> DLT (red) -->
  <g stroke="#dc2626" stroke-width="1.5" fill="none" stroke-dasharray="5 3" marker-end="url(#ar)">
    <path d="M690,224 Q620,300 494,272"/>
  </g>
  <!-- schema registry dotted to producer + consumer -->
  <g stroke="#4f46e5" stroke-width="1.4" fill="none" stroke-dasharray="2 4" marker-end="url(#ap)">
    <path d="M360,356 Q200,330 120,226"/>
    <path d="M540,360 Q720,330 753,226"/>
  </g>

  <g font-size="10.5">
    <text x="232" y="170" text-anchor="middle" fill="#0f766e">produce</text>
    <text x="579" y="166" text-anchor="middle" fill="#0f766e">consume</text>
    <text x="588" y="224" text-anchor="middle" fill="#b91c1c">poison → DLT</text>
    <text x="214" y="340" text-anchor="middle" fill="#4f46e5">serialize Avro</text>
    <text x="690" y="340" text-anchor="middle" fill="#4f46e5">deserialize Avro</text>
  </g>
</svg>
