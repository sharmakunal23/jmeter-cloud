<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 392" width="900" height="392"
     font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="392" fill="#fafaf9"/>

  <text x="16" y="26" font-size="15" font-weight="700" fill="#0f172a">Boot order — docker compose up</text>
  <text x="16" y="44" font-size="10" fill="#64748b">Every arrow is a `depends_on` edge — waits for healthy, or for a one-shot to complete. Cold build ≈ 5 min, warm ≈ 30 s.</text>

  <text x="16" y="72"  font-size="9" font-weight="600" fill="#94a3b8" letter-spacing="1">1 · INFRA</text>
  <text x="16" y="164" font-size="9" font-weight="600" fill="#94a3b8" letter-spacing="1">2 · INIT</text>
  <text x="16" y="246" font-size="9" font-weight="600" fill="#94a3b8" letter-spacing="1">3 · SERVICES</text>
  <text x="16" y="336" font-size="9" font-weight="600" fill="#94a3b8" letter-spacing="1">4 · EDGE</text>

  <!-- 1 infra -->
  <g font-size="11" text-anchor="middle">
    <rect x="150" y="58" width="150" height="42" rx="6" fill="#d1fae5" stroke="#047857"/>
    <text x="225" y="76" font-weight="600" fill="#065f46">Oracle</text>
    <text x="225" y="90" font-size="10" fill="#475569">:1521</text>

    <rect x="340" y="58" width="150" height="42" rx="6" fill="#d1fae5" stroke="#047857"/>
    <text x="415" y="76" font-weight="600" fill="#065f46">Redis</text>
    <text x="415" y="90" font-size="10" fill="#475569">:6379</text>

    <rect x="530" y="58" width="170" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="615" y="76" font-weight="600" fill="#475569">MailHog</text>
    <text x="615" y="90" font-size="10" fill="#94a3b8">:8025 · no dependents</text>
  </g>

  <!-- 2 init -->
  <rect x="150" y="140" width="188" height="42" rx="6" fill="#ecfdf5" stroke="#047857" stroke-dasharray="4,3"/>
  <text x="244" y="158" font-size="11" font-weight="600" text-anchor="middle" fill="#065f46">flyway migrate</text>
  <text x="244" y="172" font-size="10" text-anchor="middle" fill="#475569">one-shot · migrate then exit</text>

  <!-- 3 services -->
  <g font-size="11" text-anchor="middle">
    <rect x="150" y="222" width="164" height="42" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="232" y="240" font-weight="600" fill="#1e3a8a">metrics-consumer</text>
    <text x="232" y="254" font-size="10" fill="#475569">:8083</text>

    <rect x="330" y="222" width="164" height="42" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="412" y="240" font-weight="600" fill="#1e3a8a">global-orchestrator</text>
    <text x="412" y="254" font-size="10" fill="#475569">:8082</text>

    <rect x="510" y="222" width="150" height="42" rx="6" fill="#ffffff" stroke="#93c5fd"/>
    <text x="585" y="240" font-weight="600" fill="#1e3a8a">document-service</text>
    <text x="585" y="254" font-size="10" fill="#475569">:8084 · no deps</text>
  </g>

  <!-- 4 edge -->
  <rect x="330" y="312" width="164" height="42" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="412" y="330" font-size="11" font-weight="600" text-anchor="middle" fill="#1e3a8a">jmeter-cloud-ui</text>
  <text x="412" y="344" font-size="10" text-anchor="middle" fill="#475569">:8086</text>

  <rect x="530" y="312" width="266" height="42" rx="6" fill="#f0fdfa" stroke="#5eead4" stroke-dasharray="4,3"/>
  <text x="663" y="330" font-size="11" font-weight="600" text-anchor="middle" fill="#115e59">local-orchestrator (workers)</text>
  <text x="663" y="344" font-size="10" text-anchor="middle" fill="#475569">not started by compose — provisioned on demand</text>

  <!-- edges -->
  <g stroke="#64748b" stroke-width="1.3" fill="none" marker-end="url(#b)">
    <path d="M225,100 L232,136"/>
    <path d="M244,182 L232,218"/>
    <path d="M262,100 C300,116 380,120 404,218"/>
    <path d="M338,161 C372,161 398,180 410,218"/>
    <path d="M415,100 L415,136 L415,218" stroke-dasharray="0"/>
    <path d="M412,264 L412,308"/>
    <path d="M560,264 C520,282 470,290 452,308"/>
  </g>
  <text x="196" y="124" font-size="9" text-anchor="middle" fill="#94a3b8">healthy</text>
  <text x="290" y="206" font-size="9" text-anchor="middle" fill="#94a3b8">completed</text>
</svg>
