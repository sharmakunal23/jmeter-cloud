<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 454" width="1100" height="454" role="img" aria-label="Compose boot order: oracle must be healthy before the DB migration runs, the migration must complete before the metrics consumer and the performance platform start, and the UI waits for both the platform and the document service. Workers are provisioned on demand, never by compose.">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
        </marker>
    </defs>
    <rect x="0" y="0" width="1100" height="454" fill="#ffffff"/>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
        <text x="14" y="28" font-size="15" font-weight="700" fill="#0f172a">Boot order &#8212; docker compose up</text>
        <text x="14" y="48" font-size="11" fill="#64748b">Every arrow is a depends_on edge. Edges implied by a longer chain are omitted.</text>

        <g font-size="10" font-weight="600" fill="#64748b" letter-spacing="1">
            <text x="14" y="110">1 &#183; INFRA</text>
            <text x="14" y="204">2 &#183; INIT</text>
            <text x="14" y="308">3 &#183; SERVICES</text>
            <text x="14" y="412">4 &#183; EDGE</text>
        </g>

        <g fill="none" stroke="#94a3b8" stroke-width="2">
            <line x1="275" y1="132" x2="275" y2="174" marker-end="url(#arrow)"/>
            <line x1="275" y1="226" x2="275" y2="252"/>
            <line x1="275" y1="252" x2="590" y2="252"/>
            <line x1="275" y1="252" x2="275" y2="278" marker-end="url(#arrow)"/>
            <line x1="590" y1="252" x2="590" y2="278" marker-end="url(#arrow)"/>
            <line x1="590" y1="330" x2="590" y2="356"/>
            <line x1="905" y1="330" x2="905" y2="356"/>
            <line x1="905" y1="356" x2="590" y2="356"/>
            <line x1="590" y1="356" x2="590" y2="382" marker-end="url(#arrow)"/>
        </g>

        <g font-size="11" fill="#64748b">
            <text x="285" y="157">healthy</text>
            <text x="285" y="270">completed successfully</text>
            <text x="600" y="374">healthy</text>
        </g>

        <rect x="130" y="80" width="290" height="52" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
        <text x="275" y="101" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">oracle</text>
        <text x="275" y="118" text-anchor="middle" font-size="11" fill="#475569">Database &#183; 1521</text>
        <rect x="760" y="80" width="290" height="52" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="905" y="101" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">mailhog</text>
        <text x="905" y="118" text-anchor="middle" font-size="11" fill="#475569">SMTP sink &#183; 8025 &#183; no deps</text>

        <rect x="130" y="174" width="290" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
        <text x="275" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">db-migration</text>
        <text x="275" y="212" text-anchor="middle" font-size="11" fill="#475569">one-shot &#183; runs the SQL, then exits</text>

        <rect x="130" y="278" width="290" height="52" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
        <text x="275" y="299" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">card-zate-metrics-consumer</text>
        <text x="275" y="316" text-anchor="middle" font-size="11" fill="#475569">8083</text>
        <rect x="445" y="278" width="290" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
        <text x="590" y="299" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">card-zate-performance-platform</text>
        <text x="590" y="316" text-anchor="middle" font-size="11" fill="#475569">8082</text>
        <rect x="760" y="278" width="290" height="52" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
        <text x="905" y="299" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">document-service</text>
        <text x="905" y="316" text-anchor="middle" font-size="11" fill="#475569">8084 &#183; no deps</text>

        <rect x="445" y="382" width="290" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
        <text x="590" y="403" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">card-zate-performance-platform-ui</text>
        <text x="590" y="420" text-anchor="middle" font-size="11" fill="#475569">8086</text>
        <rect x="760" y="382" width="290" height="52" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,4"/>
        <text x="905" y="403" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">card-zate-jmeter-runner</text>
        <text x="905" y="420" text-anchor="middle" font-size="11" fill="#475569">not started by compose</text>
    </g>
</svg>
