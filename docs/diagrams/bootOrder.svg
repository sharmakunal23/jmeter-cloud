<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#64748b"/></marker>
  </defs>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#0f172a">Boot order — <tspan font-family="monospace" font-size="16">docker compose up</tspan></text>
  <text x="30" y="56" font-size="12.5" fill="#64748b">Each arrow = "waits until healthy / completed". Cold build ≈ 5 min, warm start ≈ 30 s.</text>

  <!-- Tier labels -->
  <g font-size="11" font-weight="700" letter-spacing="1">
    <text x="30" y="72" fill="#94a3b8">1 · INFRA</text>
    <text x="30" y="182" fill="#94a3b8">2 · INIT (one-shot)</text>
    <text x="30" y="293" fill="#94a3b8">3 · SERVICES</text>
    <text x="30" y="445" fill="#94a3b8">4 · EDGE</text>
  </g>

  <g font-size="13">
    <!-- Tier 1 -->
    <rect x="150" y="78" width="160" height="56" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="230" y="102" text-anchor="middle" font-weight="600" fill="#115e59">Kafka (KRaft)</text>
    <text x="230" y="120" text-anchor="middle" font-size="10.5" fill="#0f766e" font-family="monospace">:9092</text>

    <rect x="560" y="78" width="160" height="56" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="640" y="102" text-anchor="middle" font-weight="600" fill="#065f46">Postgres</text>
    <text x="640" y="120" text-anchor="middle" font-size="10.5" fill="#047857" font-family="monospace">:5432</text>

    <!-- Tier 2 -->
    <rect x="80" y="188" width="150" height="56" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.3"/>
    <text x="155" y="212" text-anchor="middle" font-weight="600" fill="#115e59">schema-registry</text>
    <text x="155" y="230" text-anchor="middle" font-size="10.5" fill="#0f766e" font-family="monospace">:8081</text>

    <rect x="252" y="188" width="150" height="56" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.3" stroke-dasharray="4 2"/>
    <text x="327" y="212" text-anchor="middle" font-weight="600" fill="#115e59">topic-init</text>
    <text x="327" y="230" text-anchor="middle" font-size="10.5" fill="#0f766e">create topics → exit</text>

    <rect x="560" y="188" width="160" height="56" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.3" stroke-dasharray="4 2"/>
    <text x="640" y="212" text-anchor="middle" font-weight="600" fill="#065f46">flyway-migrate</text>
    <text x="640" y="230" text-anchor="middle" font-size="10.5" fill="#047857">migrate → exit</text>

    <!-- Tier 3 -->
    <rect x="60" y="300" width="170" height="56" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <text x="145" y="324" text-anchor="middle" font-weight="600" fill="#1e3a8a">metrics-consumer</text>
    <text x="145" y="342" text-anchor="middle" font-size="10.5" fill="#2563eb" font-family="monospace">:8083</text>

    <rect x="250" y="300" width="180" height="56" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <text x="340" y="324" text-anchor="middle" font-weight="600" fill="#1e3a8a">global-orchestrator</text>
    <text x="340" y="342" text-anchor="middle" font-size="10.5" fill="#2563eb" font-family="monospace">:8082</text>

    <rect x="450" y="300" width="160" height="56" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <text x="530" y="324" text-anchor="middle" font-weight="600" fill="#1e3a8a">document-service</text>
    <text x="530" y="342" text-anchor="middle" font-size="10.5" fill="#2563eb" font-family="monospace">:8084</text>

    <rect x="630" y="300" width="120" height="56" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.3"/>
    <text x="690" y="324" text-anchor="middle" font-weight="600" font-size="12" fill="#3730a3">Prometheus</text>
    <text x="690" y="342" text-anchor="middle" font-size="10.5" fill="#4f46e5" font-family="monospace">:9090</text>

    <rect x="630" y="372" width="120" height="50" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.3"/>
    <text x="690" y="402" text-anchor="middle" font-weight="600" font-size="12" fill="#3730a3">Grafana :3000</text>

    <!-- Tier 4 -->
    <rect x="250" y="452" width="180" height="56" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <text x="340" y="476" text-anchor="middle" font-weight="600" fill="#1e3a8a">jmeter-cloud-ui</text>
    <text x="340" y="494" text-anchor="middle" font-size="10.5" fill="#2563eb" font-family="monospace">:8086</text>
  </g>

  <!-- dynamic note -->
  <rect x="470" y="452" width="290" height="56" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-dasharray="4 3"/>
  <text x="615" y="474" text-anchor="middle" font-size="11.5" font-weight="600" fill="#115e59">local-orchestrator (workers)</text>
  <text x="615" y="492" text-anchor="middle" font-size="10.5" fill="#115e59">provisioned on demand by Capacity tab</text>

  <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <!-- kafka -> schema, topic-init -->
    <path d="M200,134 Q160,160 155,186"/>
    <path d="M240,134 Q300,160 327,186"/>
    <!-- postgres -> flyway -->
    <line x1="640" y1="134" x2="640" y2="186"/>
    <!-- schema/topic-init -> services -->
    <path d="M155,244 Q150,270 145,298"/>
    <path d="M327,244 Q335,270 340,298"/>
    <!-- flyway -> consumer + global -->
    <path d="M600,244 Q400,275 360,298"/>
    <path d="M610,240 Q320,280 200,310 L228,320"/>
    <!-- postgres -> prometheus chain implied; prometheus -> grafana -->
    <line x1="690" y1="356" x2="690" y2="370"/>
    <!-- services -> UI -->
    <path d="M340,356 L340,450"/>
    <path d="M520,356 Q420,400 360,450"/>
  </g>
</svg>
