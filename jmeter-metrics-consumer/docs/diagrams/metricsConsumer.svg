<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#64748b"/></marker>
    <marker id="s" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#047857"/></marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#dc2626"/></marker>
    <marker id="w" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#d97706"/></marker>
  </defs>
  <rect width="900" height="370" fill="#fafaf9"/>
  <text x="30" y="34" font-size="15" font-weight="700" fill="#0f172a">jmeter-metrics-consumer — HTTP ingest → the group's fact table</text>
  <text x="30" y="54" font-size="10" fill="#64748b">?groupId= picks the table through GROUP_REGISTRY; dimensions are get-or-create; the insert is first-write-wins. Poison is rejected at the edge.</text>

  <!-- data plane -->
  <rect x="30" y="76" width="840" height="120" rx="10" fill="none" stroke="#99f6e4" stroke-width="1.4"/>
  <text x="44" y="94" font-size="10" font-weight="600" letter-spacing="1" fill="#115e59">DATA PLANE</text>

  <g>
    <rect x="50" y="106" width="170" height="70" rx="8" fill="#ffffff" stroke="#5eead4" stroke-width="1.3"/>
    <text x="135" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#115e59">worker pods</text>
    <text x="135" y="146" text-anchor="middle" font-size="10" fill="#475569" font-family="monospace">local-orchestrator ×N</text>
    <text x="135" y="162" text-anchor="middle" font-size="10" fill="#475569">JSON WorkerMetricBatch</text>

    <rect x="260" y="106" width="190" height="70" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/>
    <text x="355" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#115e59">IngestController</text>
    <text x="355" y="146" text-anchor="middle" font-size="10" fill="#475569" font-family="monospace">POST /api/v1/ingest?groupId=</text>
    <text x="355" y="162" text-anchor="middle" font-size="10" fill="#475569">auth (cloud) · 202/400/413/503</text>

    <rect x="490" y="106" width="230" height="70" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/>
    <text x="605" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#115e59">WorkerMetricWriter</text>
    <text x="605" y="146" text-anchor="middle" font-size="10" fill="#475569" font-family="monospace">GROUP_REGISTRY → &lt;P&gt;_METRICS</text>
    <text x="605" y="162" text-anchor="middle" font-size="10" fill="#475569">dims get-or-create · dup-safe INSERT</text>
  </g>

  <!-- outcomes strip -->
  <g>
    <rect x="260" y="218" width="190" height="40" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="3,3"/>
    <text x="355" y="234" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">terminal reject</text>
    <text x="355" y="249" text-anchor="middle" font-size="9" fill="#b91c1c">400 · 413 — worker drops + counts</text>

    <rect x="490" y="218" width="230" height="40" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.3" stroke-dasharray="3,3"/>
    <text x="605" y="234" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">503 · retry path</text>
    <text x="605" y="249" text-anchor="middle" font-size="9" fill="#b45309">worker disk buffer + sweeper replays</text>
  </g>

  <!-- data storage -->
  <rect x="30" y="274" width="840" height="76" rx="10" fill="none" stroke="#a7f3d0" stroke-width="1.4"/>
  <text x="44" y="292" font-size="10" font-weight="600" letter-spacing="1" fill="#065f46">DATA STORAGE</text>
  <rect x="730" y="284" width="140" height="58" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.4"/>
  <text x="800" y="302" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">Database</text>
  <text x="800" y="318" text-anchor="middle" font-size="10" fill="#047857" font-family="monospace">CARDZATE_DB_GRAF</text>
  <text x="800" y="333" text-anchor="middle" font-size="10" fill="#047857" font-family="monospace">&lt;GROUP_ID&gt;_METRICS</text>

  <!-- main path -->
  <g stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <line x1="220" y1="141" x2="258" y2="141"/>
    <line x1="450" y1="141" x2="488" y2="141"/>
  </g>
  <path d="M720,141 L800,141 L800,282" stroke="#047857" stroke-width="1.4" fill="none" marker-end="url(#s)"/>

  <!-- outcome paths -->
  <path d="M355,176 V216" stroke="#dc2626" stroke-width="1.3" fill="none" stroke-dasharray="3,3" marker-end="url(#r)"/>
  <path d="M605,176 V216" stroke="#d97706" stroke-width="1.3" fill="none" stroke-dasharray="3,3" marker-end="url(#w)"/>

  <g font-size="9" fill="#64748b">
    <text x="362" y="209" text-anchor="start" fill="#b91c1c">undecodable · oversized · unknown group</text>
    <text x="612" y="209" text-anchor="start" fill="#b45309">database down</text>
    <text x="720" y="318" text-anchor="end" fill="#047857">INSERT, first wins</text>
  </g>
</svg>
