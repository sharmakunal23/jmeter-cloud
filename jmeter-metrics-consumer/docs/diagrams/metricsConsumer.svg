<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 340" width="1060" height="340" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#475569"/></marker>
    <marker id="ak" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#0d9488"/></marker>
  </defs>
  <rect width="1060" height="340" fill="#fafaf9"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#0f172a">jmeter-metrics-consumer — HTTP ingest → Oracle</text>
  <text x="30" y="56" font-size="12.5" fill="#64748b">JSON ingest, staged exactly-once insert. Poison is rejected at the edge; durability lives in the workers' disk buffer.</text>

  <g font-size="12.5">
    <rect x="30" y="104" width="170" height="78" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
    <text x="115" y="134" text-anchor="middle" font-weight="600" fill="#115e59">worker pods</text>
    <text x="115" y="153" text-anchor="middle" font-size="10" fill="#0f766e" font-family="monospace">local-orchestrator ×N</text>
    <text x="115" y="169" text-anchor="middle" font-size="10" fill="#0f766e">JSON WorkerMetricBatch, 1/s</text>

    <rect x="250" y="104" width="180" height="78" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <text x="340" y="130" text-anchor="middle" font-weight="600" fill="#1e3a8a">IngestController</text>
    <text x="340" y="149" text-anchor="middle" font-size="10" fill="#2563eb" font-family="monospace">POST /api/v1/ingest</text>
    <text x="340" y="166" text-anchor="middle" font-size="10" fill="#2563eb">decode · 202/400/413/503</text>

    <rect x="480" y="104" width="190" height="78" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <text x="575" y="130" text-anchor="middle" font-weight="600" fill="#1e3a8a">WorkerMetricWriter</text>
    <text x="575" y="146" text-anchor="middle" font-size="10" fill="#2563eb">batch → stage tables</text>
    <text x="575" y="161" text-anchor="middle" font-size="10" fill="#2563eb">ingestStaged: prune replays</text>
    <text x="575" y="176" text-anchor="middle" font-size="9" fill="#2563eb">INSERT raw · MERGE rollup deltas</text>

    <rect x="720" y="98" width="230" height="90" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="835" y="122" text-anchor="middle" font-weight="600" fill="#065f46">Oracle</text>
    <text x="835" y="140" text-anchor="middle" font-size="10" fill="#047857" font-family="monospace">metrics."workerMetric"</text>
    <text x="835" y="155" text-anchor="middle" font-size="9" fill="#047857">interval partitions, weekly</text>
    <text x="835" y="173" text-anchor="middle" font-size="8.5" fill="#047857" font-family="monospace">runSecond · runSecondStatus · runLabel</text>

    <!-- terminal reject (replaced the Kafka DLT) -->
    <rect x="240" y="244" width="200" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="340" y="270" text-anchor="middle" font-weight="600" fill="#991b1b">terminal reject</text>
    <text x="340" y="289" text-anchor="middle" font-size="10" fill="#b91c1c">400 / 413 — worker drops + counts</text>

    <!-- retry path -->
    <rect x="480" y="244" width="190" height="64" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="575" y="270" text-anchor="middle" font-weight="600" font-size="11.5" fill="#92400e">503 · retry path</text>
    <text x="575" y="289" text-anchor="middle" font-size="10" fill="#b45309">worker disk buffer + sweeper</text>
  </g>

  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="430" y1="143" x2="478" y2="143"/>
    <line x1="670" y1="143" x2="718" y2="143"/>
  </g>
  <g stroke="#0d9488" stroke-width="1.8" fill="none" stroke-dasharray="7 4" marker-end="url(#ak)">
    <line x1="200" y1="143" x2="248" y2="143"/>
  </g>
  <g stroke="#dc2626" stroke-width="1.5" fill="none" stroke-dasharray="5 3" marker-end="url(#a)">
    <path d="M340,182 V242"/>
  </g>
  <g stroke="#d97706" stroke-width="1.5" fill="none" stroke-dasharray="5 3" marker-end="url(#a)">
    <path d="M575,182 V242"/>
  </g>

  <g font-size="10.5" fill="#64748b">
    <text x="224" y="135" text-anchor="middle" fill="#0f766e">POST</text>
    <text x="454" y="135" text-anchor="middle">map</text>
    <text x="694" y="135" text-anchor="middle">persist</text>
    <text x="348" y="216" text-anchor="start" fill="#b91c1c">undecodable / oversized</text>
    <text x="583" y="216" text-anchor="start" fill="#b45309">DB down</text>
  </g>
</svg>
