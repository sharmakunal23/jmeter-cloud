spring:
  application:
    name: jmeter-metrics-consumer
  profiles:
    default: local
  datasource:
    # Oracle, one PDB. The service connects AS the schema owner
    # (CARDZATE_DB_GRAF) — the hosted proxy client does the same — so every
    # statement uses unqualified names.
    url: ${ORACLE_METRICS_URL:jdbc:oracle:thin:@//oracle:1521/FREEPDB1}
    username: ${ORACLE_METRICS_USER:CARDZATE_DB_GRAF}
    password: ${ORACLE_METRICS_PASSWORD:localdev}
    hikari:
      pool-name: metricsConsumerWriterPool
      # Sized like the hosted consumer; the same env names override there.
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:4}
      data-source-properties:
        # Every chunk reuses the same three statements; the implicit cache
        # skips re-parsing them on each pooled connection.
        oracle.jdbc.implicitStatementCacheSize: 16
  jdbc:
    template:
      # Bounds a hung database call so one stuck chunk cannot pin a request
      # thread (Oracle has no server-side statement timeout to set instead).
      query-timeout: 60

server:
  port: ${HTTP_PORT:8083}
  address: ${HTTP_BIND_ADDRESS:0.0.0.0}
  tomcat:
    threads:
      # 20× the pool, as on the hosted consumer.
      max: ${TOMCAT_MAX_THREADS:200}

management:
  endpoints:
    web:
      exposure:
        # health,info ONLY. Never drop health — the compose healthcheck, the
        # UI Home checklist and the cloud probes all depend on it.
        include: keepalive,health,info
  endpoint:
    health:
      show-details: always
      # Liveness is split from readiness so ingestProgress can NEVER trip it.
      # That indicator flips DOWN after 5 idle minutes — the quiet window after
      # a test ends — and a liveness probe on the aggregate /actuator/health
      # would restart the consumer through every such gap.
      #   liveness  → /actuator/health/liveness   (process up only)
      #   readiness → /actuator/health/readiness  (DB reachable)
      # The aggregate still includes ingestProgress, for humans and the UI.
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    db:
      enabled: true
  # Belt-and-braces so the default in-memory registry doesn't pretend to
  # export anything. This service ships no metrics or tracing.
  defaults:
    metrics:
      export:
        enabled: false

# Springdoc / Swagger UI — point the bundled UI at the hand-curated YAML
# (bundled into the JAR via the pom's resource mapping). Visitors hit
# /swagger-ui.html → /swagger-ui/index.html → fetches /openapi.yaml.
# The auto-generated /v3/api-docs (Spring-MVC-introspected spec) stays
# enabled as a sanity check — diff against /openapi.yaml to catch a
# controller change that wasn't reflected in the curated YAML.
springdoc:
  swagger-ui:
    url: /openapi.yaml
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

metricsConsumer:
  # Rows per JDBC batch (the hosted consumer's knob and default).
  maxRowsPerInsert: ${METRICS_MAX_ROWS_PER_INSERT:5000}
  # The bearer token workers present on POST /api/v1/ingest. Enforced by
  # IngestAuthFilter under the cloud profile only (blank locally, where the
  # platform runs without auth); under cloud a blank value fails boot.
  auth:
    token: ${METRICS_AUTH_TOKEN:}
  # GROUP_REGISTRY lookups (?groupId= → fact table) and the dimension ids
  # (RUN / WORKER / LABEL) are cached per instance. A repointed or disabled
  # group is honoured only after the TTL or a restart; an unknown group is
  # never cached, so a newly registered one works on its next request.
  groupCache:
    ttl: ${GROUP_CACHE_TTL:24h}
    maxSize: ${GROUP_CACHE_MAX_SIZE:1024}
  dimCache:
    ttl: ${DIM_CACHE_TTL:24h}
    maxSize: ${DIM_CACHE_MAX_SIZE:100000}
  # Ingest body cap — defense in depth against oversize envelopes.
  ingest:
    maxBodyBytes: ${METRICS_INGEST_MAX_BODY_BYTES:2097152}
  # intervalMs: cadence of the INFO heartbeat log.
  # staleAfterSeconds: ingestProgress flips DOWN after this long with no
  #   envelope. 5 min is wider than a typical gap between runs — raise it if
  #   yours are longer.
  heartbeat:
    intervalMs: ${HEARTBEAT_INTERVAL_MS:30000}
    staleAfterSeconds: ${HEARTBEAT_STALE_AFTER_SECONDS:300}
  # Retention is the database's job: each group's nightly DBMS_SCHEDULER job
  # (<GROUP_ID>_NIGHTLY_MAINT, rendered from oracle/groups/) archives aged
  # daily partitions into <GROUP_ID>_METRICS_H and prunes history.
