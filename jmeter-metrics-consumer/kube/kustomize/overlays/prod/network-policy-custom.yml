# Generated once by the Track 7 layout (2026-08-30); hand-maintained since.
# Tier-specific policies for metrics-consumer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-consumer.allow-egress
spec:
  podSelector:
    matchLabels:
      app: metrics-consumer
  policyTypes: [Egress]
  egress:
    - to:                             # DNS
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: REPLACE_ME_ORACLE_HOST_IP/32          # the Oracle listener
      ports:
        - protocol: TCP
          port: 1521
