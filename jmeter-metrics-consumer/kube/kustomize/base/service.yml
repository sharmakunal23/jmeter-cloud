# Generated once by the Track 7 layout (2026-08-30); hand-maintained since.
apiVersion: v1
kind: Service
metadata:
  name: metrics-consumer
  labels:
    app: metrics-consumer
spec:
  ports:
    - name: http
      port: 80            # what the ingress controller talks to
      targetPort: http    # the container's named port
      protocol: TCP
    # Service-name parity: in-cluster callers keep using metrics-consumer:8083
    # (compose URL defaults) — the same Service also answers on the app port.
    - name: app
      port: 8083
      targetPort: http
      protocol: TCP
  selector:
    app: metrics-consumer
