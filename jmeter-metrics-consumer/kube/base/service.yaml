# KUBE-2 — `metrics-consumer` ClusterIP: named exactly like the compose
# service (parity, convention 2) so the workers' stamped
# METRICS_INGEST_URL (http://metrics-consumer:8083/api/v1/ingest) works
# unchanged.
apiVersion: v1
kind: Service
metadata:
  name: metrics-consumer
  labels:
    app: metrics-consumer
spec:
  selector:
    app: metrics-consumer
  ports:
    - name: http
      port: 8083
      targetPort: http
