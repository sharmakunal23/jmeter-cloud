# jmeter-metrics-consumer subsystem — Compose fragment.
services:

  metrics-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    image: jmeter-metrics-consumer:dev
    profiles: [default]
    # Reliability: self-heal. This is the
    # load-bearing fix for "metrics died after the test" — the consumer runs
    # `-XX:+ExitOnOutOfMemoryError` (Dockerfile), so any OOM deliberately
    # exits the JVM; without a restart policy the container then stayed dead
    # and no metrics reached Postgres/Grafana. `unless-stopped` brings it
    # straight back, and the workers' disk-backed buffer + retry plus the
    # idempotent ON CONFLICT DO NOTHING write make the replay loss-free.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Wait for Flyway to land the metrics schema before connecting —
      # otherwise the consumer's startup health probe finds an empty
      # database and the first INSERT 500s.
      flyway-migrate:
        condition: service_completed_successfully
    ports:
      - "${METRICS_CONSUMER_HTTP_PORT:-8083}:8083"
    environment:
      HTTP_PORT:           "8083"
      HTTP_BIND_ADDRESS:   0.0.0.0
      # See the application.yml comment for the
      # nuance (no-op on our hot path because we already use multi-row
      # VALUES, but free defense-in-depth + skips a version-detection
      # round-trip at connect time).
      POSTGRES_METRICS_URL: jdbc:postgresql://postgres:5432/jmetercloud_metrics?reWriteBatchedInserts=true&assumeMinServerVersion=16
      # Connect as the per-app metricsWriter — INSERT only on metrics.*.
      # Flyway's migration step (run by the cluster-owner) issued the
      # GRANTs.
      POSTGRES_USER:       ${POSTGRES_METRICS_WRITER_USER:-metricsWriter}
      POSTGRES_PASSWORD:   ${POSTGRES_METRICS_WRITER_PASSWORD:-localdev}
      # SLIMDOWN (2026-07-20): the MANAGEMENT_TRACING_* / MANAGEMENT_OTLP_*
      # env is gone — the service no longer carries Micrometer/OTel.
    # Heap-dump output volume — survives container restart so the operator
    # can analyze the .hprof from a -XX:+HeapDumpOnOutOfMemoryError event
    # offline. Bind-mounted to ./heapdumps so it shows up in the repo
    # checkout (gitignore the directory).
    volumes:
      # Fragment-relative (include: resolves against this file's directory).
      # Was ./jmeter-metrics-consumer/heapdumps — a doubled path that sent
      # dumps to jmeter-metrics-consumer/jmeter-metrics-consumer/heapdumps.
      - ./heapdumps:/app/heapdumps
    # Phase G follow-up (G-fix-2): pin per-container memory so an ingest-side
    # OOM can't take the host down. JVM heap is 1 GB (see Dockerfile);
    # 1.2 GiB caps the container so JVM overhead + native buffers fit
    # without forcing the host OOM killer onto a noisy neighbour.
    mem_limit: 1200m
    mem_reservation: 768m
    healthcheck:
      # Reliability: probe the READINESS
      # group (DB reachable), NOT the aggregate health. The aggregate
      # flips DOWN after 5 min idle (ingestProgress) — e.g. the quiet
      # window after a 12 h test ends — which would otherwise mark the
      # container UNHEALTHY between runs even though it's perfectly fine.
      # Readiness stays UP when idle and only goes DOWN on a real DB loss.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
