openapi: 3.0.3

info:
  title: jmeter-metrics-consumer
  version: 1.0.0
  summary: HTTP ingest service that lands WorkerMetricBatch envelopes in the Oracle metrics schema.
  description: |
    Accepts JSON `WorkerMetricBatch` envelopes at `POST /api/v1/ingest` — the
    platform's only metrics path — and lands them in `metrics."workerMetric"`
    through a staged, idempotent ingest: rows already present are pruned
    before the insert, so duplicates from a worker's retry machinery collapse
    at the database and the rollups absorb only rows that actually landed.

    **This document is the canonical wire contract.** The producer
    (`jmeter-local-orchestrator`) keeps a structurally identical record, and a
    shared golden-payload test (`goldenWorkerMetricBatch.json`) in both trees
    pins the two together. The shape is fixed per deploy — there is no schema
    registry.

    Decoders ignore unknown fields, so **adding** a field is producer-first
    safe. Renaming or removing one rebuilds both sides together.

    No auth locally, matching the platform's local profile; the cloud profile
    gates this endpoint behind a bearer JWT.
  contact:
    name: Performance Engineering
  license:
    name: Apache-2.0

servers:
  - url: http://localhost:8083
    description: Local dev (binds to HTTP_PORT, default 8083).
  - url: http://{host}:{port}
    description: Pod / instance — host and port are deployment-specific.
    variables:
      host:
        default: jmeter-metrics-consumer
      port:
        default: "8083"

tags:
  - name: ingest
    description: THE metrics ingest path — JSON envelope POSTs from the workers.
  - name: actuator
    description: |
      Health and info only — `/actuator/prometheus` is 404 by design.

paths:

  /api/v1/ingest:
    post:
      tags: [ingest]
      summary: Ingest a single WorkerMetricBatch envelope.
      description: |
        Called by every worker's dispatcher, one envelope per (worker, second).
        The `WorkerMetricBatch` schema below is the canonical definition of the
        body, and the `(runId, workerId, label, windowSecond)` PK absorbs
        duplicates from the workers' buffer retries.

        **Body size cap** is `metricsConsumer.ingest.maxBodyBytes` (default
        2 MB). Checked before parse so an oversize garbage payload can't
        pin parser memory. **Semantic validation** after decode: missing
        or blank identity fields (`runId`, `workerId`, `region`,
        `windowTimestamp`, any `entries[].label`, or a null `entries`
        array) are terminal `400`s — never a retryable `503`.
      operationId: ingestEnvelope
      requestBody:
        description: JSON `WorkerMetricBatch` — the canonical wire schema.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerMetricBatch'
      responses:
        '202':
          description: Accepted. `rowsInserted` may be less than entry count if duplicates collapsed on the PK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
              examples:
                happyPath:
                  summary: 200-entry envelope, 200 fresh rows
                  value:
                    rowsInserted: 200
                    code: ACCEPTED
                    message: null
                idempotent:
                  summary: All entries collided with existing PKs
                  value:
                    rowsInserted: 0
                    code: ACCEPTED
                    message: null
        '400':
          description: |
            Body is not valid JSON, or a required field is missing/blank
            (semantic validation). The dispatcher should NOT retry —
            payload is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
              examples:
                malformed:
                  value: { rowsInserted: 0, code: INVALID_JSON, message: "Unexpected character..." }
                missingField:
                  value: { rowsInserted: 0, code: INVALID_JSON, message: "runId is required" }
        '413':
          description: |
            Body exceeded `metricsConsumer.ingest.maxBodyBytes`. Defense
            in depth — checked before parse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
              example:
                rowsInserted: 0
                code: PAYLOAD_TOO_LARGE
                message: "body 3500000 bytes exceeds maxBodyBytes 2097152"
        '415':
          description: |
            Non-JSON `Content-Type` (e.g. a pre-JSON-INGEST worker still
            POSTing `application/avro`). Spring's `consumes` guard —
            body is Spring's default error shape, not `IngestResponse`.
            The old worker treats 415 as retryable and keeps the envelope
            in its disk buffer until the worker image is rebuilt.
        '503':
          description: |
            The database is unreachable or rejected the chunk (a concurrent
            replica landed the same key first). The dispatcher SHOULD retry via
            its disk-buffer retry sweeper — ingest is idempotent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
              example:
                rowsInserted: 0
                code: DATABASE_UNAVAILABLE
                message: "IO Error: The Network Adapter could not establish the connection"

  /actuator/health:
    get:
      tags: [actuator]
      summary: Aggregate health — DB connectivity + ingest-progress staleness.
      description: |
        DOWN if the database is unreachable or no envelope has been ingested for
        `metricsConsumer.heartbeat.staleAfterSeconds` (the `ingestProgress`
        indicator). Probe paths: `/actuator/health/liveness` (process up),
        `/actuator/health/readiness` (DB reachable).
      responses:
        '200':
          description: UP — service can reach the database and is ingesting.
        '503':
          description: DOWN — database unreachable or ingest is stale.

  /actuator/info:
    get:
      tags: [actuator]
      summary: Build info exposed by Spring Boot Actuator.
      responses:
        '200':
          description: Build / version metadata.

components:
  schemas:
    WorkerMetricBatch:
      type: object
      description: |
        The metrics-ingest wire envelope — one per (workerId, windowSecond),
        POSTed by each worker every second. **This schema is the canonical wire
        contract.** Decoders ignore unknown fields.
      required: [windowSecond, windowTimestamp, region, workerId, runId, entries]
      properties:
        windowSecond:
          type: integer
          format: int64
          minimum: 1
          maximum: 9999999999
          description: Epoch second of the 1-s tumbling window (idempotency-key component). A millisecond value is rejected 400.
          example: 1784600000
        windowTimestamp:
          type: string
          description: Human-readable timestamp of the window (stored verbatim).
          example: "2026-07-20T21:33:20Z"
        region:
          type: string
          maxLength: 64
          description: Worker's region tag.
          example: us-east-1
        workerId:
          type: string
          maxLength: 64
          description: Pod/worker identity (idempotency-key component).
          example: acaps-us-east-1-worker-1
        runId:
          type: string
          maxLength: 64
          description: Run this window belongs to (idempotency-key component).
          example: 01KY1535CHHF9WG5HHZETVEQBZ
        joinedAtSecond:
          type: integer
          format: int64
          default: 0
          description: |
            MID-TEST-SCALING — seconds after run start at which this worker
            joined the fleet. 0 (or absent) = original-fleet worker.
        entries:
          type: array
          description: One per-label aggregate per entry. May be empty (202 with rowsInserted 0), never absent.
          items:
            $ref: '#/components/schemas/WorkerMetricEntry'

    WorkerMetricEntry:
      type: object
      description: |
        One per-label aggregate inside an envelope. Envelope-level identity
        (runId, workerId, region, windowSecond, …) is projected onto each
        stored row at insert time — this object carries only the per-label
        numbers. All response-time fields are milliseconds. Counts must be
        non-negative with `errorCount <= throughput` (400 otherwise).
      required: [label]
      properties:
        label:
          type: string
          description: JMeter sampler label (idempotency-key component). Stored truncated to 255 characters.
          example: "GET /api/v1/checkout/items"
        throughput:
          type: integer
          format: int64
          minimum: 0
          description: Samples completed in this window.
        errorCount:
          type: integer
          format: int64
          minimum: 0
          description: Failed samples in this window; never more than `throughput`.
        errorRate:
          type: number
          format: double
          description: errorCount / throughput. Finite — JSON cannot carry NaN/Infinity; the producer guarantees finite values.
        avgRespTimeMs:
          type: number
          format: double
          description: |
            sumElapsedMs / throughput. **Derived and lossy** — kept on the wire
            for backward compatibility only. Since SCHEMA-OPT Phase 2 the
            consumer stores `sumElapsedMs` instead, and falls back to
            `round(avgRespTimeMs × throughput)` only when a producer predating
            that field omits it.
        sumElapsedMs:
          type: integer
          format: int64
          description: |
            Exact total elapsed milliseconds across every sample in this window
            — the response-time fact. Stored verbatim; readers divide by
            `throughput` at the end, which is why a sum can be folded across
            workers, labels and time without weighting drift and a mean cannot.
            Optional: absent from producers older than SCHEMA-OPT Phase 2
            (2026-07-30), in which case the consumer reconstructs it from
            `avgRespTimeMs`.
        p50Ms:
          type: number
          format: double
        p90Ms:
          type: number
          format: double
        p95Ms:
          type: number
          format: double
        p99Ms:
          type: number
          format: double
        minMs:
          type: number
          format: double
        maxMs:
          type: number
          format: double
        rawMaxMs:
          type: integer
          format: int64
          description: Un-histogrammed max (exact, not 2-significant-digit-quantized).
        bytesReceived:
          type: integer
          format: int64
        bytesSent:
          type: integer
          format: int64
        statusCodes:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: |
            JMeter `responseCode` → count for this window. Null/absent is treated
            as empty; a blank code is stored as `(none)`, a code longer than 128
            characters is stored truncated, and counts ≤ 0 are skipped.
          example: { "200": 240, "404": 3, "500": 1 }
        activeThreads:
          type: integer
          format: int64
          description: JMeter active thread count during this window.

    IngestResponse:
      type: object
      description: Response shape for `POST /api/v1/ingest`.
      required: [rowsInserted, code]
      properties:
        rowsInserted:
          type: integer
          description: |
            Rows actually written to `metrics."workerMetric"`. May be less
            than the envelope's entry count if duplicates were pruned as
            already present.
          example: 200
        code:
          type: string
          enum: [ACCEPTED, INVALID_JSON, PAYLOAD_TOO_LARGE, DATABASE_UNAVAILABLE]
          description: |
            Short status code.

            - `ACCEPTED` — happy path (HTTP 202)
            - `INVALID_JSON` — body malformed, a required field missing, an identity field over 64 chars, or a count invariant broken (HTTP 400; do not retry)
            - `PAYLOAD_TOO_LARGE` — body exceeded `maxBodyBytes` (HTTP 413; do not retry)
            - `DATABASE_UNAVAILABLE` — database unreachable or the chunk was rolled back (HTTP 503; retry)
          example: ACCEPTED
        message:
          type: string
          nullable: true
          description: Human-readable detail; null on success.
          example: null
