# JMeter JTL output configuration
#
# Configures JMeter's CSV result format so every column the
# jmeter-local-orchestrator parses is present and in the expected order.
# Java properties files do NOT honor inline `#` comments — `key=true # foo`
# parses the value as the string "true # foo" which JMeter then treats
# as boolean false. Comments must live on their own lines.
#
# Deploy path: ${JMETER_HOME}/bin/user.properties (baked into the
# orchestrator's image at build time).

# ── Output format ──────────────────────────────────────────────────────
jmeter.save.saveservice.output_format=csv
jmeter.save.saveservice.print_field_names=true

# Timestamp — MUST stay as yyyy/MM/dd HH:mm:ss. JtlRowParser uses this
# exact format for epoch-second conversion; the JMeter default (epoch
# millis as integers) will break parsing.
jmeter.save.saveservice.timestamp_format=yyyy/MM/dd HH:mm:ss

# ── Required columns (orchestrator parses all of these) ────────────────
# elapsed
jmeter.save.saveservice.time=true
# label
jmeter.save.saveservice.label=true
# responseCode
jmeter.save.saveservice.code=true
# responseMessage
jmeter.save.saveservice.message=true
# threadName
jmeter.save.saveservice.thread_name=true
# dataType
jmeter.save.saveservice.data_type=true
# success
jmeter.save.saveservice.successful=true
# failureMessage
jmeter.save.saveservice.assertion_results_failure_message=true
# bytes
jmeter.save.saveservice.bytes=true
# sentBytes
jmeter.save.saveservice.sent_bytes=true
# grpThreads + allThreads
jmeter.save.saveservice.thread_counts=true
# URL
jmeter.save.saveservice.url=true
# Latency
jmeter.save.saveservice.latency=true
# IdleTime
jmeter.save.saveservice.idle_time=true
# Connect
jmeter.save.saveservice.connect_time=true

# ── Write behaviour ────────────────────────────────────────────────────
# Flush after each row so the orchestrator's JtlRowParser sees data in
# near-real-time. At 300 req/s the overhead is negligible; the
# orchestrator's TailerStateMachine polls every 100 ms.
jmeter.save.saveservice.autoflush=true

# ── Suppress GUI-only features that bloat headless JTL files ──────────
jmeter.save.saveservice.samplerData=false
jmeter.save.saveservice.requestHeaders=false
jmeter.save.saveservice.responseData=false
jmeter.save.saveservice.responseHeaders=false
jmeter.save.saveservice.encoding=false
jmeter.save.saveservice.subresults=false
jmeter.save.saveservice.assertions=false

# ── Non-interactive (headless) defaults ────────────────────────────────
jmeter.save.saveservice.default_delimiter=,
jmeterengine.force.system.exit=true
summariser.name=summary
summariser.interval=30
summariser.log=true
