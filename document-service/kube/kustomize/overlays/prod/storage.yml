# Generated once by the Track 7 layout (2026-08-30); hand-maintained since.
# RWX NFS volume for the blob store on `prod` — shared by every replica.
# Invariants (check on every change): PV capacity == PVC request; PV labels
# UID/GID == the Deployment's runAsUser/fsGroup; claimRef pre-binds the PV;
# Retain keeps the data if the PVC is deleted; mountPath == the app's root path.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: <sealId>d<appId>-naspv-prod
  labels:
    UID: "214818"
    GID: "99"
    filepermission: "775"
spec:
  capacity:
    storage: 5Ti
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: REPLACE_ME_NAS_FQDN
    path: /REPLACE_ME/document-service-prod
  claimRef:
    namespace: ${namespace}
    name: <sealId>d<appId>-naspvc-prod
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: <sealId>d<appId>-naspvc-prod
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 5Ti
