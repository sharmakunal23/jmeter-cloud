# KUBE-3 — document-service: blob-storage gateway (LocalFsBlobStore on a
# PVC). K8s equivalent of the compose `document-service` service — same
# env, same JVM (image ENTRYPOINT: -Xmx256m, ExitOnOutOfMemoryError).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-service
  labels:
    app: document-service
spec:
  # LocalFsBlobStore is single-writer on an RWO volume → exactly one
  # replica, and Recreate (RollingUpdate would deadlock: the new pod
  # can't attach the PVC while the old one holds it). The S3BlobStore
  # (`-Pcloud`) lifts both constraints — recorded as the privateCloud
  # option in that overlay, not built here.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: document-service
  template:
    metadata:
      labels:
        app: document-service
    spec:
      # Convention 5 (infra/deploy/k8s/README.md).
      enableServiceLinks: false
      securityContext:
        # The image runs as uid/gid 999 (`app`); a freshly provisioned
        # PVC is root-owned. fsGroup makes the mount group-writable;
        # OnRootMismatch skips the recursive chown on every restart once
        # ownership is right (a blob store can hold thousands of files).
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: document-service
          image: document-service:dev
          ports:
            - name: http
              containerPort: 8084
          env:
            - name: HTTP_PORT
              value: "8084"
            - name: HTTP_BIND_ADDRESS
              value: 0.0.0.0
            - name: DOCUMENT_SERVICE_BACKEND
              value: local
            - name: DOCUMENT_SERVICE_LOCAL_FS_ROOT
              value: /var/lib/document-service/blobs
          volumeMounts:
            - name: data
              mountPath: /var/lib/document-service/blobs
          # No probe-group split here (unlike metrics-consumer): the
          # aggregate health has no idle-staleness contributor, so it is
          # safe for both probes — and it's what the compose healthcheck
          # and UI Home checklist already use.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 24   # up to 120 s for a cold JVM start
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            # -Xmx256m heap + metaspace + native ≈ 640 MiB ceiling.
            # Memory request = limit (convention 7, Guaranteed QoS);
            # CPU request only — no throttling limit on the JVM.
            requests:
              memory: 640Mi
              cpu: 250m
            limits:
              memory: 640Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: document-service-data
