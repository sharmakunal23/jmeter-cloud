# KUBE-3 — `document-service` ClusterIP: named exactly like the compose
# service (parity, convention 2) so DOCUMENT_SERVICE_URL defaults and the
# UI's nginx proxy target (document-service:8084) work unchanged.
apiVersion: v1
kind: Service
metadata:
  name: document-service
  labels:
    app: document-service
spec:
  selector:
    app: document-service
  ports:
    - name: http
      port: 8084
      targetPort: http
