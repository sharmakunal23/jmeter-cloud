openapi: 3.0.3

info:
  title: document-service
  version: 0.1.0
  summary: HTTP gateway abstracting blob storage (test plans, data files, JTL results).
  description: |
    Persists every artifact the orchestrator fleet exchanges: test plans
    (`.jmx`), data-files zips (`.zip`) and post-run JTL uploads.

    `DOCUMENT_SERVICE_BACKEND=local|s3` selects the backend at deploy time.
    `LocalFsBlobStore` (default) bind-mounts a host directory; `S3BlobStore`
    (`-Pcloud` build) targets any S3-compatible service. Both expose this
    identical surface, and tags and listings round-trip the same on each.
  contact:
    name: Performance Engineering
  license:
    name: Apache-2.0

servers:
  - url: http://localhost:8084
    description: Local dev (default HTTP_PORT=8084)
  - url: http://{host}:{port}
    description: Cloud — host and port are deployment-specific
    variables:
      host: { default: document-service.jmetercloud.local }
      port: { default: "8084" }

tags:
  - name: blob
    description: Blob upload / download / metadata / delete.
  - name: platform
    description: Spring Boot Actuator endpoints.

paths:

  # ────────────────────────────────────────────────────────────────────────
  # Blob CRUD
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/blob:
    post:
      tags: [blob]
      summary: Upload a blob
      description: |
        Streams the **raw request body** into the backend, computing sha256 and
        size in flight, and returns a server-issued ULID `blobId`. This is not a
        multipart endpoint — a `multipart/form-data` upload (curl `-F`) stores
        0 bytes.

        The four optional tag headers are stored beside the bytes (filesystem
        sidecar or S3 user-metadata) and round-trip on
        `GET /blob/{blobId}/metadata`. `X-Application` is trimmed and capped at
        64 chars; it gates the launcher's downstream pickers and feeds the
        `GET /api/v1/applications` rollup.

        A body tagged `X-Type: dataFiles` or `X-Type: plugin` (a jar is a zip
        container) must begin with the ZIP magic
        (`PK\x03\x04`) or it is rejected `400 INVALID_ARCHIVE` — otherwise a
        bad archive surfaces much later, as a run-launch failure.
      parameters:
        - { name: X-Name,        in: header, required: false, schema: { type: string } }
        - { name: X-Description, in: header, required: false, schema: { type: string } }
        - { name: X-Type,        in: header, required: false, schema: { type: string, enum: [testPlan, dataFiles, result, template, plugin, other] } }
        - { name: X-Application, in: header, required: false, schema: { type: string, maxLength: 64 } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
          application/zip:
            schema: { type: string, format: binary }
          application/xml:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Blob stored — body is the metadata record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlobMetadata" }
        "500":
          description: Backend I/O failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    get:
      tags: [blob]
      summary: List stored blobs
      description: |
        Paginated blob metadata, newest first, matching every filter supplied
        (`type` and `application` AND together). Backs the launcher's test-plan
        and data-files dropdowns and the Documents library page.
      parameters:
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [testPlan, dataFiles, result, template, plugin, other] }
        - name: application
          in: query
          required: false
          description: |
            Filter to one application's blobs. An **empty string**
            (`?application=`) selects only blobs with no application tag.
          schema: { type: string, maxLength: 64 }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0,  minimum: 0 } }
        - { name: limit,  in: query, required: false, schema: { type: integer, default: 50, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: Page of blob metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlobListing" }

  /api/v1/applications:
    get:
      tags: [blob]
      summary: Distinct application tags + blob counts
      description: |
        One row per distinct `application` tag, ordered by `blobCount` then
        name, with untagged blobs under `application = null`. The launcher's
        Application picker polls this so newly tagged apps appear without a
        manual refresh.
      responses:
        "200":
          description: Application rollup.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApplicationSummary" }

  /api/v1/blob/{blobId}:
    parameters:
      - { name: blobId, in: path, required: true, schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" } }
    get:
      tags: [blob]
      summary: Stream a blob's bytes
      description: |
        Streams the raw bytes with the upload's `Content-Type` round-tripped,
        plus `X-blobId` and `X-sha256` for client-side integrity checks.

        `?download=true` adds `Content-Disposition: attachment`, naming the file
        from `X-Name` plus an extension implied by `X-Type` (`.jmx`, `.zip`,
        `.jtl.gz`, else `.bin`); a name that already has an extension is used
        as-is. The default stays inline, which curl scripts and the
        local-orchestrator's blob fetch depend on.
      parameters:
        - name: download
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: |
            Attach rather than inline, naming the file from `X-Name` + `X-Type`.
      responses:
        "200":
          description: Blob bytes.
          headers:
            X-blobId:
              schema: { type: string }
              description: Echoed blobId for client verification.
            X-sha256:
              schema: { type: string }
              description: Hex sha256 of the bytes.
            Content-Disposition:
              schema: { type: string }
              description: |
                Set to `attachment; filename="<name.ext>"` only when
                `?download=true` is supplied; absent on the default
                inline response.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          description: blobId is unknown or malformed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [blob]
      summary: Delete a blob (idempotent)
      description: |
        Removes the bytes and metadata, returning 204 whether or not the blob
        existed. On the local backend this is unrecoverable; on S3 it is
        recoverable only if the bucket has versioning enabled, which this
        service does not configure.
      responses:
        "204":
          description: Deleted (or already gone).
        "500":
          description: Backend I/O failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/blob/run/{runId}/archive:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" } }
    get:
      tags: [blob]
      summary: Download a run's saved results as one zip
      description: |
        Streams one `application/zip` holding every worker's result for the run,
        one entry per worker, built on the fly with no temp file or full-archive
        buffering.

        Matching is by the `results-{runId}-` name prefix over blobs uploaded
        with `X-Type=result`, which is unambiguous only because a runId is a
        hyphen-free ULID. The route sits under `/api/v1/blob/` so the UI's nginx
        proxy sends it here rather than to the global-orchestrator.
      responses:
        "200":
          description: Zip of the run's per-worker results (one `.jtl.gz` entry per worker).
          headers:
            Content-Disposition:
              schema: { type: string }
              description: '`attachment; filename="results-{runId}.zip"`.'
          content:
            application/zip:
              schema: { type: string, format: binary }
        "404":
          description: |
            No saved results for this runId — the run wasn't launched with
            `saveResults=true`, or no worker has uploaded yet. Empty body.

  /api/v1/blob/{blobId}/metadata:
    parameters:
      - { name: blobId, in: path, required: true, schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" } }
    get:
      tags: [blob]
      summary: Blob metadata only
      description: |
        Returns the recorded metadata without opening the bytes. Useful
        for clients that want to validate a sha256 before fetching.
      responses:
        "200":
          description: Metadata record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlobMetadata" }
        "404":
          description: blobId is unknown or malformed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ────────────────────────────────────────────────────────────────────────
  # Spring Boot Actuator
  # ────────────────────────────────────────────────────────────────────────
  /actuator/health:
    get:
      tags: [platform]
      summary: Aggregate health (Spring Boot Actuator)
      responses:
        "200":
          description: UP
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /actuator/info:
    get:
      tags: [platform]
      summary: Build / version info
      responses:
        "200":
          description: Build info.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

components:

  schemas:

    BlobMetadata:
      type: object
      description: Returned from POST /api/v1/blob and GET /api/v1/blob/{id}/metadata.
      required: [blobId, sizeBytes, sha256, uploadedAt]
      properties:
        blobId:
          type: string
          description: ULID — server-issued, URL-safe (Crockford base32, 26 chars).
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
          example: "01HXC2VQK4M9N6P5T0YBX2WZ4Q"
        sizeBytes:
          type: integer
          format: int64
          example: 12345678
        sha256:
          type: string
          description: Hex-encoded SHA-256 of the bytes.
          example: "f3a2b1c4..."
        contentType:
          type: string
          nullable: true
          example: "application/zip"
        uploadedAt:
          type: string
          format: date-time
        owner:
          type: string
          nullable: true
          description: Initiator identity for multi-tenancy use cases. Empty until auth lands.
        name:
          type: string
          nullable: true
          description: Human-readable label supplied via X-Name on upload.
          example: "checkout-load-plan"
        description:
          type: string
          nullable: true
          description: Free-form description supplied via X-Description on upload.
        type:
          type: string
          nullable: true
          enum: [testPlan, dataFiles, result, template, plugin, other]
          description: Purpose tag supplied via X-Type on upload.
        application:
          type: string
          nullable: true
          maxLength: 64
          description: |
            Application tag supplied via X-Application on upload; gates the
            launcher's test-plan / data-files pickers. `null` when uploaded
            without one.
          example: "checkout-svc"

    ApplicationSummary:
      type: object
      description: One row in `GET /api/v1/applications`.
      required: [application, blobCount]
      properties:
        application:
          type: string
          nullable: true
          description: Application tag, or `null` for the untagged group.
          example: "checkout-svc"
        blobCount:
          type: integer
          format: int64
          example: 12

    BlobListing:
      type: object
      description: Paginated response from GET /api/v1/blob.
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BlobMetadata" }
        total:
          type: integer
          description: Count of items matching the filter, before paging. -1 = unknown.
        offset:
          type: integer
        limit:
          type: integer

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [BLOB_NOT_FOUND, STORAGE_IO_ERROR]
        message:
          type: string
