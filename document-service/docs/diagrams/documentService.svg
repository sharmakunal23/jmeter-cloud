<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 444" width="960" height="444" role="img" aria-label="The document service: one REST surface over a pluggable BlobStore interface, backed by the local filesystem by default and by S3 under the cloud profile.">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
        </marker>
    </defs>
    <rect x="0" y="0" width="960" height="444" fill="#ffffff"/>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
        <text x="14" y="28" font-size="15" font-weight="700" fill="#0f172a">document-service &#8212; blob storage gateway</text>
        <text x="14" y="48" font-size="11" fill="#64748b">One REST surface over a pluggable BlobStore. The backend is chosen at build time, never at runtime.</text>

        <g font-size="10" font-weight="600" fill="#64748b" letter-spacing="1">
            <text x="14" y="110">1 &#183; CALLERS</text>
            <text x="14" y="204">2 &#183; REST</text>
            <text x="14" y="298">3 &#183; PORT</text>
            <text x="14" y="402">4 &#183; BACKEND</text>
        </g>

        <g fill="none" stroke="#94a3b8" stroke-width="2">
            <line x1="520" y1="132" x2="520" y2="174" marker-end="url(#arrow)"/>
            <line x1="520" y1="226" x2="520" y2="268" marker-end="url(#arrow)"/>
            <line x1="520" y1="320" x2="520" y2="346"/>
            <line x1="230" y1="346" x2="810" y2="346"/>
            <line x1="230" y1="346" x2="230" y2="372" marker-end="url(#arrow)"/>
            <line x1="810" y1="346" x2="810" y2="372" marker-end="url(#arrow)"/>
        </g>

        <g font-size="11" fill="#64748b">
            <text x="530" y="157">HTTP</text>
            <text x="530" y="251">put &#183; get &#183; sha256</text>
            <text x="240" y="364">default</text>
            <text x="820" y="364">-Pcloud only</text>
        </g>

        <rect x="420" y="80" width="200" height="52" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="520" y="102" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">UI &#183; orchestrator</text>
        <text x="520" y="119" text-anchor="middle" font-size="11" fill="#475569">upload / fetch blobs</text>

        <rect x="420" y="174" width="200" height="52" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
        <text x="520" y="196" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">BlobController</text>
        <text x="520" y="213" text-anchor="middle" font-size="11" fill="#475569">/api/v1/blob &#183; 8084</text>

        <rect x="420" y="268" width="200" height="52" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,4"/>
        <text x="520" y="290" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">BlobStore</text>
        <text x="520" y="307" text-anchor="middle" font-size="11" fill="#475569">interface</text>

        <rect x="130" y="372" width="200" height="52" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
        <text x="230" y="394" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">LocalFsBlobStore</text>
        <text x="230" y="411" text-anchor="middle" font-size="11" fill="#475569">sharded dir tree</text>

        <rect x="710" y="372" width="200" height="52" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5" stroke-dasharray="5,4"/>
        <text x="810" y="394" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">S3BlobStore</text>
        <text x="810" y="411" text-anchor="middle" font-size="11" fill="#475569">src/main/javaCloud</text>
    </g>
</svg>
