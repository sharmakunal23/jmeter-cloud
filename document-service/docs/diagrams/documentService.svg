<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 280" width="980" height="280" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#475569"/></marker>
  </defs>
  <rect width="980" height="280" fill="#fafaf9"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#0f172a">document-service — blob storage gateway</text>
  <text x="30" y="56" font-size="12.5" fill="#64748b">One REST surface over a pluggable BlobStore, backed by the local filesystem.</text>

  <g font-size="12.5">
    <rect x="30" y="150" width="160" height="76" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="110" y="180" text-anchor="middle" font-weight="600" fill="#1e293b">UI · orchestrator</text>
    <text x="110" y="199" text-anchor="middle" font-size="10.5" fill="#64748b">upload / fetch blobs</text>

    <rect x="250" y="142" width="200" height="92" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <text x="350" y="170" text-anchor="middle" font-weight="600" fill="#1e3a8a">REST API</text>
    <text x="350" y="189" text-anchor="middle" font-size="10.5" fill="#2563eb" font-family="monospace">/api/v1/blob · :8084</text>
    <text x="350" y="206" text-anchor="middle" font-size="10" fill="#2563eb">put · get · sha256</text>
    <text x="350" y="222" text-anchor="middle" font-size="10" fill="#2563eb">testPlan · dataFiles · result</text>

    <rect x="510" y="150" width="150" height="76" rx="8" fill="#eff6ff" stroke="#1e40af" stroke-width="1.3" stroke-dasharray="4 2"/>
    <text x="585" y="180" text-anchor="middle" font-weight="600" fill="#1e3a8a">BlobStore</text>
    <text x="585" y="199" text-anchor="middle" font-size="10.5" fill="#2563eb">interface</text>

    <rect x="720" y="150" width="230" height="76" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="835" y="178" text-anchor="middle" font-weight="600" fill="#065f46">LocalFsBlobStore</text>
    <text x="835" y="197" text-anchor="middle" font-size="10.5" fill="#047857">default · sharded dir tree</text>
    <text x="835" y="214" text-anchor="middle" font-size="10" fill="#047857" font-family="monospace">./.runtime/document-service</text>
  </g>

  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="190" y1="188" x2="248" y2="188"/>
    <line x1="450" y1="188" x2="508" y2="188"/>
    <line x1="660" y1="188" x2="718" y2="188"/>
  </g>

  <g font-size="10.5" fill="#64748b">
    <text x="219" y="180" text-anchor="middle">HTTP</text>
    <text x="479" y="180" text-anchor="middle">delegate</text>
    <text x="689" y="180" text-anchor="middle">local fs</text>
  </g>
</svg>
