spring:
  application:
    name: document-service
  profiles:
    default: local

server:
  port: ${HTTP_PORT:8084}
  address: ${HTTP_BIND_ADDRESS:0.0.0.0}

management:
  endpoints:
    web:
      exposure:
        # SLIMDOWN (2026-07-21) — health,info ONLY. Never drop health:
        # the compose healthcheck and the UI Home checklist depend on it.
        include: keepalive,health,info
  endpoint:
    health:
      show-details: always
      # Three-probe pattern (PRIVATE-CLOUD-ALIGNMENT Track 7): startup +
      # liveness → /actuator/keepalive; readiness → readinessState + the
      # blob-mount check (StorageHealthIndicator), so a broken or full mount
      # takes the pod out of rotation WITHOUT restarting it.
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,storage
  health:
    # Replaced by StorageHealthIndicator: Spring's diskspace check inspects
    # the container root, not the mounted blob volume.
    diskspace:
      enabled: false
  # SLIMDOWN (2026-07-21) — the tracing/otlp blocks are gone with the
  # Micrometer/OTel stack; belt-and-braces so the default in-memory
  # registry doesn't pretend to export anything.
  defaults:
    metrics:
      export:
        enabled: false

# Swagger UI — points at the hand-curated /openapi.yaml served from the
# JAR's static/ root (api/openapi.yaml is mapped there by the pom's
# <resources> block). Visitors land on /swagger-ui.html and Swagger UI
# fetches the spec from /openapi.yaml.
springdoc:
  swagger-ui:
    url: /openapi.yaml
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

documentService:
  # local: LocalFsBlobStore (default, always built).
  # s3:    S3BlobStore (compiled only under -Pcloud profile — see pom.xml).
  backend: ${DOCUMENT_SERVICE_BACKEND:local}
  localFs:
    # The hosted env name DOCUMENTSERVICE_LOCALFS_ROOTPATH binds to this key
    # directly (Spring relaxed binding) and wins over the placeholder; the
    # compose stack keeps DOCUMENT_SERVICE_LOCAL_FS_ROOT. Must equal the
    # volume mountPath in the manifests.
    rootPath: ${DOCUMENT_SERVICE_LOCAL_FS_ROOT:/var/lib/document-service/blobs}
    # Readiness flips DOWN once the blob volume's usable space drops below
    # this floor (1 GiB) — the pod leaves rotation before writes fail.
    minFreeBytes: ${DOCUMENT_SERVICE_MIN_FREE_BYTES:1073741824}
  s3:
    bucket:    ${DOCUMENT_SERVICE_S3_BUCKET:}
    region:    ${DOCUMENT_SERVICE_S3_REGION:}
    # endpoint / pathStyle accommodate non-AWS S3 implementations
    # (LocalStack, MinIO, Cloudflare R2). Leave both unset for real AWS S3.
    endpoint:  ${DOCUMENT_SERVICE_S3_ENDPOINT:}
    pathStyle: ${DOCUMENT_SERVICE_S3_PATH_STYLE:false}
