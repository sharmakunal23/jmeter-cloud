spring:
  application:
    name: jmeter-global-orchestrator
  profiles:
    default: local
  # Three pools are wired manually in DataSourceConfig against the one
  # Oracle PDB — the run-state writer ("globalOrchestrator" schema), the
  # metrics reader and the metrics purger (the CARDZATE_DB_GRAF metrics
  # schema — both pools set CURRENT_SCHEMA to it, ORACLE_METRICS_SCHEMA). Spring Boot's
  # auto-config bows out because the beans are explicit. The
  # spring.datasource.* keys below feed the metrics READER pool. Usernames
  # are bare camelCase here; DataSourceConfig adds the quotes Oracle needs.
  datasource:
    url: ${ORACLE_METRICS_URL:jdbc:oracle:thin:@//oracle:1521/FREEPDB1}
    username: ${ORACLE_METRICS_READER_USER:metricsReader}
    password: ${ORACLE_METRICS_READER_PASSWORD:localdev}
  # Surface ISO-8601 Instants on the wire (default Spring Boot config).
  # Nine @Scheduled beans share this scheduler (probes, sweepers, cron). One
  # thread would let a slow tick — a region probe waiting on connect
  # timeouts — delay every other sweep.
  task:
    scheduling:
      pool:
        size: 4
  jackson:
    serialization:
      write-dates-as-timestamps: false
  # AUTOMATION Phase E — SMTP for the daily report emails. Local/default points
  # at the MailHog container; JavaMailSender connects lazily, so a missing
  # MailHog never fails boot — only an actual send would error.
  mail:
    host: ${MAIL_HOST:mailhog}
    port: ${MAIL_PORT:1025}
  # CACHE C-0 (2026-05-26) — shared Redis cache so every orchestrator
  # instance reads the same data (the operator's "scalable at each layer"
  # requirement). Provider is pinned to redis at runtime; the test-only
  # application-local.yml flips this to `simple` so ITs need no Redis.
  # Per-cache TTLs + serializer live in config/CacheConfig.java.
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      # Lettuce connects lazily; a short command timeout keeps a cache
      # lookup from stalling an HTTP request if Redis is briefly slow.
      timeout: ${REDIS_TIMEOUT:2s}

server:
  port: ${HTTP_PORT:8082}
  address: ${HTTP_BIND_ADDRESS:0.0.0.0}

management:
  endpoints:
    web:
      exposure:
        # SLIMDOWN SL-E (2026-07-22): health,info ONLY — /actuator/prometheus
        # and the tracing stack are gone (hosting infra provides observability).
        # NEVER drop health: the compose healthcheck, the UI Home checklist and
        # operator probes all depend on it.
        include: keepalive,health,info
  endpoint:
    health:
      show-details: always
      # Three-probe pattern (PRIVATE-CLOUD-ALIGNMENT Track 7): startup +
      # liveness → /actuator/keepalive (process only), readiness →
      # /actuator/health/readiness (the Oracle pools). Aggregate health stays
      # for humans and the UI Home checklist.
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    db:
      # /actuator/health includes the database connection in its aggregate;
      # if Oracle goes DOWN, /actuator/health flips to DOWN.
      enabled: true
  # SLIMDOWN SL-E — belt-and-braces: no meter registry exists anymore, but
  # keep any future auto-configured export switched off.
  defaults:
    metrics:
      export:
        enabled: false

# Swagger UI — points at the hand-curated /openapi.yaml served from the
# JAR's static/ root (api/openapi.yaml is mapped there by the pom's
# <resources> block). Visitors land on /swagger-ui.html and Swagger UI
# fetches the spec from /openapi.yaml.
springdoc:
  swagger-ui:
    url: /openapi.yaml
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# AUTOMATION — base URL of document-service. The scheduler's
# DocumentServiceClient fetches a saved Template's JSON body here at fire time.
# DOCUMENT_SERVICE_URL already flows from the compose env (it also feeds the
# PodProvisioner's per-pod documentServiceUrl).
documentService:
  baseUrl: ${DOCUMENT_SERVICE_URL:http://document-service:8084}
# The metrics-consumer's base URL — only for the platform-health probe (the
# hub never sends metrics; workers do).
metricsConsumer:
  baseUrl: ${METRICS_CONSUMER_URL:http://metrics-consumer:8083}

# Per-run timeseries (GET /runs/{id}/timeseries) trailing-edge trim. On a LIVE
# run the newest `settleSeconds` of data are still in flight — each worker holds
# a per-second window open for its close-grace (~2 s, up to GRACE_PERIOD_SECONDS)
# and the metrics-consumer adds ingest + batch-INSERT lag before the
# rows land in the database. Until then those seconds are partially aggregated, so a
# run polled every 5 s shows a wobbling trailing edge that the auto-scaled chart
# rescales around. CachingMetricsService drops them for live runs (stable
# poll-to-poll); terminal runs ignore this — their rows are immutable + fully
# ingested. 5 s covers the worst-case end-to-end lag with headroom for
# cross-worker clock skew. See MetricsTimeseriesRepository#timeseries(...,int).
metrics:
  # Trailing seconds dropped from a LIVE run's series: a 15 s window lands once
  # every worker has published it, so the newest one is still filling for ~20 s.
  timeseries:
    settleSeconds: ${METRICS_TIMESERIES_SETTLE_SECONDS:20}
  # How long a group's GROUP_REGISTRY row is cached per instance.
  groupCacheSeconds: ${METRICS_GROUP_CACHE_SECONDS:300}
  # Window width (s) sent to every worker at fan-out (the worker's
  # FLUSH_WINDOW_SECONDS). 15 is the readers' finest bucket; keep it there.
  windowSeconds: ${METRICS_WINDOW_SECONDS:15}

globalOrchestrator:
  # The metrics schema the reader/purge pools resolve unqualified names in.
  metricsSchema: ${ORACLE_METRICS_SCHEMA:CARDZATE_DB_GRAF}
  # Comma-separated list of local-orchestrator base URLs the fan-out layer
  # talks to. Local-mode default points at orchestrator-1 (multi-region
  # adds orchestrator-2). Step 15 introduces registry-driven pod claiming;
  # this static list is the v1 of pod selection.
  localOrchestratorUrls: ${LOCAL_ORCHESTRATOR_URLS:http://orchestrator-1:8080}
  # Region label written into globalOrchestrator.run.originRegion.
  region: ${GLOBAL_ORCHESTRATOR_REGION:us-east-1}
  # Bounded thread pool sized to the local-orchestrator's HTTP_MAX_THREADS;
  # production fleets > 100 pods should switch to a reactive WebClient.
  fanoutThreads: ${GLOBAL_ORCHESTRATOR_FANOUT_THREADS:32}
  # Run state lives in the "globalOrchestrator" schema — writes go through
  # the globalOrchestratorWriter least-privilege user. Same PDB as metrics.
  runStateUrl:      ${ORACLE_GLOBALRUN_URL:jdbc:oracle:thin:@//oracle:1521/FREEPDB1}
  runStateUser:     ${ORACLE_GLOBALRUN_WRITER_USER:globalOrchestratorWriter}
  runStatePassword: ${ORACLE_GLOBALRUN_WRITER_PASSWORD:localdev}
  runStateStatementTimeoutMs: ${RUN_STATE_STATEMENT_TIMEOUT_MS:30000}

  # HARD-DELETE / purge — a SEPARATE read-write pool used ONLY to DELETE a
  # purged run's metric rows, as the dedicated metricsPurger user (SELECT +
  # DELETE); the hot metrics read pool above stays read-only. The query
  # timeout is generous (120 s) because a run-scoped DELETE removes every
  # row a whole test produced.
  metricsPurgeUrl:               ${ORACLE_METRICS_URL:jdbc:oracle:thin:@//oracle:1521/FREEPDB1}
  metricsPurgeUser:              ${ORACLE_METRICS_PURGER_USER:metricsPurger}
  metricsPurgePassword:          ${ORACLE_METRICS_PURGER_PASSWORD:localdev}
  metricsPurgeStatementTimeoutMs: ${METRICS_PURGE_STATEMENT_TIMEOUT_MS:120000}

  # ── STATIC-FLEET: provisioning posture ─────────────────────────────
  # Whether this deployment may create worker pods at all.
  #   STATIC (DEFAULT since 2026-07-27) — workers are deployed and owned by
  #     the operator, which is this platform's normal deployment shape
  #     (private clouds where on-demand provisioning is unavailable, or a
  #     namespace quota caps what may be allocated). Spin / restart /
  #     container teardown answer 409 PROVISIONING_DISABLED; PodReconciler
  #     and PodRecycler are not wired AT ALL. That last part is
  #     load-bearing: the reconciler's row-first pass deletes any registry
  #     row whose Pod it cannot see, which with no cluster access
  #     would wipe the operator's whole declared fleet at boot.
  #   DYNAMIC — the control plane owns worker lifecycle: it spins,
  #     restarts, drains and recycles through a PodProvisioner. Set this
  #     explicitly when at least one region in REGIONS has a regional
  #     orchestrator URL — that regional holds the cluster credential; this
  #     service never does.
  provisioning:
    mode:    ${PROVISIONING_MODE:STATIC}
    # The region list lives in globalOrchestrator.regions (REGIONS) above.

  # ── STATIC-FLEET: declared-worker liveness probe (STATIC mode only) ─
  # Operator-deployed workers need not know this control plane exists, so
  # they may never POST /api/v1/heartbeat — which would let PodSweeper mark
  # the whole declared fleet LOST within pod.lostAfterMs and leave it
  # unclaimable. StaticPodProbe inverts the direction: it GETs each declared
  # worker's /actuator/health and refreshes lastHeartbeat on success, which
  # is the same evidence a heartbeat carries, so nothing downstream changes.
  #   probeIntervalMs     — matches the worker heartbeat cadence; 3x margin
  #                         inside the 90 s LOST window, so one missed probe
  #                         does not flap a healthy worker.
  #   probeInitialDelayMs — MUST be shorter than pod.sweepInitialDelayMs
  #                         (30 s), or a restart sweeps the fleet LOST for a
  #                         window before the first probe runs.
  #   probeConcurrency    — bounded fan-out; each probe costs up to the
  #                         client's 2 s timeout.
  #   probeTickBudgetMs   — hard ceiling on one tick; must stay well under
  #                         pod.lostAfterMs or a slow tick causes the very
  #                         sweep this exists to prevent.
  staticPod:
    probeIntervalMs:     ${STATICPOD_PROBE_INTERVAL_MS:30000}
    probeInitialDelayMs: ${STATICPOD_PROBE_INITIAL_DELAY_MS:5000}
    probeConcurrency:    ${STATICPOD_PROBE_CONCURRENCY:8}
    probeTickBudgetMs:   ${STATICPOD_PROBE_TICK_BUDGET_MS:20000}

  # ── Regions (REGIONAL-SPLIT) ─────────────────────────────────────
  # Comma-separated `id` or `id=url`. An entry WITH a url is routed: its
  # workers are created and reached through the jmeter-regional-orchestrator
  # at that url (one per data-center cluster; NodePort 30088 on kind). A
  # bare id is direct: operator-declared workers reached at their own
  # baseUrl — the compose-only STATIC loop. The ids are what the UI offers
  # as regions; empty keeps the UI on its own defaults.
  #   REGIONS=na-east=http://na-east-control-plane:30088,na-west=http://na-west-control-plane:30088
  regions: ${REGIONS:}
  # How often each routed region's /api/v1/capabilities is polled — the
  # only source of "reachable" and of the worker image the recycler diffs.
  # GET /api/v1/platform/health is served from a snapshot the hub refreshes
  # on this cadence — every minute, like the application health poll
  # (probes in parallel, each bounded by probeTimeoutMs; ?refresh=true probes now).
  platformHealth:
    intervalMs:               ${PLATFORM_HEALTH_INTERVAL_MS:60000}
  # Registered applications' health endpoints are polled on the same cadence.
  application:
    healthPoll:
      intervalMs:             ${APPLICATION_HEALTH_POLL_INTERVAL_MS:60000}
    initialDelayMs:           ${PLATFORM_HEALTH_INITIAL_DELAY_MS:1500}
    probeTimeoutMs:           ${PLATFORM_HEALTH_PROBE_TIMEOUT_MS:3000}
  regionProbe:
    intervalMs:               ${REGION_PROBE_INTERVAL_MS:15000}
    initialDelayMs:           ${REGION_PROBE_INITIAL_DELAY_MS:2000}
    # Consecutive misses before a region is UNREACHABLE (one is a WAN blip).
    missesBeforeUnreachable:  ${REGION_PROBE_MISSES_BEFORE_UNREACHABLE:3}
  # Dynamic workers in routed regions never heartbeat; the kubelet is the
  # liveness truth. One GET /api/v1/workers per region per tick: ready
  # refreshes the row, dead/absent marks it LOST with the kubelet's reason
  # and fails its run members. A region unreachable longer than
  # regionLostAfterMs has all its dynamic workers marked LOST — shorter
  # outages change nothing, the workers are still running JMeter.
  workerLiveness:
    intervalMs:        ${WORKER_LIVENESS_INTERVAL_MS:15000}
    initialDelayMs:    ${WORKER_LIVENESS_INITIAL_DELAY_MS:5000}
    regionLostAfterMs: ${WORKER_LIVENESS_REGION_LOST_AFTER_MS:300000}
    # A spun pod that never becomes ready (Unschedulable, ImagePullBackOff,
    # a boot that hangs) is torn down — Pod and registry row — after this
    # long, so it stops holding capacity. Pods that served a run are kept
    # LOST for forensics.
    startingTimeoutMs: ${WORKER_LIVENESS_STARTING_TIMEOUT_MS:600000}
  # A spun pod is LOST (unclaimable) until the kubelet reports it ready;
  # POST …/pods waits up to this long before answering with ready=false.
  podProvisioner:
    spinReadyTimeoutMs: ${PODPROVISIONER_SPIN_READY_TIMEOUT_MS:90000}
    # The Capacity tab's synchronous POST …/pods waits at most this long —
    # under nginx's 30 s — then answers ready=false; the snapshot shows
    # STARTING until the liveness probe flips the pod to READY.
    spinCapacityWaitMs: ${PODPROVISIONER_SPIN_CAPACITY_WAIT_MS:20000}
  # Timeouts for one call to a regional orchestrator. Delete and restart
  # wait up to 30 s for the old Pod to disappear before answering, so the
  # read timeout must exceed that or a completed delete reads as a 503.
  regionalClient:
    connectTimeoutMs: ${REGIONAL_CLIENT_CONNECT_TIMEOUT_MS:2000}
    readTimeoutMs:    ${REGIONAL_CLIENT_READ_TIMEOUT_MS:45000}

  # ── Save Results reconciliation (ResultsSavedSweeper) ──────────────
  # A worker's JTL upload finishes AFTER the run goes terminal, and the
  # run-detail UI stops polling /status at that point — so the per-worker
  # RESULTS_SAVED audit event (which the events timeline shows) would never
  # be recorded without a background sweep. This sweeper drives refreshAndGet
  # on COMPLETED + saveResults runs still missing an event, so the upload is
  # observed regardless of whether a UI is open. Idempotent + durably deduped.
  run:
    # An async launch (POST /runs with spinShortfall) is PREPARING while its
    # workers are provisioned in the background; one still PREPARING after
    # this long is failed by the sweeper (its task died with a restart).
    launchTimeoutMs:                 ${RUN_LAUNCH_TIMEOUT_MS:600000}
    # 15 s: the upload lands within seconds of completion; poll soon, before
    # the pod is reused for the next run (which resets its uploadState).
    resultsSavedSweepIntervalMs:     ${RESULTS_SAVED_SWEEP_INTERVAL_MS:15000}
    resultsSavedSweepInitialDelayMs: ${RESULTS_SAVED_SWEEP_INITIAL_DELAY_MS:20000}
    # 1 h look-back bounds the candidate set: a run whose upload never lands
    # (e.g. a worker died right after COMPLETED) stops being polled instead of
    # being chased forever.
    resultsSavedLookbackMs:          ${RESULTS_SAVED_LOOKBACK_MS:3600000}


  # ── AUTOMATION Phase A+B: DB-claim CRON scheduler ──────────────────
  # CronJobScheduler runs a single @Scheduled tick that claims due cronJob
  # rows via FOR UPDATE SKIP LOCKED and fires each. HA-safe by construction:
  # N replicas can run this — each due schedule fires exactly once. Tests
  # disable the sweep by setting a huge initialDelay (like the pod sweeper).
  automation:
    # How often to poll for due schedules. 30 s gives sub-minute fire
    # latency; a cron's finest grain here is one minute (unix cron).
    sweepIntervalMs:      ${AUTOMATION_SWEEP_INTERVAL_MS:30000}
    # Delay before the first sweep — lets the context + datasources settle.
    sweepInitialDelayMs:  ${AUTOMATION_SWEEP_INITIAL_DELAY_MS:15000}
    # Max schedules claimed (and fired) per tick. Bounds a thundering-herd if
    # many schedules come due at the same minute; the rest fire next tick.
    maxDueBatch:          ${AUTOMATION_MAX_DUE_BATCH:50}

    # ── Phase E: report emails (INFRA_READINESS now; DAILY_REPORT in Phase D) ──
    # SMTP is the ONLY backend (the SES + -Pcloud selector is gone).
    # Point spring.mail at the deploy environment's relay via env vars;
    # local dev uses the MailHog container.
    email:
      from:      ${AUTOMATION_EMAIL_FROM:jmeter-cloud@localhost}
    # Comma-separated fallback recipients when a report schedule carries none.
    reportRecipients: ${AUTOMATION_REPORT_RECIPIENTS:}

  # ── AI — Anthropic-backed run analysis ──────────
  # The API key lives ONLY here (server-side proxy); the browser never sees
  # it. With no key the AI endpoints return 503 AI_DISABLED and the UI hides
  # its buttons (GET /api/v1/ai/status), so local dev without a key still
  # boots green. Model is one constant — bump AI_MODEL to change it. The
  # daily cap is an in-memory, per-instance runaway-cost backstop.
  ai:
    apiKey:             ${ANTHROPIC_API_KEY:}
    model:              ${AI_MODEL:claude-sonnet-4-6}
    baseUrl:            ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    # 512 comfortably fits the terse summary + 2-4 findings and caps per-call
    # cost; bump AI_MAX_TOKENS if a future prompt needs more room.
    maxTokens:          ${AI_MAX_TOKENS:512}
    dailyInvocationCap: ${AI_DAILY_INVOCATION_CAP:200}
    # PII redaction is a Phase-1 backlog item — flag stubbed here, no-op in v1
    # (local data is synthetic). Cloud flips it true once the redaction pass lands.
    redactPii:          ${AI_REDACT_PII:false}

# SECURITY S-1 (2026-05-31) — per-(IP, endpoint-class) rate-limit filter
# (RateLimitFilter), the in-process backstop behind nginx's limit_req.
# DISABLED by default so the local IDE-on-loopback workflow is untouched;
# the `cloud` profile block below flips it on. A local dev can
# set SECURITY_RATE_LIMIT_ENABLED=true to exercise the 429 path.
security:
  rateLimit:
    enabled:           ${SECURITY_RATE_LIMIT_ENABLED:false}
    # Key on the leftmost X-Forwarded-For hop instead of the direct peer.
    # Enable ONLY behind a LB that overwrites the header — otherwise a client
    # can forge it and evade or poison another client's bucket.
    trustForwardedFor: ${SECURITY_RATE_LIMIT_TRUST_XFF:false}
    # Caffeine maximumSize for the per-key bucket map (bounds memory under IP churn).
    maxTrackedClients: ${SECURITY_RATE_LIMIT_MAX_CLIENTS:100000}

---
spring:
  config:
    activate:
      on-profile: cloud
# SECURITY S-1 — on by default in cloud. trustForwardedFor=true assumes the
# deployment sits behind an ALB/nginx that OVERWRITES X-Forwarded-For; if a
# future cloud topology exposes the service without such a proxy, set
# SECURITY_RATE_LIMIT_TRUST_XFF=false so the spoofable header is ignored.
security:
  rateLimit:
    enabled:           ${SECURITY_RATE_LIMIT_ENABLED:true}
    trustForwardedFor: ${SECURITY_RATE_LIMIT_TRUST_XFF:true}
# (The cloud email override is gone: SMTP is the one backend everywhere;
# configure the relay via spring.mail env vars.)
