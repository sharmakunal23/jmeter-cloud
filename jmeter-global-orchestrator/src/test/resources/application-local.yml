# Test-only profile overrides (the default profile is `local`, set in the
# main application.yml, so this file loads for every @SpringBootTest).
#
# CACHE-ORACLE (2026-08-31): the runtime provider is the ORCH_CACHE table, but
# tests must not need a database to exercise caching. `simple` swaps in a
# ConcurrentMapCacheManager — the terminal-vs-active gating is
# provider-agnostic, so behaviour tests verify the same contract in process.
# The store's own SQL is pinned by OracleCacheStoreTest and, against a real
# Oracle, CacheStoreDbTest (`mvn test -PdbTests`).
globalOrchestrator:
  cache:
    provider: simple
