<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 568" width="960" height="568" role="img" aria-label="The global orchestrator: the UI and the workflow scheduler both enter through RunService, which validates and claims an IDLE worker one row at a time, then reaches it through its cluster's regional orchestrator. The pod registry and the ORCH_* control plane live in the database.">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
        </marker>
    </defs>
    <rect x="0" y="0" width="960" height="568" fill="#ffffff"/>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
        <text x="14" y="28" font-size="15" font-weight="700" fill="#0f172a">jmeter-global-orchestrator &#8212; runs, workflows and every cluster's workers</text>
        <text x="14" y="48" font-size="11" fill="#64748b">Claims IDLE workers one row at a time, and holds no cluster credential &#8212; it reaches workers only through their region.</text>

        <g font-size="10" font-weight="600" fill="#64748b" letter-spacing="1">
            <text x="14" y="110">1 &#183; CALLERS</text>
            <text x="14" y="214">2 &#183; RUN</text>
            <text x="14" y="318">3 &#183; REGION</text>
            <text x="14" y="412">4 &#183; DATA CENTER</text>
            <text x="14" y="506">5 &#183; STORAGE</text>
        </g>

        <g fill="none" stroke="#94a3b8" stroke-width="2">
            <line x1="230" y1="132" x2="230" y2="158"/>
            <line x1="520" y1="132" x2="520" y2="158"/>
            <line x1="230" y1="158" x2="520" y2="158"/>
            <line x1="520" y1="158" x2="520" y2="184" marker-end="url(#arrow)"/>
            <line x1="520" y1="236" x2="520" y2="262"/>
            <line x1="230" y1="262" x2="520" y2="262"/>
            <line x1="230" y1="262" x2="230" y2="288" marker-end="url(#arrow)"/>
            <line x1="520" y1="262" x2="520" y2="288" marker-end="url(#arrow)"/>
            <line x1="520" y1="340" x2="520" y2="382" marker-end="url(#arrow)"/>
            <line x1="230" y1="340" x2="230" y2="476" marker-end="url(#arrow)"/>
            <line x1="420" y1="222" x2="118" y2="222"/>
            <line x1="118" y1="222" x2="118" y2="512"/>
            <line x1="118" y1="512" x2="130" y2="512" marker-end="url(#arrow)"/>
        </g>

        <g font-size="11" fill="#64748b">
            <text x="240" y="176">launch</text>
            <text x="530" y="176">POST /api/v1/runs</text>
            <text x="128" y="246">run state &#183; workflows</text>
            <text x="530" y="280">claim &#183; fan-out</text>
            <text x="530" y="365">/api/v1/pods &#183; /workers</text>
            <text x="240" y="410">members &#183; liveness</text>
        </g>

        <rect x="130" y="80" width="200" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
        <text x="230" y="102" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">WorkflowScheduler</text>
        <text x="230" y="119" text-anchor="middle" font-size="11" fill="#475569">tick &#183; claims due work</text>

        <rect x="420" y="80" width="200" height="52" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="520" y="102" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">UI / client</text>
        <text x="520" y="119" text-anchor="middle" font-size="11" fill="#475569">the platform API</text>

        <rect x="420" y="184" width="200" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
        <text x="520" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">RunService</text>
        <text x="520" y="223" text-anchor="middle" font-size="11" fill="#475569">validate &#183; claim &#183; fan-out</text>

        <rect x="130" y="288" width="200" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
        <text x="230" y="310" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Pod registry</text>
        <text x="230" y="327" text-anchor="middle" font-size="11" fill="#475569">LOST-until-ready &#183; IDLE</text>

        <rect x="420" y="288" width="200" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
        <text x="520" y="310" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Region layer</text>
        <text x="520" y="327" text-anchor="middle" font-size="11" fill="#475569">RegionRouter &#183; liveness</text>

        <rect x="420" y="382" width="200" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
        <text x="520" y="404" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">regional-orchestrator</text>
        <text x="520" y="421" text-anchor="middle" font-size="11" fill="#475569">one per cluster &#183; 8088</text>

        <rect x="130" y="476" width="780" height="72" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
        <text x="520" y="506" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Database</text>
        <text x="520" y="526" text-anchor="middle" font-size="11" fill="#475569">ORCH_* control plane &#183; claims through ORCH_CLAIMS &#183; reads the group fact tables</text>
    </g>
</svg>
