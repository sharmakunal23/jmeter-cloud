<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#64748b"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#fafaf9"/>
  <text x="30" y="30" font-size="15" font-weight="700" fill="#0f172a">jmeter-global-orchestrator — runs, capacity, and every region's workers</text>
  <text x="30" y="48" font-size="10" fill="#64748b">Claims IDLE workers one row at a time (ORCH_CLAIMS, SKIP LOCKED), launches asynchronously when it must provision, and reaches workers only through their region.</text>

  <!-- CONTROL PLANE band -->
  <rect x="30" y="66" width="840" height="150" rx="8" fill="none" stroke="#bfdbfe"/>
  <text x="42" y="82" font-size="10" font-weight="600" letter-spacing="1" fill="#1e3a8a">CONTROL PLANE · THE HUB</text>

  <rect x="42" y="96" width="120" height="50" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="102" y="116" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">UI / client</text>
  <text x="102" y="132" text-anchor="middle" font-size="10" fill="#475569">POST /api/v1/runs</text>

  <rect x="210" y="90" width="220" height="62" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="320" y="110" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">RunService</text>
  <text x="320" y="126" text-anchor="middle" font-size="10" fill="#475569">validate · claim (SKIP LOCKED)</text>
  <text x="320" y="142" text-anchor="middle" font-size="10" fill="#475569">fan-out · async launch (PREPARING)</text>

  <rect x="462" y="90" width="238" height="62" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="581" y="110" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">Region layer</text>
  <text x="581" y="126" text-anchor="middle" font-size="10" fill="#475569">RegionalPodProvisioner · RegionRouter</text>
  <text x="581" y="142" text-anchor="middle" font-size="10" fill="#475569">WorkerLivenessProbe · StatusFetcher</text>

  <rect x="210" y="168" width="220" height="42" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="320" y="185" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">Pod registry</text>
  <text x="320" y="201" text-anchor="middle" font-size="10" fill="#475569">LOST-until-ready · IDLE · LOST+reason</text>

  <rect x="724" y="96" width="136" height="50" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="792" y="116" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">Cache</text>
  <text x="792" y="132" text-anchor="middle" font-size="10" fill="#475569">terminal-run results</text>

  <!-- DATA PLANE band: one regional per data center -->
  <rect x="30" y="234" width="840" height="76" rx="8" fill="none" stroke="#99f6e4"/>
  <text x="42" y="250" font-size="10" font-weight="600" letter-spacing="1" fill="#115e59">DATA PLANE</text>

  <rect x="462" y="258" width="238" height="42" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.3"/>
  <text x="581" y="275" text-anchor="middle" font-size="12" font-weight="600" fill="#115e59">regional-orchestrator · 8088</text>
  <text x="581" y="291" text-anchor="middle" font-size="10" fill="#475569">Pods · liveness · relays worker calls</text>
  <text x="712" y="280" font-size="9" fill="#64748b">one per data center</text>
  <text x="712" y="291" font-size="9" fill="#64748b">REGIONS=id=url,…</text>

  <!-- STORAGE band -->
  <rect x="30" y="328" width="840" height="76" rx="8" fill="none" stroke="#a7f3d0"/>
  <text x="42" y="344" font-size="10" font-weight="600" letter-spacing="1" fill="#065f46">DATA STORAGE</text>

  <rect x="210" y="356" width="220" height="40" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.3"/>
  <text x="320" y="373" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">ORCH_* control plane</text>
  <text x="320" y="388" text-anchor="middle" font-size="10" fill="#475569">ORCH_RUN · ORCH_POD · capacity</text>

  <rect x="42" y="356" width="150" height="40" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.3"/>
  <text x="117" y="373" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">group fact tables</text>
  <text x="117" y="388" text-anchor="middle" font-size="10" fill="#475569">&lt;P&gt;_METRICS · read-only</text>

  <!-- arrows -->
  <g stroke="#64748b" stroke-width="1.3" fill="none" marker-end="url(#a)">
    <line x1="162" y1="121" x2="206" y2="121"/>
    <line x1="430" y1="121" x2="458" y2="121"/>
    <path d="M320,152 V164"/>
    <path d="M581,152 V254"/>
  </g>
  <g stroke="#047857" stroke-width="1.3" fill="none" marker-end="url(#ag)">
    <path d="M320,210 V352"/>
    <path d="M214,152 C176,190 130,260 124,352"/>
    <path d="M700,121 H720"/>
  </g>

  <g font-size="9" fill="#64748b">
    <text x="589" y="205" text-anchor="start">/api/v1/pods · /api/v1/workers</text>
    <text x="589" y="217" text-anchor="start">/workers/status · /workers/{pod}/…</text>
    <text x="328" y="290" text-anchor="start" fill="#065f46">claims · members · liveness</text>
    <text x="146" y="300" text-anchor="start" fill="#065f46">read facts</text>
    <text x="710" y="112" text-anchor="middle" fill="#065f46">cache</text>
  </g>
</svg>
