# KUBE-5 — least-privilege identity for the global-orchestrator's
# K8sPodProvisioner (substrate=k8s). Namespace-scoped Role, pods only, no
# secrets/exec/portforward verbs — the pattern proven by
# jmeter-orchestrator-k8s/k8s/rbac.yaml; names are distinct so both
# orchestrators can coexist in one namespace. This replaces the compose
# stack's docker-socket mount + root user: no socket, no root, just an
# SA token scoped to worker-Pod CRUD.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: global-orchestrator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: global-orchestrator-pod-manager
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: global-orchestrator-pod-manager
subjects:
  - kind: ServiceAccount
    name: global-orchestrator
roleRef:
  kind: Role
  name: global-orchestrator-pod-manager
  apiGroup: rbac.authorization.k8s.io
