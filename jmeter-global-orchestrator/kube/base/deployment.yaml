# global-orchestrator: the control plane (run fan-out, pod registry,
# capacity, automation scheduler, AI proxy, UI backend). It holds no
# cluster credential — worker Pods are created by each region's
# jmeter-regional-orchestrator (REGIONS). One deliberate delta from compose:
#   * liveness probes the liveness GROUP, not the aggregate: the aggregate
#     includes mail/redis/db contributors, and a dependency outage must
#     mark this pod NotReady (readiness), never restart-loop it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: global-orchestrator
  labels:
    app: global-orchestrator
spec:
  # Single replica by default. Every background path is multi-instance safe
  # (MULTI-INSTANCE audit, 2026-07-24 — DB-claim schedulers, guarded terminal
  # transitions, deterministic audit ids); what stays per-instance is the
  # in-memory rate limiter (N replicas = N× the effective limit). See the
  # scaling-posture section in infra/deploy/k8s/README.md before scaling out.
  replicas: 1
  strategy:
    # MULTI-INSTANCE (2026-07-24): with the default RollingUpdate, a
    # single-replica deploy still briefly runs old + new pods at once — two
    # orchestrators on DIFFERENT images, each seeing the other's freshly-spun
    # workers as IMAGE_MISMATCH. maxSurge 0 makes the swap strictly
    # stop-then-start, so the mixed-image window doesn't exist at replicas: 1
    # (the RecycleEvaluator grace window covers it when replicas > 1).
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: global-orchestrator
  template:
    metadata:
      labels:
        app: global-orchestrator
    spec:
      serviceAccountName: global-orchestrator
      # Convention 5 (infra/deploy/k8s/README.md).
      enableServiceLinks: false
      containers:
        - name: global-orchestrator
          image: jmeter-global-orchestrator:dev
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: HTTP_PORT
              value: "8082"
            - name: HTTP_BIND_ADDRESS
              value: 0.0.0.0
            # Two datasources, two role identities (parity with compose;
            # `postgres` resolves by Service name).
            - name: POSTGRES_METRICS_URL
              value: jdbc:postgresql://postgres:5432/jmetercloud_metrics
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: global-orchestrator-credentials
                  key: metricsReaderUser
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: global-orchestrator-credentials
                  key: metricsReaderPassword
            - name: POSTGRES_GLOBALRUN_URL
              value: jdbc:postgresql://postgres:5432/jmetercloud_globalrun
            - name: POSTGRES_GLOBALRUN_WRITER_USER
              valueFrom:
                secretKeyRef:
                  name: global-orchestrator-credentials
                  key: globalrunWriterUser
            - name: POSTGRES_GLOBALRUN_WRITER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: global-orchestrator-credentials
                  key: globalrunWriterPassword
            - name: GLOBAL_ORCHESTRATOR_REGION
              value: us-east-1
            - name: GLOBAL_ORCHESTRATOR_FANOUT_THREADS
              value: "32"
            # STATIC-FLEET — whether this deployment may create workers at
            # all. STATIC is the platform default (2026-07-27) and the right
            # posture for a private cloud: spin / restart / container teardown
            # answer 409, PodReconciler and PodRecycler are not wired (the
            # reconciler would read the operator's declared fleet as orphaned
            # and delete it), and operators DECLARE their workers via
            #   PUT /api/v1/applications/{id}/capacity/{region}/pods/{name}
            # Set DYNAMIC where REGIONS names at least one routed region —
            # the kind overlay does exactly that, to validate provisioning.
            # See infra/deploy/k8s/staticFleet.md.
            - name: PROVISIONING_MODE
              value: STATIC
            # REGIONS — `id` (direct, declared workers) or `id=url` (routed
            # through that cluster's jmeter-regional-orchestrator). The
            # umbrella overlays set it; a hub with no regional gets none.
            - name: REGIONS
              value: ""
            # AI proxy — key from the Secret; empty ⇒ AI disabled (503
            # AI_DISABLED, UI hides its buttons), boot stays green.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: global-orchestrator-credentials
                  key: anthropicApiKey
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24   # up to 120 s for a cold JVM start
          livenessProbe:
            # Liveness GROUP only — process-up. The aggregate (db + redis
            # + mail) belongs to readiness: a MailHog/postgres outage must
            # never restart-loop the control plane.
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            # Aggregate — same gate as the compose healthcheck and the UI
            # Home checklist: NotReady until postgres, redis, and mail are
            # all reachable.
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            # Same sizing as the sibling k8s-orchestrator Deployment
            # (-Xmx1g-class JVM + native). Memory request = limit
            # (convention 7); CPU request only.
            requests:
              memory: 1536Mi
              cpu: 500m
            limits:
              memory: 1536Mi
