# global-orchestrator — ClusterIP, parity with the compose name so the
# GLOBAL_ORCHESTRATOR_URL workers carry and the UI nginx proxy target work
# unchanged. The `workers` headless Service lives with
# jmeter-regional-orchestrator, which creates the Pods it selects.
apiVersion: v1
kind: Service
metadata:
  name: global-orchestrator
  labels:
    app: global-orchestrator
spec:
  selector:
    app: global-orchestrator
  ports:
    - name: http
      port: 8082
      targetPort: http
