# global-orchestrator base: control-plane Deployment + parity Service +
# the Redis cache. No RBAC and no `workers` Service — both moved to
# jmeter-regional-orchestrator, which is what creates worker Pods.
#
# The `global-orchestrator-credentials` Secret (keys: metricsReaderUser,
# metricsReaderPassword, globalrunWriterUser, globalrunWriterPassword,
# anthropicApiKey) is NOT defined here: kind generates it with dev values
# (empty AI key ⇒ AI disabled); privateCloud creates it out-of-band.
#
# Mail: nothing here — the kind overlay adds MailHog; privateCloud points
# MAIL_HOST/MAIL_PORT at the corporate SMTP relay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - redis.yaml
