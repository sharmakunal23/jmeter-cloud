# KUBE-5 — privateCloud overlay.
#
# CREDENTIALS (required before first apply — never committed):
#   kubectl -n jmeter-cloud create secret generic global-orchestrator-credentials \
#     --from-literal=metricsReaderUser=metricsReader \
#     --from-literal=metricsReaderPassword=<rotated> \
#     --from-literal=globalrunWriterUser=globalOrchestratorWriter \
#     --from-literal=globalrunWriterPassword=<rotated> \
#     --from-literal=anthropicApiKey=<key-or-empty>
# (initdb creates the roles with 'localdev' — rotate with ALTER USER;
# tracked under KUBE-11. Empty anthropicApiKey ⇒ AI disabled.)
#
# MAIL: no MailHog here — uncomment the patch below with the corporate
# SMTP relay (SES also speaks SMTP, if that is the corporate path).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

