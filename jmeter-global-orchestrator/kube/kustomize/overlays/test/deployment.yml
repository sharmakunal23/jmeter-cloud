# Generated once by the Track 7 layout (2026-08-30); hand-maintained since.
# Strategic-merge patch over the base Deployment for the `test` tier.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: global-orchestrator
spec:
  replicas: 1
  template:
    spec:
      securityContext:
        runAsUser: 214818            # MUST equal the PV label UID (test/prod storage) and the image's least-privilege user
        fsGroup: 99                 # MUST equal the PV label GID
      containers:
        - name: global-orchestrator
          image: ${containerImageUri}
          env:
            - name: ORACLE_METRICS_URL
              value: "jdbc:oracle:thin:@//REPLACE_ME_ORACLE_HOST:1521/REPLACE_ME_SERVICE"
            - name: ORACLE_GLOBALRUN_URL
              value: "jdbc:oracle:thin:@//REPLACE_ME_ORACLE_HOST:1521/REPLACE_ME_SERVICE"
            - name: METRICS_CONSUMER_URL          # the platform-health probe only
              value: "https://metrics-consumer.REPLACE_ME_PLATFORM_DOMAIN"
            - name: PROVISIONING_MODE
              value: DYNAMIC
            - name: REGIONS
              value: "REPLACE_ME_REGION_ID=https://jmeter-regional-orchestrator.REPLACE_ME_PLATFORM_DOMAIN"
          resources:
            requests:
              memory: 1536Mi
              ephemeral-storage: 10Gi
            limits:
              memory: 1536Mi
              ephemeral-storage: 10Gi
