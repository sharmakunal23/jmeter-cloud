# Generated once by the Track 7 layout (2026-08-30); hand-maintained since.
# Strategic-merge patch over the base Deployment for the `local` tier.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: global-orchestrator
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: global-orchestrator
          image: jmeter-global-orchestrator:dev
          env:
            - name: ORACLE_METRICS_URL
              value: "jdbc:oracle:thin:@//oracle:1521/FREEPDB1"
            - name: ORACLE_GLOBALRUN_URL
              value: "jdbc:oracle:thin:@//oracle:1521/FREEPDB1"
            - name: METRICS_CONSUMER_URL          # the platform-health probe only
              value: "http://metrics-consumer:8083"
