# Generated once by the Track 7 layout (2026-08-30); hand-maintained since.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Token-free: a concrete namespace and local image tags, so `kubectl apply -k`
# works without a pipeline (kind loads the :dev images). The umbrella
# infra/deploy/k8s/kind composes every service's local overlay.
resources:
  - ../../base/
  - network-policy-custom.yml
  - mailhog.yml
patches:
  - path: deployment.yml
namespace: jmeter-cloud
configMapGenerator:
  - name: app-runtime-global-orchestrator
    literals:
      - SPRING_PROFILES_ACTIVE=local
# Dev credentials = the compose defaults (already public in this repo).
secretGenerator:
  - name: global-orchestrator-credentials
    literals:
      - metricsReaderUser=metricsReader
      - metricsReaderPassword=localdev
      - metricsPurgerUser=metricsPurger
      - metricsPurgerPassword=localdev
      - globalrunWriterUser=globalOrchestratorWriter
      - globalrunWriterPassword=localdev
      - anthropicApiKey=
    options:
      disableNameSuffixHash: true
