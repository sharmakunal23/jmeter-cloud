# Generated once by the Track 7 layout (2026-08-30); hand-maintained since.
# jmeter-global-orchestrator — the control plane: run state, application registry, capacity, the reader over the group tables, the AI proxy.
# Environment-neutral shape: probes, security context, resources, the env the
# service needs in every tier. Everything that differs per tier (image, URLs,
# replicas, memory, volumes, profile) is patched by kube/kustomize/overlays/<env>.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: global-orchestrator
  labels:
    app: global-orchestrator
spec:
  replicas: 1
  revisionHistoryLimit: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: global-orchestrator
  template:
    metadata:
      labels:
        app: global-orchestrator
    spec:
      enableServiceLinks: false        # kubelet's REDIS_PORT=tcp://… would collide with ${REDIS_PORT:6379}-style bindings
      # Holds no cluster credential — no token mounted (the regional does that work).
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true             # runAsUser / fsGroup are tier values (the PV labels) — set by the overlays
      imagePullSecrets:
        - name: image-pull-secret
      containers:
        - name: global-orchestrator
          image: ${containerImageUri}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: app-runtime-global-orchestrator     # generated by the overlay: SPRING_PROFILES_ACTIVE
          env:
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx256m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -XX:+UseContainerSupport"
            - name: HTTP_PORT
              value: "8082"
            - name: HTTP_BIND_ADDRESS
              value: "0.0.0.0"
            - name: TZ
              value: UTC
            - name: GLOBAL_ORCHESTRATOR_REGION
              value: us-east-1
            - name: GLOBAL_ORCHESTRATOR_FANOUT_THREADS
              value: "32"
            - name: ORACLE_METRICS_READER_USER
              valueFrom:
                secretKeyRef:
                  name: global-orchestrator-credentials
                  key: metricsReaderUser
            - name: ORACLE_METRICS_READER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: global-orchestrator-credentials
                  key: metricsReaderPassword
            - name: ORACLE_METRICS_PURGER_USER
              valueFrom:
                secretKeyRef:
                  name: global-orchestrator-credentials
                  key: metricsPurgerUser
            - name: ORACLE_METRICS_PURGER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: global-orchestrator-credentials
                  key: metricsPurgerPassword
            - name: ORACLE_GLOBALRUN_WRITER_USER
              valueFrom:
                secretKeyRef:
                  name: global-orchestrator-credentials
                  key: globalrunWriterUser
            - name: ORACLE_GLOBALRUN_WRITER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: global-orchestrator-credentials
                  key: globalrunWriterPassword
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: global-orchestrator-credentials
                  key: anthropicApiKey
            - name: SERVER_FORWARD_HEADERS_STRATEGY
              value: NATIVE
            - name: SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES
              value: .*
            - name: INFO_KUBE_ENV
              value: "${environment}"
            - name: INFO_KUBE_CLUSTER
              value: "${cluster}"
            - name: INFO_KUBE_IMAGE
              value: "${containerImageUri}"
            - name: INFO_KUBE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: INFO_KUBE_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: INFO_KUBE_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: INFO_KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # Three-probe pattern: startup + liveness follow the PROCESS (never a
          # dependency — a database or storage blip must not restart every
          # replica); readiness follows the dependencies and only gates traffic.
          startupProbe:
            httpGet:
              path: /actuator/keepalive
              port: http
              httpHeaders:
                - name: x-forwarded-proto
                  value: https
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 30       # 150 s boot budget
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
              httpHeaders:
                - name: x-forwarded-proto
                  value: https
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/keepalive
              port: http
              httpHeaders:
                - name: x-forwarded-proto
                  value: https
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            # requests == limits for memory (Guaranteed QoS: the JVM's heap is
            # fixed, so the node's OOM killer never picks this pod first). The
            # CPU limit exists because the platform's namespace quota counts
            # limits.cpu; it is generous enough not to throttle at steady state.
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              cpu: "1"
              memory: 1536Mi
