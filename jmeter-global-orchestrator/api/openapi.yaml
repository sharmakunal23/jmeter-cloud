openapi: 3.0.3

info:
  title: jmeter-global-orchestrator
  version: 0.1.0
  summary: Fan-out layer driving many jmeter-local-orchestrators across regions.
  description: |
    The control plane: clients hit this service, and it fans `POST /api/v1/test`
    out to many `jmeter-local-orchestrator` workers, tracking run state in the
    `ORCH_*` tables of the Oracle schema `CARDZATE_DB_GRAF` and serving metrics
    back from the application group's fact tables beside them.

    Pod selection is registry-driven and runs claim only IDLE pods from their
    application group's pool in the run's region. Clusters register at runtime
    (`POST /api/v1/regions`, CLUSTER-CAPACITY); every registered cluster fronts
    a regional orchestrator. Liveness has two sources: spun workers
    (`SOURCE=DYNAMIC`) are judged by the kubelet through the region's
    `GET /api/v1/workers` (ready → IDLE, dead/absent → LOST with the kubelet's
    reason); operator-declared workers (`SOURCE=STATIC`) are health-probed by
    the hub, and a sweeper marks them LOST after 90 s of silence.
  contact:
    name: Performance Engineering
  license:
    name: Apache-2.0

servers:
  - url: http://localhost:8082
    description: Local dev (default HTTP_PORT=8082)
  - url: http://{host}:{port}
    description: Cloud — host and port are deployment-specific
    variables:
      host: { default: global-orchestrator.jmetercloud.local }
      port: { default: "8082" }

tags:
  - name: runs
    description: Fleet-wide run lifecycle — start, query, status, metrics roll-up.
  - name: pods
    description: Pod registry — self-registration + heartbeat protocol used by every local-orchestrator.
  - name: regions
    description: |
      The cluster registry (CLUSTER-CAPACITY): clusters register at runtime
      with their regional-orchestrator endpoint, validated before anything is
      written; groups then reserve capacity on up to `maxClustersPerGroup` of
      them. `region` is the axis name everywhere — "cluster" is the UI's word.
  - name: capacity
    description: |
      Per-(group, region) pod-budget management — the worker pool is the
      application group's (GROUP-CAPACITY, 2026-08-30): every application in
      the group draws on it. `PUT /api/v1/applicationGroups/{groupId}/capacity/{region}`
      sets the group's RESERVATION on a registered cluster (CLUSTER-CAPACITY:
      a group holds at most `maxClustersPerGroup` clusters, and the sum of
      every group's reservations fits the cluster's `maxWorkers`); the `/pods`
      sub-endpoints spin / restart / drain / declare individual workers —
      spun (`SOURCE=DYNAMIC`) and declared (`SOURCE=STATIC`) workers coexist
      in one pool and both count against the reservation.
  - name: platform
    description: |
      Deployment-wide facts: `GET /api/v1/platform/capabilities` (the
      registered clusters' region ids + `maxClustersPerGroup`, read once at UI
      boot) plus the Spring Boot Actuator endpoints (health, info — the only
      exposed set since SLIMDOWN SL-E).
  - name: cronJobs
    description: |
      CRON schedules that launch a run from a saved Template on a
      cron expression. A DB-claim scheduler (FOR UPDATE SKIP LOCKED) fires due
      schedules HA-safely across replicas; `nextFireAt` is materialised so a
      missed fire is caught (catch-up-once) after a restart.
  - name: admin
    description: |
      Operator escape hatches for a stuck fleet — forced reconcile / recycle
      sweeps and a raw worker spin / teardown that skip the capacity and
      in-use checks. The sweeps are scoped to `SOURCE=DYNAMIC` rows, so a
      declared fleet is never touched.
  - name: ai
    description: |
      AI analysis — Claude-backed, server-side proxy. The
      `ANTHROPIC_API_KEY` lives only on the orchestrator; the browser calls
      these endpoints, never Anthropic. Responses are advisory, never
      authoritative. Terminal-run results are cached in the durable
      `aiResponse` table (30-day TTL); `?fresh=true` bypasses + re-bills.
      A per-instance daily cap guards cost (429 when tripped); with no key the
      endpoints return 503 `AI_DISABLED` and the UI hides its buttons.
  - name: plugins
    description: |
      The global JMeter plugin library — one version per plugin name
      (an upgrade is delete + re-register), duplicate content rejected by
      sha256. Bytes live in document-service (`X-Type: plugin`, a `.jar` or a
      `.zip` bundle of the plugin plus its dependency jars — dependency
      resolution is the uploader's job); a run references plugins via
      `StartRunRequest.pluginIds` and every worker stages the jars into its
      JMeter `search_paths` — the image is never mutated.

  - name: workflows
    description: |
      Group-scoped task graphs: health checks, load tests, emails, waits and
      approval gates wired into a DAG. An edge carries a condition
      (`ON_SUCCESS`, `ON_FAILURE`, `ALWAYS`) and two edges out of one task run
      their targets in parallel — the shape of the graph is the only thing that
      expresses ordering. Executions are advanced by a tick-driven engine, so a
      restart costs at most one tick and N replicas each advance an execution
      exactly once.

paths:

  # ────────────────────────────────────────────────────────────────────────
  # Run management
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/runs:
    post:
      tags: [runs]
      summary: Start a fleet-wide test run
      description: |

        **Async launch.** With `spinShortfall: true` and a shortfall the hub
        must provision, the response is `201` at once with the run in
        `PREPARING` and `stateReason` like `provisioning 6 worker(s)
        (na-east 3, na-west 3) — 2/6 ready`; a background task spins the
        workers in parallel, claims them and fans out, and the run moves to
        `RUNNING` (or `FAILED` with the reason). Poll `GET /runs/{runId}/status`;
        it has no members until the claim. `POST /runs/{runId}/abort` during
        PREPARING cancels the launch. A PREPARING run older than
        `RUN_LAUNCH_TIMEOUT_MS` (10 min) is failed by the sweeper.
        Creates a run, claims pods from the registry per the request's
        `fleetAllocation` (or the legacy `fleetSize` + single-element
        `regions` shortcut), inserts one `runFleetMember` per pod, and
        fans out `POST /api/v1/test` to each. Returns 201 with the
        persisted run + member rows; check `state` (`RUNNING` if all
        fan-outs accepted, `FAILED` if all rejected, `RUNNING` with a
        partial reason otherwise) and per-member `fanoutStatusCode` for
        diagnostics.

        Strict mode (default): any per-region shortfall rolls back with
        503 `INSUFFICIENT_CAPACITY` carrying a structured `shortfall`
        array.

        Best-effort mode (`?bestEffort=true`): the run launches with
        whatever was claimed; the deficit is recorded on
        `run.stateReason` as `bestEffort claim — …`. Still 503s when
        zero pods could be claimed across all requested regions.
      parameters:
        - name: bestEffort
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: |
            When `true`, accept a partial claim instead of rolling back
            on a per-region shortfall. The run launches with whatever
            pods were available and the shortfall is recorded on
            `run.stateReason`.
        - $ref: "#/components/parameters/XActorHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartRunRequest" }
      responses:
        "201":
          description: Run created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "400":
          description: |
            Malformed body or invalid allocation — codes:
            `INVALID_REQUEST`, `UNKNOWN_REGION`, `FLEET_SIZE_EXCEEDED`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: |
            Per-region capacity shortfall (strict mode) or zero pods
            claimable (best-effort mode). Body carries structured
            `shortfall` so the UI can highlight specific regions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    get:
      tags: [runs]
      summary: List recent runs
      description: |
        Most-recent first. Pagination uses `?offset=N&limit=25` with the
        total count emitted as an `X-Total-Count` response header — the
        body stays a flat array so existing clients keep working.

        UI-D3 added the optional `application` filter — when set, only
        runs launched against that application are returned (NULL/legacy
        rows are excluded).

        Soft-deleted ("hidden") runs are excluded by default; pass
        `includeHidden=true` to surface them mixed with visible runs, or
        `hidden=true` for the "Archived" view (ONLY hidden runs — the
        hard-delete / purge surface).
      parameters:
        - { name: state,         in: query, required: false, schema: { type: string, enum: [active] }, description: "If `active`, exclude COMPLETED/FAILED/ABORTED runs." }
        - { name: application,   in: query, required: false, schema: { type: string },                  description: "UI-D3 — filter to runs launched against the named application. Empty/missing → no filter." }
        - { name: includeHidden, in: query, required: false, schema: { type: boolean, default: false }, description: "When true, include soft-deleted (hidden) runs mixed with visible ones." }
        - { name: hidden,        in: query, required: false, schema: { type: boolean, default: false }, description: "When true, return ONLY hidden runs (the Archived / purge view). Takes precedence over includeHidden." }
        - { name: offset,        in: query, required: false, schema: { type: integer, default: 0,  minimum: 0 } }
        - { name: limit,         in: query, required: false, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: Most-recent first.
          headers:
            X-Total-Count:
              schema: { type: integer }
              description: |
                UI-D3 — total number of rows matching the filter (NOT
                limited by `limit`/`offset`). Drives the pagination UI.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Run" }

  /api/v1/runs/{runId}:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" } }
    get:
      tags: [runs]
      summary: Run definition + fleet member list
      responses:
        "200":
          description: Run + fleet members (no live refresh).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404":
          description: Unknown runId.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [runs]
      summary: Soft-delete ("hide") a terminal run
      description: |
        Hides a run so it drops out of the default `GET /runs` listing — the
        declutter primitive so operators see only the runs that matter.

        This is a SOFT delete: the run row, its fleet members, the audit trail,
        and any saved results are RETAINED. A hidden run is still reachable by
        id (`GET /runs/{runId}`) and via `GET /runs?includeHidden=true`, so the
        action is reversible. (Chosen over a hard delete to preserve the audit
        trail — the `DELETE` event recorded here stays valid.)

        Only TERMINAL runs (COMPLETED / FAILED / ABORTED) can be hidden — an
        active run is still important and pins live pods. The `X-Actor` header
        attributes the action and an optional `reason` rides onto the `DELETE`
        audit event.
      parameters:
        - $ref: "#/components/parameters/XActorHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteRunRequest" }
      responses:
        "200":
          description: Run hidden. Body is the (now-hidden) run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404":
          description: Unknown runId — code `RUN_NOT_FOUND`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Run is still active — code `RUN_NOT_DELETABLE` (only terminal runs can be hidden).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/runs/{runId}/purge:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" } }
    post:
      tags: [runs]
      summary: Purge a hidden run (irreversible)
      description: |
        The second tier of the two-tier delete model ("trash, then empty
        trash"). Unlike `DELETE /runs/{runId}` (which only HIDES), this
        PHYSICALLY removes the run and the storage it occupies — it CANNOT be
        undone:

        - result blobs in document-service (`results-{runId}-*`), plus the run's
          testPlan / dataFiles blobs **only if** no other run still references
          them (shared uploaded plans survive);
        - the run's fact rows in its group's `<GROUP_ID>_METRICS` (and `_METRICS_H`);
        - its AI-cache + trend rows, and the `run` row itself — cascading its
          fleet members and audit events.

        A `purgeAudit` tombstone records who/what/when + what was reclaimed
        (it outlives the deleted run).

        Precondition: the run must already be HIDDEN (via `DELETE /runs/{runId}`)
        and terminal. `X-Actor` attributes the action; an optional `reason` rides
        onto the tombstone.

        Retry-safe: every step is idempotent. If document-service is unreachable
        the DB purge still proceeds and `blobStepComplete=false` is returned —
        orphaned, runId-named result blobs are reclaimed by a future retention
        sweep.
      parameters:
        - $ref: "#/components/parameters/XActorHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteRunRequest" }
      responses:
        "200":
          description: Run permanently deleted. Body summarises what was reclaimed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurgeRunResponse" }
        "404":
          description: Unknown runId — code `RUN_NOT_FOUND`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: |
            Run is still active, or has not been hidden first — code
            `RUN_NOT_PURGEABLE` (purge requires a hidden, terminal run).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/runs/{runId}/status:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" } }
    get:
      tags: [runs]
      summary: Aggregated run state across the fleet (live refresh)
      description: |
        Polls each non-terminal member's local orchestrator
        (`GET /api/v1/test`), updates the stored member state, and rolls
        the result up to the run-level `state`. For a fleet of N pods,
        this is N HTTP calls — fine for fleets up to a few dozen pods.
      responses:
        "200":
          description: Aggregated run state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunStatus" }
        "404":
          description: Unknown runId.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/runs/{runId}/events:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" } }
    get:
      tags: [runs]
      summary: Audit timeline for a run
      description: |
        The reverse-chronological list of state-changing
        operator actions against this run: who started it, who scaled it
        up/down, who drained a worker, when, and with what result. One row
        per action (append-only).

        Paginated — a long-running test can accumulate many events. Use
        `?offset=N&limit=25`; the total count rides on the `X-Total-Count`
        response header (the body stays a flat array, mirroring `GET /runs`).
        Default page size is 25, newest first.

        Rejected actions ARE recorded — e.g. a scale-up that hit the
        per-(group, region) cap shows
        `result: "rejected:APPLICATION_CAPACITY_EXCEEDED"` — so the timeline
        reflects attempts, not just successes.
      parameters:
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0,  minimum: 0 } }
        - { name: limit,  in: query, required: false, schema: { type: integer, default: 25, minimum: 1, maximum: 200 } }
      responses:
        "200":
          description: One page of audit events, newest first.
          headers:
            X-Total-Count:
              schema: { type: integer }
              description: Total events for this run across all pages.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RunEvent" }
        "404":
          description: Unknown runId — code `RUN_NOT_FOUND`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/runs/{runId}/scaleUp:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" } }
    post:
      tags: [runs]
      summary: Add workers to a RUNNING run (mid-test scale-up)
      description: |
        Claims additional IDLE pods from the
        run's group's per-region pool and fans out
        `POST /api/v1/test` to each. The original run's `testPlanBlobId` +
        `dataFilesBlobId` are sourced from the persisted run row, so the
        request body only carries the per-region allocation. Each new
        worker therefore stages the SAME test plan AND data files as the
        original fleet (the local-orchestrator fetches both blobs from the
        document-service before launching JMeter) and inherits the run's
        `saveResults` setting (forwarded as `autoUploadResults`).

        New `runFleetMember` rows are stamped with `joinedAtSecond`
        (seconds since `run.startedAt`) so the consumer + UI can
        distinguish original-fleet members from mid-test joiners.

        Properties are NOT inherited from existing fleet members —
        position-based inheritance would be surprising. Pass
        `perNodeProperties` in the allocation entry to set extra `-J`
        properties on the new workers.

        Strict mode (default): per-region shortfall rolls back with 503
        `INSUFFICIENT_CAPACITY`. Per-(group, region) capacity exceeded
        rolls back with 409 `APPLICATION_CAPACITY_EXCEEDED`.

        Best-effort mode (`?bestEffort=true`): adds whatever was claimed;
        the deficit is recorded on `run.stateReason`. Still 503s when
        zero pods could be claimed across all requested regions.

        Spin mode (`?spinShortfall=true`): on a per-region shortfall,
        provision (spin) the missing pods up to the per-(group, region)
        `maxAvailable` ceiling, wait for them to report healthy, then
        retry the claim — mirrors `POST /api/v1/runs`'s `spinShortfall`.
        Lets the operator add workers up to MAX CAPACITY (not just the
        currently-provisioned IDLE pods). If filling the gap would exceed
        the ceiling, the response is 409 `APPLICATION_CAPACITY_EXCEEDED`
        (raise the ceiling first). Combine with `bestEffort` to spin what
        the ceiling allows and accept any residual shortfall.

        Pre-conditions:
          - Run must exist (else 404 `RUN_NOT_FOUND`).
          - Run state must be `RUNNING` (else 409 `RUN_NOT_SCALABLE` —
            PREPARING/STARTING means the original fan-out hasn't
            finished; terminal means scaleUp is meaningless).
          - Run must have an `application` binding (else 409
            `RUN_NOT_SCALABLE_NO_APPLICATION` — pre-V4 legacy untagged
            runs don't have an app to gate capacity against).
      parameters:
        - name: bestEffort
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: |
            When `true`, accept a partial claim instead of rolling back
            on a per-region shortfall. The new workers join with whatever
            pods were available; the shortfall is recorded on
            `run.stateReason`.
        - name: spinShortfall
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: |
            When `true`, a per-region shortfall triggers an on-the-fly
            spin of the missing pods (subject to the per-(group, region)
            `maxAvailable` ceiling) followed by a claim retry — so the
            operator can scale up to max capacity, not just the
            currently-IDLE pods. Exceeding the ceiling → 409
            `APPLICATION_CAPACITY_EXCEEDED`. The UI sets this only after
            the operator confirms the "provision missing workers" prompt
            rendered from the 503 shortfall body.
        - $ref: "#/components/parameters/XActorHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScaleUpRunRequest" }
      responses:
        "200":
          description: Workers added (or partial-add for best-effort).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScaleUpRunResponse" }
        "400":
          description: |
            Malformed body or invalid allocation — codes:
            `INVALID_REQUEST`, `UNKNOWN_REGION`, `FLEET_SIZE_EXCEEDED`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Unknown runId — code `RUN_NOT_FOUND`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: |
            Pre-condition violation — codes:
            `RUN_NOT_SCALABLE` (run not in RUNNING state),
            `RUN_NOT_SCALABLE_NO_APPLICATION` (run has no app binding),
            `APPLICATION_CAPACITY_EXCEEDED` (per-(group, region) cap hit — the app's group's pool).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: |
            Per-region capacity shortfall (strict mode) or zero pods
            claimable (best-effort mode). Body carries structured
            `shortfall` so the UI can highlight specific regions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/runs/{runId}/scaleDown:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" } }
    post:
      tags: [runs]
      summary: Drain workers from a RUNNING run (mid-test scale-down)
      description: |
        Gracefully drains the targeted workers
        — each pod's local-orchestrator sends `Shutdown` to JMeter's
        TCP port (default `4445`); in-flight samplers complete; the
        worker lands in `DRAINED` on clean exit. If the drain budget
        elapses without exit (`JMETER_DRAIN_TIMEOUT_S`, default 60 s on
        the local-orch), the worker lands `ABORTED` with reason
        `drainTimeoutExpired`.

        Body supplies exactly one of:
          - `workerIds` — explicit list of pod ids to drain.
          - `allocations` — per-region count; the service picks the N
            most-recently-created RUNNING members in that region
            (youngest-first).

        Member state goes RUNNING → `DRAINING` immediately at the API
        boundary; the local poll path is sticky on DRAINING so the
        operator-visible state doesn't flicker back to RUNNING while
        in-flight samplers complete. Run state stays `RUNNING` —
        drain on its own does not end the run; the run goes terminal
        only when ALL members are terminal.

        Already-terminal targets (e.g., a worker that hit COMPLETED
        right before the drain RPC arrived) are silently skipped and
        listed under `skipped` in the response. Already-DRAINING is
        also skipped (idempotent).

        Pre-conditions:
          - Run must exist (else 404 `RUN_NOT_FOUND`).
          - Run state must be `RUNNING` (else 409 `RUN_NOT_SCALABLE`).
          - For `workerIds`: every id must reference a member of this
            run (else 400 `INVALID_REQUEST`).
      parameters:
        - $ref: "#/components/parameters/XActorHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScaleDownRunRequest" }
      responses:
        "200":
          description: Drain RPCs fired (or no-op if all targets were skipped).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScaleDownRunResponse" }
        "400":
          description: |
            Malformed body, missing both `workerIds` and `allocations`,
            both supplied (must be exactly one), unknown workerId, or
            invalid allocation entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Unknown runId — code `RUN_NOT_FOUND`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: |
            Run not in scalable state — code `RUN_NOT_SCALABLE` (run
            state ≠ RUNNING).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/runs/{runId}/properties:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" } }
    post:
      tags: [runs]
      summary: Push runtime JMeter properties to a RUNNING run's workers
      description: |
        UX-DYNAMICS T5 — pushes property values to the selected (default:
        all) ACCEPTED/RUNNING members in one shot; each worker forwards them
        into its JMeter child via the BeanShell server. Only plan values read
        through `${__P(name)}` observe the update, at their next evaluation —
        thread counts do not change. Applied values merge into each
        successful member's persisted snapshot, so run detail and later
        template saves stay truthful. A partial failure is a 200 — the
        per-worker rows carry the truth.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRunPropertiesRequest" }
      responses:
        "200":
          description: Per-worker results (`ok` / `error`) plus the applied key set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateRunPropertiesResponse" }
        "400":
          description: Bad property map, or a workerId that is not an ACCEPTED/RUNNING member.
        "404":
          description: RUN_NOT_FOUND.
        "409":
          description: RUN_NOT_RUNNING — properties can only be pushed while the run is RUNNING.

  /api/v1/runs/{runId}/abort:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" } }
    post:
      tags: [runs]
      summary: Force-terminate a run (hard stop / zombie-run cleanup)
      description: |
        Rolls the WHOLE run to `ABORTED`, best-effort hard-kills each live
        worker (`POST /api/v1/test/abort`), and releases every fleet-member
        binding — freeing the run's pods for re-claim and drain.

        Unlike `scaleDown` (graceful; the run keeps running), abort ends the
        run. This is the clean way to clear a run whose workers have died but
        whose row is stuck non-terminal — which otherwise pins its pods forever
        (`POD_IN_USE` on every drain) and causes a re-spun same-name worker to
        re-bind to the dead run.

        Each non-terminal member is marked `ABORTED`; the `ABORT` audit event
        records who aborted (`X-Actor`), the optional `reason`, and a ledger of
        which workers acknowledged the kill vs. were unreachable. A worker that
        is already gone (abort RPC fails / 404 NO_ACTIVE_RUN) still counts as
        aborted — the run is force-terminated regardless of RPC outcome.

        Save Results: aborting clears the run's `saveResults` flag. An aborted
        run never produced a clean upload (the local-orchestrator skips the JTL
        upload on a non-COMPLETE stop), so the run-detail "Download results"
        link (gated on `saveResults`) must not appear, and the platform stops
        polling the now-dead workers for an upload that will never land.

        Idempotency guard: aborting an already-terminal run is refused 409
        `RUN_NOT_ABORTABLE` (nothing to abort; its pods are already released).
      parameters:
        - $ref: "#/components/parameters/XActorHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AbortRunRequest" }
      responses:
        "200":
          description: Run aborted. Body is the post-abort run (state ABORTED).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404":
          description: Unknown runId — code `RUN_NOT_FOUND`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Run is already terminal — code `RUN_NOT_ABORTABLE`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/runs/{runId}/members/{workerId}/logs:
    parameters:
      - { name: runId,    in: path,  required: true, schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" } }
      - { name: workerId, in: path,  required: true, schema: { type: string } }
      - { name: stream,   in: query, required: false, schema: { type: string, default: console, enum: [console, jmeter] }, description: "Source selector forwarded to the pod. `console` (default) tails the orchestrator's in-memory ring of the JMeter child's stdout/stderr. `jmeter` tails jmeter.log on disk (JMeter's own log4j output — distinct content). Unknown values produce 400 from the local orchestrator." }
      - { name: tail,     in: query, required: false, schema: { type: integer, default: 200, minimum: 1, maximum: 10000 } }
    get:
      tags: [runs]
      summary: "Per-pod log tail proxied through the global"
      description: |
        Looks up the pod's `podBaseUrl` from `runFleetMember`, calls the
        local orchestrator's `GET /api/v1/logs?stream=&tail=N`, and
        forwards the raw `text/plain` body. Used by the run-detail
        page's live log panel — the UI talks only to its known origin
        while the proxy fans the request out to the right pod.
      responses:
        "200":
          description: Log tail (text/plain). Empty body when the pod's ring buffer / log file hasn't filled yet.
          content:
            text/plain; charset=UTF-8:
              schema: { type: string }
        "400":
          description: Unknown `stream` value (forwarded from the local orchestrator).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Unknown runId or workerId not in the run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "502":
          description: Pod unreachable.
          content:
            text/plain:
              schema: { type: string }

  /api/v1/runs/{runId}/metrics:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" } }
    get:
      tags: [runs]
      summary: Aggregate report, one row per label
      description: |
        Folds the run's rows in its application group's `<GROUP_ID>_METRICS`
        (and the archived-day table) per JMeter label, busiest first: samples,
        throughput over the rows' span, throughput-weighted avg/p50/p90/p95/p99,
        max, and the label's `application` (the group classifier's value).
        `window` narrows it to the run's trailing slice the way the charts do;
        `labelPrefix` keeps only labels starting with that text (an exact
        prefix — an index range, never a fuzzy match); `labelLimit` keeps the
        busiest N (10 by default, `all` for every one). A run whose application
        has no group, or whose rows have not landed, answers an empty `byLabel`.
      parameters:
        - name: window
          in: query
          required: false
          schema: { type: string, enum: [5m, 10m, 15m, 30m, 1h, 2h, 4h, all], default: all }
          description: Trailing window anchored at the run's latest data window; `all` = the whole run.
        - name: labelPrefix
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
          description: Only labels whose key starts with this text (case-sensitive, at most 100 chars).
        - name: labelLimit
          in: query
          required: false
          schema: { type: string, default: "10" }
          description: The busiest labels to return — a number 1–50, or `all` for every label. Anything else is 400.
      responses:
        "200":
          description: Per-label rollup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunMetricsRollup" }
        "404":
          description: Unknown runId.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/runs/{runId}/summary:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" } }
    get:
      tags: [runs]
      summary: Run summary, totals and one row per application
      description: |
        One `GROUP BY ROLLUP(LABEL.APPLICATION)` statement over the run's rows
        (or its trailing `window`): the total and one row per application, each
        with samples, errors, `tps` (samples over the span the rows cover —
        `MAX(WINDOW_SECOND) - MIN + 15`, the dashboard's formula), error %,
        throughput-weighted avg/p90/p95/p99, max and peak active threads.
        Zeros (200, not 404) while the run has no rows; cached for terminal runs.
      parameters:
        - name: window
          in: query
          required: false
          schema: { type: string, enum: [5m, 10m, 15m, 30m, 1h, 2h, 4h, all], default: all }
          description: Trailing window anchored at the run's latest data window; `all` = the whole run.
      responses:
        "200":
          description: The run's headline stats over the range.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunSummary" }
        "404":
          description: Unknown runId.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/runs/timeseries:
    get:
      tags: [runs]
      summary: Batched timeseries for the comparison view (HM-5)
      description: |
        Returns timeseries for exactly two runs in a single round-trip.
        Drives the side-by-side comparison page where an operator picks
        two runs (e.g. before/after a tuning PR) and views their TPS,
        avg RT, and error % overlaid on shared axes.

        **Strict ids count.** The `ids` query parameter must contain
        exactly two distinct, non-empty run ids (comma-separated). The
        UI compares two runs only — single-run views go through
        `/api/v1/runs/{runId}/timeseries`; three or more is out of scope.

        **Partial-200.** If one (or both) of the two ids does not
        resolve to a known run, the response is still 200 with the
        present run's payload in `runs` and the missing id reported in
        `missing`. Forcing the operator to re-issue the request to
        find out *which* run is gone would be a worse experience than
        telling them upfront.

        Each per-run payload uses the same `MetricsTimeseries` schema
        as the single-run endpoint (same downsampling rules apply).
      parameters:
        - name: ids
          in: query
          required: true
          description: Exactly two distinct run ids, comma-separated.
          schema:
            type: string
            example: "01J0000000000000000000RUNA,01J0000000000000000000RUNB"
      responses:
        "200":
          description: Batched per-run timeseries (partial-200 if one or both ids are missing).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricsTimeseriesBatch" }
        "400":
          description: Missing `ids` param, or count is not exactly 2.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/runs/{runId}/timeseries:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" } }
    get:
      tags: [runs]
      summary: Bucketed timeseries for the run-detail Metrics tab
      description: |
        Read from the run's application group fact table
        (`<GROUP_ID>_METRICS`, plus the archived-day table for older data)
        the way the hosted Grafana panels read it: rows bucketed by
        `FLOOR(WINDOW_SECOND / g) * g`, `tps` = samples / g, `avgRtMs`,
        `p90Ms`, `p95Ms`, `p99Ms` throughput-weighted, `errorPct` = 100 ×
        (4xx + 5xx) / samples (the dashboard's definition, not JMeter's
        success flag), `statusCodes` keyed by HTTP class (`2xx` … `5xx`,
        `other`) as counts per second. `bucketSize` is `g` — 15 (the workers'
        window), 30 or 60 — the smallest that keeps the response under 1500
        points, or the requested `granularity`.

        `byRegion=true` adds `regions` (per `WORKER.REGION`; hot rows only),
        `byApplication=true` adds `applications` (per `LABEL.APPLICATION`),
        `byLabel=true` adds `labels` (per `LABEL.LABEL_KEY`, the `labelLimit`
        busiest — 10 by default, `all` for every one — of the `labelsTotal`
        matching `labelPrefix`);
        `series` stays the exact
        fold of any split. A live run drops its newest ~20 s (still being
        published). Empty series (200, not 404) while the run has no group
        or no rows yet — the friendly polling shape.
      parameters:
        - name: byRegion
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: When true, include the per-region breakdown in `regions`.
        - name: byApplication
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: When true, include the per-application split in `applications`.
        - name: byLabel
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: When true, include the per-label split in `labels` — the busiest labels by samples.
        - name: labelPrefix
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
          description: With `byLabel`, only labels whose key starts with this text (an exact prefix; at most 100 chars).
        - name: labelLimit
          in: query
          required: false
          schema: { type: string, default: "10" }
          description: With `byLabel`, how many of the busiest labels to return — a number 1–50, or `all` for every label. Anything else is 400.
        - name: granularity
          in: query
          required: false
          schema: { type: integer, enum: [15, 30, 60] }
          description: Bucket width in seconds (the Grafana picker's values); omitted = the server's smallest bounded choice. Anything else is 400.
        - name: window
          in: query
          required: false
          schema: { type: string, enum: [5m, 10m, 15m, 30m, 1h, 2h, 4h, all], default: all }
          description: |
            Trailing window anchored at the run's latest data window (not wall
            clock); `all` = the whole run. Anything else is 400.
      responses:
        "200":
          description: Per-second timeseries for the run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricsTimeseries" }
        "404":
          description: Unknown runId.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ────────────────────────────────────────────────────────────────────────
  # AI analysis — server-side Claude proxy
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/ai/status:
    get:
      tags: [ai]
      summary: AI feature probe (enabled + model)
      description: |
        Reports whether AI analysis is configured on this server. Consumes no
        quota and never calls Claude — the UI polls it once to decide whether to
        render the AI buttons at all (hidden when `enabled=false`).
      responses:
        "200":
          description: AI feature status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiStatus" }

  /api/v1/ai/ping:
    post:
      tags: [ai]
      summary: AI smoke test (fixed prompt)
      description: |
        Sends a fixed prompt and returns the reply plus token counts — for
        first-time-setup verification + latency baselining. Not wired into the
        UI. Counts against the daily cap.
      responses:
        "200":
          description: Reply + token counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiPingResponse" }
        "429":
          description: Daily invocation cap reached.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: No API key configured (`AI_DISABLED`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/runs/{runId}/insights:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" } }
    post:
      tags: [ai]
      summary: Generate AI insights for a single run (AI-1)
      description: |
        Hands the run's metadata, timeseries, and per-label rollup to
        Claude and returns a short summary plus 3–5 severity-tagged findings.
        Advisory only. Terminal runs are cached in the durable `aiResponse`
        table (no re-bill on reload); active runs are never cached (their inputs
        are still moving). `?fresh=true` bypasses the cache and re-bills.
      parameters:
        - name: fresh
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Bypass the cache and re-generate (re-bills, counts against the cap).
      responses:
        "200":
          description: Run insights (freshly generated or served from cache — see `fromCache`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunInsights" }
        "404":
          description: Unknown runId.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Daily invocation cap reached (`AI_QUOTA_EXCEEDED`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "502":
          description: Upstream provider call failed (`AI_UPSTREAM_ERROR`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: No API key configured (`AI_DISABLED`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/runs/compareInsights:
    post:
      tags: [ai]
      summary: Explain the delta between two runs (AI-2)
      description: |
        Hands both runs' timeseries to Claude and returns a comparison narrative
        plus per-metric verdicts (regression / improvement / no significant
        change). Mirrors the batch timeseries endpoint's strict exactly-2-distinct-ids
        contract; both runs must exist (a missing run is a 404 — we refuse to
        compare against nothing). Cached on the sorted pair for terminal runs;
        `?fresh=true` bypasses + re-bills.
      parameters:
        - name: ids
          in: query
          required: true
          description: Exactly two distinct run ids, comma-separated.
          schema:
            type: string
            example: "01J0000000000000000000RUNA,01J0000000000000000000RUNB"
        - name: fresh
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Bypass the cache and re-generate (re-bills, counts against the cap).
      responses:
        "200":
          description: Comparison insights (freshly generated or served from cache — see `fromCache`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompareInsights" }
        "400":
          description: Missing `ids` param, or count is not exactly 2.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: One of the two runs is unknown.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Daily invocation cap reached (`AI_QUOTA_EXCEEDED`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "502":
          description: Upstream provider call failed (`AI_UPSTREAM_ERROR`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: No API key configured (`AI_DISABLED`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ────────────────────────────────────────────────────────────────────────
  # Pod registry
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/registerPod:
    post:
      tags: [pods]
      summary: Register (or refresh) a local-orchestrator pod
      description: |
        Idempotent: a re-registering pod resets its `state` to IDLE and
        bumps `lastHeartbeat` to now. Operator-declared workers call this on
        boot via the `PodRegistrar` bean (only wired when
        `GLOBAL_ORCHESTRATOR_URL` is set); workers a regional orchestrator
        creates never do — their liveness is the region's Pod list.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterPodRequest" }
      responses:
        "200":
          description: Pod registered (or refreshed).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          description: Missing podId, baseUrl, or groupId.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/heartbeat:
    post:
      tags: [pods]
      summary: Heartbeat from a registered pod
      description: |
        Refreshes the pod's `lastHeartbeat` and flips its state from LOST
        back to IDLE if the sweeper had marked it stale. Local
        orchestrators ping this every `podRegistrar.heartbeatIntervalMs`
        (default 30 s).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HeartbeatRequest" }
      responses:
        "200":
          description: Heartbeat acknowledged.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404":
          description: Unknown podId — caller should re-register.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/pods:
    get:
      tags: [pods]
      summary: List every registered pod with its current state
      responses:
        "200":
          description: Pod registry contents (ordered by lastHeartbeat DESC).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pod" }

  /api/v1/applicationGroups:
    get:
      tags: [applications]
      summary: List application groups
      description: |
        A group is a team's set of applications; its `groupId` is what the
        group's workers send as `?groupId=` on every metrics POST and, upper-cased,
        the prefix of the group's fact tables (`cps` → `CPS_METRICS`), so it must
        name a row of the metrics schema's `GROUP_REGISTRY`. Sorted by name;
        each row carries `applicationCount` (visible applications only — archived
        rows still hold the FK and block group deletion).
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApplicationGroup" }
    post:
      tags: [applications]
      summary: Create an application group
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApplicationGroupRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationGroup" }
        "400":
          description: INVALID_REQUEST — groupId not `[a-z][a-z0-9_]{0,29}`, name blank or > 255, description > 512.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: APPLICATION_GROUP_ID_TAKEN or APPLICATION_GROUP_NAME_TAKEN.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/applicationGroups/{groupId}:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,29}$" } }
    get:
      tags: [applications]
      summary: Get one application group
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationGroup" }
        "404":
          description: APPLICATION_GROUP_NOT_FOUND
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    put:
      tags: [applications]
      summary: Rename / re-describe an application group
      description: "`groupId` is immutable — it is the workers' routing key."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateApplicationGroupRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationGroup" }
        "400":
          description: INVALID_REQUEST
        "404":
          description: APPLICATION_GROUP_NOT_FOUND
        "409":
          description: APPLICATION_GROUP_NAME_TAKEN
    delete:
      tags: [applications]
      summary: Delete an application group
      description: |
        Hard delete, idempotent (an unknown group is 204). Refused while any
        application — visible or archived — is still in the group (move them
        to another group or purge them first), or while the group still owns
        workers or capacity rows (drain the workers and remove the regions first).
      responses:
        "204":
          description: Deleted (or never existed).
        "409":
          description: APPLICATION_GROUP_HAS_APPLICATIONS or APPLICATION_GROUP_HAS_WORKERS
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/applications:
    get:
      tags: [applications]
      summary: List registered applications
      description: |
        D-AppRegistry — returns the registered-application registry sorted
        by name. Each row carries operator-managed metadata (sealId,
        description, healthEndpoints) plus a health snapshot
        (`lastHealthStatus`, `lastHealthCheckedAt`, `lastHealthDetails`)
        updated by `ApplicationHealthPoller` every minute.

        Pass `hidden=true` for the "Archived applications" view — ONLY
        soft-deleted apps (the hard-delete / purge surface). Their `name` is
        the archived `<name>__deleted__<id>` form. Default lists visible apps.
      parameters:
        - { name: hidden, in: query, required: false, schema: { type: boolean, default: false }, description: "When true, return ONLY hidden (soft-deleted) apps — the Archived / purge view." }
      responses:
        "200":
          description: Most-recent first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Application" }
    post:
      tags: [applications]
      summary: Register a new application
      description: |
        Registration is a pure DB operation: the application row is
        inserted in its group (`metricsGroupId` is required). Capacity is the
        group's — the group attaches registered clusters and reserves workers
        through the capacity endpoints (CLUSTER-CAPACITY; nothing is seeded at
        group creation). Pod counts are never set here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApplicationRequest" }
      responses:
        "201":
          description: Application created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "400":
          description: INVALID_REQUEST — name regex / length limits / health URL shape failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: APPLICATION_NAME_TAKEN — another row already uses this name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/applications/{applicationId}:
    parameters:
      - { name: applicationId, in: path, required: true, schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" } }
    get:
      tags: [applications]
      summary: Get one application by id
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "404":
          description: APPLICATION_NOT_FOUND
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    put:
      tags: [applications]
      summary: Update an application's metadata
      description: |
        Operator-controlled fields (name, sealId, description, healthEndpoints)
        are replaced wholesale. Health-snapshot fields are owned by
        `ApplicationHealthPoller` and never touched by PUT.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateApplicationRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "400":
          description: INVALID_REQUEST
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: APPLICATION_NOT_FOUND
        "409":
          description: APPLICATION_NAME_TAKEN
    delete:
      tags: [applications]
      summary: Soft-delete ("hide") an application
      description: |
        SOFT delete: the application is HIDDEN — it drops out of the
        applications list, launcher picker, capacity matrix, and health
        poller (everything reads the non-hidden listing). The row, its
        capacity rows, this app's run history + metrics + audit-trail
        events, and all uploaded blobs (test plans / data files / results)
        are RETAINED. To reclaim that storage, follow with
        `POST /applications/{id}/purge` ("trash, then empty trash").

        The original name is FREED for re-use: the hidden row is renamed to
        an archived name (`<name>__deleted__<id>`) and its runs are re-tagged
        to match, in one transaction. So the operator can immediately register
        a fresh application with the original name, and that new app does NOT
        inherit this one's run history.

        Idempotent — hiding an unknown OR already-hidden app returns 204.

        Blocked while the application has any active (non-terminal) run:
        those runs are reached through the application page, so hiding
        would orphan them — abort or let them finish first.
      responses:
        "204":
          description: Hidden (or already hidden / never existed).
        "409":
          description: |
            APPLICATION_HAS_ACTIVE_RUNS — the application still has active
            (non-terminal) runs. Abort or let them finish before hiding it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/applications/{applicationId}/purge:
    parameters:
      - { name: applicationId, in: path, required: true, schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" } }
    post:
      tags: [applications]
      summary: Purge a hidden application (irreversible)
      description: |
        The second tier of the two-tier delete model ("trash, then empty
        trash"). Unlike `DELETE /applications/{id}` (which only HIDES), this
        PHYSICALLY removes a HIDDEN application and its entire footprint — it
        CANNOT be undone:

        - every one of the app's runs is purged (result/testPlan/dataFiles
          blobs, metric rows, run-state rows — same fan-out as
          `POST /runs/{id}/purge`);
        - its health-transition log;
        - the `application` row itself. Workers and capacity are the
          group's (`pod.groupId`, `groupCapacity`), so the pool is untouched.

        A single `purgeAudit` tombstone records the sweep.

        Precondition: the app must already be HIDDEN (via `DELETE
        /applications/{id}`). `X-Actor` attributes the action; an optional
        `reason` rides onto the tombstone.
      parameters:
        - $ref: "#/components/parameters/XActorHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteApplicationRequest" }
      responses:
        "200":
          description: Application permanently deleted. Body summarises what was reclaimed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurgeApplicationResponse" }
        "404":
          description: Unknown applicationId — code `APPLICATION_NOT_FOUND`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: |
            The application exists but has not been hidden first — code
            `APPLICATION_NOT_PURGEABLE` (purge requires a hidden app).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/plugins:
    get:
      tags: [plugins]
      summary: List the plugin library
      description: Every registered plugin, ordered by name.
      responses:
        "200":
          description: The library.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Plugin" }
    post:
      tags: [plugins]
      summary: Register an uploaded plugin
      description: |
        Registers a blob already uploaded with `X-Type: plugin`; sha256, size
        and file name come from the blob's server-computed metadata. One
        version per plugin name — a second upload of an existing name is
        rejected `409 PLUGIN_NAME_TAKEN` (and identical bytes under any name
        `409 PLUGIN_CONTENT_DUPLICATE`), each carrying `existing`
        `{pluginId, name, version}` and `orphanBlobDeleted` (the hub deletes
        the caller's now-orphan upload unless a registry row references it).
      parameters:
        - $ref: "#/components/parameters/XActorHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterPluginRequest" }
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plugin" }
        "400":
          description: |
            Codes `INVALID_PLUGIN_NAME`, `INVALID_PLUGIN_VERSION`,
            `BLOB_NOT_FOUND`, `BLOB_NOT_PLUGIN` (blob not uploaded with
            `X-Type: plugin`), `INVALID_PLUGIN_FILE` (not `.jar`/`.zip`),
            `PLUGIN_TOO_LARGE` (over 256 MB), `BLOB_METADATA_INCOMPLETE`
            (the blob's metadata carries no sha256 — re-upload it). The file
            name must match `[A-Za-z0-9][A-Za-z0-9._-]{0,254}` and end
            `.jar`/`.zip` — the exact rule workers enforce at fan-out, so a
            name they would reject can never register.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: "`PLUGIN_NAME_TAKEN` or `PLUGIN_CONTENT_DUPLICATE` — see the POST description."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginConflictResponse" }
        "503":
          description: "`DOCUMENT_SERVICE_UNAVAILABLE` — the blob-metadata lookup failed; retry once the document-service is reachable."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/plugins/{pluginId}:
    delete:
      tags: [plugins]
      summary: Delete a plugin from the library
      description: |
        Removes the registry row; the blob is retained so historical runs and
        scale-up joiners can always stage their launch snapshot. Idempotent —
        an unknown id is 204.
      parameters:
        - name: pluginId
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
      responses:
        "204": { description: Deleted (or already absent). }
        "409":
          description: "`PLUGIN_IN_USE` — a non-terminal run's snapshot references it; wait for the run to end."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/regions:
    get:
      tags: [pods]
      summary: Per-region pod capacity rollup
      description: |
        Aggregates `ORCH_POD` by region; `idlePods`
        excludes pods already claimed by an active `ORCH_RUN_FLEET_MEMBER` row,
        so the count reflects what `POST /api/v1/runs` could claim
        right now. Used by the UI launcher's per-region allocation
        widget.
      responses:
        "200":
          description: Per-region capacity rollup.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RegionCapacity" }
    post:
      tags: [regions]
      summary: Register a cluster (CLUSTER-CAPACITY)
      operationId: registerCluster
      description: |
        Registers a cluster at runtime after the validation chain passes:
        the regional-orchestrator endpoint answers `/api/v1/capabilities`,
        reports the same region id, and its `/api/v1/provisioningCheck` dry
        run proves it can create worker Pods (image configured, RBAC verbs by
        SelfSubjectAccessReview, quota headroom ≥ 1 worker). Nothing is
        written unless every check passes; the `checks` array in either
        response is the operator's ✓/✗ checklist. `region` stays the axis
        name everywhere — "cluster" is the UI's display word.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterClusterRequest" }
      responses:
        "201":
          description: Cluster registered (`cluster` + the passing `checks`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterRegistrationResponse" }
        "400":
          description: "`INVALID_REQUEST` — id/label/maxWorkers shape."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: |
            `CLUSTER_EXISTS` (id already registered), `CLUSTER_NAME_TAKEN`
            (display name in use) or `CLUSTER_URL_TAKEN` (that regional
            already fronts another cluster) — id, display name and regional
            URL must each be unique.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: |
            Validation failed — `code` is the first failing check's
            (`INVALID_CLUSTER_URL`, `CLUSTER_UNREACHABLE`, `REGION_MISMATCH`,
            `NO_WORKER_IMAGE`, `RBAC_DENIED`, `QUOTA_EXHAUSTED`) and `checks`
            carries the whole checklist with per-check detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterValidationError" }

  /api/v1/regions/{region}:
    put:
      tags: [regions]
      summary: Edit a cluster (label, endpoint, ceiling)
      operationId: updateCluster
      description: |
        Null fields keep their current value. A changed `regionalUrl` re-runs
        the validation chain (422 on failure, nothing written); shrinking
        `maxWorkers` below the groups' reservations answers
        `409 CLUSTER_SHRINK_BELOW_RESERVED`.
      parameters: [ { $ref: "#/components/parameters/regionPath" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateClusterRequest" }
      responses:
        "200":
          description: Updated (`checks` present only when the URL was re-validated).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterRegistrationResponse" }
        "404":
          description: "`CLUSTER_NOT_REGISTERED`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: |
            `CLUSTER_SHRINK_BELOW_RESERVED` (+ `maxWorkers`, `reserved`), or
            `CLUSTER_NAME_TAKEN` / `CLUSTER_URL_TAKEN` when the edit would
            steal another cluster's name or endpoint.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Re-validation of a changed URL failed (see POST).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterValidationError" }
    delete:
      tags: [regions]
      summary: Deregister a cluster
      operationId: deleteCluster
      description: |
        Refused while any group reservation or worker row references the
        region — remove those first. Runs keep their historical region
        strings; nothing rewrites them.
      parameters: [ { $ref: "#/components/parameters/regionPath" } ]
      responses:
        "204": { description: Deregistered. }
        "404":
          description: "`CLUSTER_NOT_REGISTERED`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: "`CLUSTER_IN_USE` (+ `reservations`, `workers`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/regions/{region}/testProvision:
    post:
      tags: [regions]
      summary: Deep validation — spin one probe worker (async)
      operationId: testProvisionCluster
      description: |
        Spins one real probe worker (`probe-{region}-{epoch}`, groupId
        `probe`, never in `ORCH_POD`), waits for the kubelet to report it
        ready (bounded by `regionProbe.testProvisionTimeoutMs`, 180 s), then
        deletes it and records PASS/FAIL with detail on the cluster row.
        Asynchronous by design — a synchronous call could outlive the proxy
        timeout; poll `GET /api/v1/regions/status` for `lastProbe`.
      parameters: [ { $ref: "#/components/parameters/regionPath" } ]
      responses:
        "202":
          description: "Probe started (`probing: true`)."
          content:
            application/json:
              schema: { type: object }
        "404":
          description: "`CLUSTER_NOT_REGISTERED`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: "`PROBE_IN_PROGRESS` — one probe per cluster at a time."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/regions/status:
    get:
      tags: [regions]
      summary: Registered clusters — registration, probe verdicts, reservations
      description: |
        One entry per registered cluster (`ORCH_REGION`), in region order —
        the Clusters page's single read: the registration row (`label`,
        `regionalUrl`, `maxWorkers`, `lastValidatedAt`, `lastProbe`), the
        live probe verdict (`reachable` is `null` until the first probe, then
        `true`/`false` with `lastSeenAt` / `lastError`, plus the regional's
        `capabilities` — worker image, footprint, quota headroom), the sum of
        the groups' reservations (`reservedWorkers`) and the registry's
        worker count (`provisionedWorkers`).
      responses:
        "200":
          description: Cluster statuses.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClusterStatus" }

  # ────────────────────────────────────────────────────────────────────────
  # Admin — escape hatches (sweeps scoped to SOURCE=DYNAMIC rows)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/admin/reconcilePods:
    post:
      tags: [admin]
      summary: Force one reconciler sweep now
      description: |
        Runs the registry-vs-cluster reconcile the scheduler runs every tick
        and reports what it changed. Scoped to `SOURCE=DYNAMIC` rows — a
        declared fleet is never reconciled away.
      responses:
        "200":
          description: Sweep summary.
          content:
            application/json:
              schema:
                type: object
                required: [adopted, started, orphansDeleted, errors]
                properties:
                  adopted:        { type: integer, description: Cluster workers with no registry row that were adopted. }
                  started:        { type: integer, description: Registry rows whose worker was re-created. }
                  orphansDeleted: { type: integer, description: Registry rows with no worker that were removed. }
                  errors:         { type: integer }
  /api/v1/admin/recyclePods:
    post:
      tags: [admin]
      summary: Force one recycle sweep now
      description: |
        Runs the recycle-policy sweep immediately instead of waiting for its
        cadence — the way to smoke-test a threshold policy. Declared workers
        (`SOURCE=STATIC`) are never recycled.
      responses:
        "200":
          description: Sweep summary.
          content:
            application/json:
              schema:
                type: object
                required: [recycled, skipped, errors]
                properties:
                  recycled: { type: integer }
                  skipped:  { type: integer }
                  errors:   { type: integer }
  /api/v1/admin/spinPod:
    post:
      tags: [admin]
      summary: Spin one worker, bypassing the capacity checks
      description: |
        Allocates the next free name for the (group, region) and asks the
        region to create the worker — **without** the `maxAvailable` check
        `POST …/capacity/{region}/pods` enforces. For a stuck fleet only.
        `400` when either field is blank, `404` for an unknown group.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupId, region]
              properties:
                groupId: { type: string }
                region:  { type: string }
      responses:
        "201":
          description: The worker was requested; it registers itself once ready.
          content:
            application/json:
              schema:
                type: object
                required: [podName, groupId, region, baseUrl]
                properties:
                  podName: { type: string }
                  groupId: { type: string }
                  region:  { type: string }
                  baseUrl: { type: string }
        "400":
          description: "`INVALID_REQUEST` — groupId and region are required."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: "`APPLICATION_GROUP_NOT_FOUND`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/admin/pods/{podName}:
    parameters:
      - { name: podName, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$" }, description: "DNS-1123 label; anything else is 400 INVALID_POD_NAME." }
    delete:
      tags: [admin]
      summary: Tear a worker down, bypassing the in-use check
      description: |
        Stops and removes the worker in its region regardless of whether a
        run holds it; the registry row is removed by the next reconciler
        sweep (or `POST /api/v1/admin/reconcilePods`). `404 POD_NOT_REGISTERED`
        when the registry has no row (its region is then unknown), `409
        POD_SOURCE_STATIC` for an operator-declared worker — the platform never
        created it, so it never destroys it (release it through
        `DELETE …/capacity/{region}/pods/{podName}` instead).
      responses:
        "200":
          description: The worker was stopped.
          content:
            application/json:
              schema:
                type: object
                required: [podName, stopped]
                properties:
                  podName: { type: string }
                  stopped: { type: boolean, enum: [true] }
        "404":
          description: "`POD_NOT_REGISTERED`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: "`POD_SOURCE_STATIC` — an operator-declared worker is not the control plane's to tear down."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ────────────────────────────────────────────────────────────────────────
  # Capacity — the application group's worker pool (GROUP-CAPACITY).
  # All endpoints scoped to one (groupId, region).
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/applicationGroups/{groupId}/capacity/{region}:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,29}$" } }
      - { name: region,  in: path, required: true, schema: { type: string } }
    put:
      tags: [capacity]
      summary: Set the group's reservation on a cluster
      description: |
        `maxAvailable` is the group's RESERVATION on the registered cluster
        (CLUSTER-CAPACITY) — spun and declared workers both count against it.
        The write is serialised per cluster and holds three invariants:
        `404 CLUSTER_NOT_REGISTERED` (register the cluster first),
        `409 GROUP_CLUSTER_LIMIT` (a group holds at most `maxClustersPerGroup`
        clusters — creating this row would exceed it) and
        `409 CLUSTER_CAPACITY_EXCEEDED` (+ `maxWorkers`, `reservedByOthers`,
        `requested` — the sum of every group's reservations must fit the
        cluster's `maxWorkers`). Also refuses
        `409 CAPACITY_SHRINK_BELOW_PROVISIONED` when the requested reservation
        is lower than the pods currently provisioned (drain first).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [maxAvailable]
              properties:
                maxAvailable: { type: integer, minimum: 0, maximum: 1000 }
      responses:
        "200":
          description: Updated capacity row.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupCapacityRow" }
        "400":
          description: Invalid maxAvailable.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: "`CLUSTER_NOT_REGISTERED` or `APPLICATION_GROUP_NOT_FOUND`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: |
            `CAPACITY_SHRINK_BELOW_PROVISIONED`, `GROUP_CLUSTER_LIMIT` or
            `CLUSTER_CAPACITY_EXCEEDED`.
          content: { application/json: { schema: { $ref: "#/components/schemas/CapacityShrinkResponse" } } }
    delete:
      tags: [capacity]
      summary: Detach a cluster from the group
      description: |
        The "detach a cluster" half of the Capacity tab's cluster picker —
        removes the group's reservation row. Drain-first: refuses 409
        `REGION_NOT_EMPTY` while the pool still has workers there. 404 when
        the group has no reservation on the cluster.
      responses:
        "204":
          description: Region removed.
        "404":
          description: Region (or application) not configured.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: Region still has provisioned workers.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /api/v1/applicationGroups/{groupId}/capacity/{region}/pods:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,29}$" } }
      - { name: region,  in: path, required: true, schema: { type: string } }
    get:
      tags: [capacity]
      summary: List pods for (group, region) with Ready / In-Use state
      responses:
        "200":
          description: Per-(group, region) capacity snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapacitySnapshot" }
    post:
      tags: [capacity]
      summary: Spin up one new Ready pod
      description: |
        Allocates the next free `{appName}-{region}-worker-{n}` name,
        creates and starts the container, then waits for the local-orch
        to self-register (typically <30 s; the registry row appears
        asynchronously via POST /registerPod). The response carries the
        allocated podName + the baseUrl the global will use to fan out.
      responses:
        "201":
          description: Spin started. Container created + start command issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpinPodResponse" }
        "404":
          description: groupId or capacity row missing.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: |
            The spin would exceed the group's reservation
            (`APPLICATION_CAPACITY_EXCEEDED`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapacityExceededResponse" }

  /api/v1/applicationGroups/{groupId}/capacity/{region}/pods/{podName}/restart:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,29}$" } }
      - { name: region,  in: path, required: true, schema: { type: string } }
      - { name: podName, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$" }, description: "DNS-1123 label; anything else is 400 INVALID_POD_NAME." }
    post:
      tags: [capacity]
      summary: Restart one container in place
      responses:
        "200":
          description: Restart issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  podName:   { type: string }
                  restarted: { type: boolean }
        "404":
          description: Pod not bound to (groupId, region).
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: |
            `POD_SOURCE_STATIC` — an operator-declared worker is not the
            control plane's to restart; manage it where it is deployed.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /api/v1/applicationGroups/{groupId}/capacity/{region}/pods/{podName}:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,29}$" } }
      - { name: region,  in: path, required: true, schema: { type: string } }
      - { name: podName, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$" }, description: "DNS-1123 label; anything else is 400 INVALID_POD_NAME." }
    put:
      tags: [capacity]
      summary: Declare an operator-deployed worker (SOURCE=STATIC)
      description: |
        Binds a worker the operator deployed themselves to this
        (group, region) pool, as a `SOURCE=STATIC` row that coexists with
        spun workers (CLUSTER-CAPACITY). A NEW declaration consumes the
        group's reservation exactly like a spin — `404
        CAPACITY_REGION_NOT_FOUND` when the group has no reservation on the
        cluster, `409 APPLICATION_CAPACITY_EXCEEDED` when it is full;
        re-declaring an existing worker consumes nothing.

        PUT rather than a parallel `/staticPods` collection: the operator
        names the resource (they deployed it and know its name), the call is
        idempotent, and one worker resource keeps the verbs carrying the
        meaning — POST allocates-and-spins, PUT declares an existing one,
        DELETE releases either.

        `podName` MUST equal the `workerId` the worker stamps on its metrics
        or the `WORKER (RUN_ID, WORKER_KEY)` join breaks. The worker's
        `baseUrl` must be hub-reachable (an ingress FQDN on a hosted
        cluster) — a declared worker is dialled directly, never through the
        region's relay.

        The address is probed (`GET {baseUrl}/actuator/health`) before the
        declaration is accepted, so a typo fails here rather than at the next
        run launch. `?force=true` skips that check for a worker that is
        deployed but not up yet.

        Re-declaring a worker YOU declared is idempotent (it corrects the
        address). Declaring over a worker the PLATFORM created
        (`SOURCE=DYNAMIC`) is refused `409 POD_SOURCE_DYNAMIC` — the row would
        flip to STATIC and the cluster would leak that Pod forever. A
        re-declare that MOVES a worker into another cluster pays that cluster's
        reservation like a new one.
      parameters:
        - name: force
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Declare even if the worker does not currently answer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeclarePodRequest" }
      responses:
        "201":
          description: Worker newly declared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeclaredPodResponse" }
        "200":
          description: An existing declaration was updated (idempotent re-declare).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeclaredPodResponse" }
        "400":
          description: |
            `INVALID_REQUEST` (malformed podName / baseUrl — non-HTTP scheme,
            embedded credentials, query or fragment) or `WORKER_UNREACHABLE`
            (address did not answer and `force` was not set).
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: |
            `APPLICATION_GROUP_NOT_FOUND`, or `CAPACITY_REGION_NOT_FOUND` —
            attach the cluster and reserve capacity first.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: |
            `APPLICATION_CAPACITY_EXCEEDED` (the reservation is full — also
            raised when a re-declare moves the worker INTO this cluster),
            `POD_SOURCE_DYNAMIC` (the name belongs to a platform-created
            worker), `POD_BOUND_ELSEWHERE` (already declared to another group),
            or `POD_IN_USE` (re-addressing a worker held by an active run would
            break that run's follow-up calls to it).
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    delete:
      tags: [capacity]
      summary: Release a pod — drain (spun) or undeclare (declared)
      description: |
        For a spun worker (`SOURCE=DYNAMIC`) this is a full **drain**: the
        Pod is stopped and removed through its regional, then the registry
        row is deleted. For a declared one (`SOURCE=STATIC`) it is an
        **undeclare** — the registry row is deleted and the operator's worker
        keeps running, because the control plane does not own it. The in-use
        guard, the stale-binding release and the response shape are
        identical; only `containerStopped` differs.

        Refuses 409 `POD_IN_USE` when the pod is held by an active run whose
        worker **container is still running** — a genuinely busy pod. To drain
        it, abort the run first (`POST /api/v1/runs/{runId}/abort`).

        STALE-BINDING tolerance: if the pod is bound to a non-terminal run but
        its container is no longer running (a zombie run — the worker died and
        no heartbeat flipped the run terminal), the binding is treated as stale.
        The drain proceeds, releasing the dead member binding so a re-spun
        same-name worker won't re-bind to the zombie run; the response carries
        `staleBindingReleased: true`. (The zombie run itself stays non-terminal
        until you abort it — drain frees the pod, abort ends the run.)
      responses:
        "200":
          description: Drained.
          content:
            application/json:
              schema:
                type: object
                properties:
                  podName: { type: string }
                  drained: { type: boolean }
                  containerStopped:
                    type: boolean
                    description: |
                      True when the control plane stopped and removed the
                      worker container (dynamic mode). False in static mode —
                      the registry row was removed and the operator's worker
                      was left running.
                  staleBindingReleased:
                    type: boolean
                    description: |
                      Present + true only when the drain released a stale
                      binding to a non-terminal run whose container was gone.
        "404":
          description: Pod not bound to (groupId, region).
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: Pod is held by an active run whose container is still running.
          content: { application/json: { schema: { $ref: "#/components/schemas/PodInUseResponse" } } }

  # ────────────────────────────────────────────────────────────────────────
  # Platform capabilities
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/platform/health:
    get:
      tags: [platform]
      summary: The whole platform's health as one tree
      description: |
        The hub is the only component that talks to every other one, so it
        is the only place the whole picture exists: itself (Oracle pools,
        cache), the metrics-consumer, the document-service, and every data
        center (the regional orchestrator's last probe verdict + the worker
        registry's idle/busy/lost counts). Served from a snapshot refreshed
        every minute by parallel, bounded probes — a request never waits on a
        probe. The UI renders the nesting as-is; it never probes a regional
        or a data-plane service itself.

        Statuses: `UP` · `DEGRADED` (serving, but a child or dependency is
        not — a lost worker, a cold cache) · `DOWN` · `UNKNOWN` (not probed
        yet). A parent is the worst of its children; the metrics-consumer's
        `ingestProgress` is reported as a fact ("idle — last envelope 12 min
        ago"), never as DOWN, because idle between runs is normal.
      parameters:
        - name: refresh
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Probe now (bounded by the probe timeout) instead of returning the last snapshot.
      responses:
        "200":
          description: The tree.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformHealth" }

  /api/v1/platform/capabilities:
    get:
      tags: [platform]
      summary: What this deployment can do — read once at UI boot
      description: |
        Deployment facts the UI reads at boot: the registered clusters'
        region ids (the runtime registry — refreshed by the probe's tick) and
        `maxClustersPerGroup`. Whether each cluster's regional answers is
        `GET /api/v1/regions/status`.

        This is deliberately server-side rather than a build-time UI flag:
        a browser flag cannot enforce anything and would force a UI image
        rebuild per environment, breaking the one-image-serves-docker-and-
        Kubernetes property. The server decides; the browser reflects.
      responses:
        "200":
          description: Deployment capabilities.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformCapabilities" }

  # ────────────────────────────────────────────────────────────────────────
  # Spring Boot Actuator
  # ────────────────────────────────────────────────────────────────────────
  /actuator/health:
    get:
      tags: [platform]
      summary: Aggregate health (Spring Boot Actuator)
      responses:
        "200":
          description: UP.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /actuator/info:
    get:
      tags: [platform]
      summary: Build / version info
      responses:
        "200":
          description: Build info.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/v1/cronJobs:
    get:
      tags: [cronJobs]
      summary: List CRON schedules
      description: |
        All schedules, optionally filtered by `application`,
        sorted by `nextFireAt` ascending (disabled — null `nextFireAt` — last).
      parameters:
        - { name: application, in: query, required: false, schema: { type: string }, description: "Filter to one application's schedules." }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CronJobListResponse" }
    post:
      tags: [cronJobs]
      summary: Create a CRON schedule
      description: |
        Validates: the cron expression parses (5-field unix or 6-field; also
        `@macro`), the application is registered, the template blob is fetchable
        from document-service, the template's own application agrees with the
        schedule's, and `(applicationName, name)` is unique. `nextFireAt` is
        seeded from the expression. `createdBy` is taken from `X-Actor`.
      parameters:
        - { $ref: "#/components/parameters/XActorHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CronJobRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CronJobSummary" }
        "400":
          description: |
            INVALID_REQUEST (name/applicationName/templateBlobId missing or
            template/application mismatch), INVALID_CRON (bad expression /
            timezone), UNKNOWN_APPLICATION (not registered), or
            TEMPLATE_UNAVAILABLE (blob missing / unparseable).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: CRON_JOB_CONFLICT — a schedule with this name already exists for the application.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/cronJobs/{cronJobId}:
    parameters:
      - { name: cronJobId, in: path, required: true, schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" } }
    get:
      tags: [cronJobs]
      summary: Get one schedule
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CronJobSummary" }
        "404":
          description: CRON_JOB_NOT_FOUND
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    put:
      tags: [cronJobs]
      summary: Edit a schedule's definition
      description: |
        Replaces name / applicationName / templateBlobId / cronExpression /
        timeZone (same validation as create). `enabled` is managed by the
        enable/disable endpoints, not here. `nextFireAt` is recomputed from the
        new expression when the schedule is enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CronJobRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CronJobSummary" }
        "400":
          description: INVALID_REQUEST / INVALID_CRON / UNKNOWN_APPLICATION / TEMPLATE_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: CRON_JOB_NOT_FOUND
        "409":
          description: CRON_JOB_CONFLICT
    delete:
      tags: [cronJobs]
      summary: Delete a schedule
      description: |
        Hard-deletes the schedule row. Its append-only fire history is retained
        (FK-less) for forensics.
      responses:
        "204":
          description: Deleted.
        "404":
          description: CRON_JOB_NOT_FOUND
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/cronJobs/{cronJobId}/fireNow:
    parameters:
      - { name: cronJobId, in: path, required: true, schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" } }
      - { $ref: "#/components/parameters/XActorHeader" }
    post:
      tags: [cronJobs]
      summary: Fire a schedule now (manual)
      description: |
        Operator-triggered fire on the same launch path as a scheduled fire,
        attributed to the operator's `X-Actor`. Does NOT change the schedule's
        cadence (`nextFireAt` is untouched). Returns the outcome.
      responses:
        "202":
          description: |
            Accepted — the fire was attempted. `outcome` is LAUNCHED (run
            started), SKIPPED (no capacity / previous run still active), or
            FAILED (template unavailable / launch error).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CronJobFireResult" }
        "404":
          description: CRON_JOB_NOT_FOUND
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/cronJobs/{cronJobId}/enable:
    parameters:
      - { name: cronJobId, in: path, required: true, schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" } }
    post:
      tags: [cronJobs]
      summary: Enable a schedule
      description: Sets enabled=true and seeds `nextFireAt` from the expression.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CronJobSummary" }
        "404":
          description: CRON_JOB_NOT_FOUND

  /api/v1/cronJobs/{cronJobId}/disable:
    parameters:
      - { name: cronJobId, in: path, required: true, schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" } }
    post:
      tags: [cronJobs]
      summary: Disable a schedule
      description: Sets enabled=false and clears `nextFireAt` so the sweep can't see it.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CronJobSummary" }
        "404":
          description: CRON_JOB_NOT_FOUND

  /api/v1/cronJobs/{cronJobId}/skipNext:
    parameters:
      - { name: cronJobId, in: path, required: true, schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" } }
    post:
      tags: [cronJobs]
      summary: Skip the next scheduled fire
      description: >
        Advances `nextFireAt` to the slot after the current one without firing —
        a one-off "not this time" that leaves the schedule enabled. 409
        `NOTHING_TO_SKIP` if the schedule is disabled or has no upcoming fire.
      responses:
        "200":
          description: ok (the schedule with its advanced `nextFireAt`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CronJobSummary" }
        "404":
          description: CRON_JOB_NOT_FOUND
        "409":
          description: NOTHING_TO_SKIP

  /api/v1/cronJobs/{cronJobId}/history:
    parameters:
      - { name: cronJobId, in: path, required: true, schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" } }
    get:
      tags: [cronJobs]
      summary: Fire history for a schedule
      description: Append-only fire-attempt log, newest first.
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CronJobFire" }
        "404":
          description: CRON_JOB_NOT_FOUND

  /api/v1/automation/reports/infraReadiness:
    get:
      tags: [cronJobs]
      summary: Preview the infra-readiness report
      description: |
        On-demand render of the same content the INFRA_READINESS scheduled fire
        would email — so the report is never email-only. Returns the structured
        report, the email subject, and the rendered HTML body. The optional
        customSubject / customIntro params preview unsaved operator tailoring.
      parameters:
        - { name: customSubject, in: query, required: false, schema: { type: string }, description: "Preview an unsaved custom subject." }
        - { name: customIntro,   in: query, required: false, schema: { type: string }, description: "Preview an unsaved intro note." }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject: { type: string }
                  html:    { type: string, description: "Rendered HTML email body." }
                  report:
                    type: object
                    properties:
                      generatedAt: { type: string, format: date-time }
                      allClear:    { type: boolean }
                      backends:
                        type: array
                        items:
                          type: object
                          properties:
                            name:   { type: string }
                            status: { type: string }
                            detail: { type: string, nullable: true }
                      apps:
                        type: array
                        items:
                          type: object
                          properties:
                            name:               { type: string }
                            currentStatus:      { type: string }
                            downtimeMinutes24h: { type: integer, format: int64 }
                            healthyNow:         { type: boolean }

  /api/v1/automation/reports/daily:
    get:
      tags: [cronJobs]
      summary: Preview the daily perf-test report
      description: |
        On-demand render of the same content the DAILY_REPORT scheduled fire
        would email — so the report is never email-only. Returns the structured
        report (per-app run counts for the last 24h + p50/p95/error-rate vs the
        6-day baseline + top regressions), the email subject, and the rendered
        HTML body. Reads existing run + runTrend data; no metrics-table scan.
        The optional customSubject / customIntro params preview unsaved tailoring.
      parameters:
        - { name: customSubject, in: query, required: false, schema: { type: string }, description: "Preview an unsaved custom subject." }
        - { name: customIntro,   in: query, required: false, schema: { type: string }, description: "Preview an unsaved intro note." }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject: { type: string }
                  html:    { type: string, description: "Rendered HTML email body." }
                  report:
                    type: object
                    properties:
                      generatedAt: { type: string, format: date-time }
                      totalRuns:   { type: integer, format: int64, description: "Runs launched across all apps in the last 24h." }
                      apps:
                        type: array
                        items:
                          type: object
                          properties:
                            name:      { type: string }
                            launched:  { type: integer, format: int64 }
                            completed: { type: integer, format: int64 }
                            failed:    { type: integer, format: int64 }
                            recent:    { type: object, nullable: true, description: "Last-24h averaged p50Ms/p95Ms/errorRate (null when no completed runs)." }
                            baseline:  { type: object, nullable: true, description: "Preceding 6-day averaged p50Ms/p95Ms/errorRate (null when no baseline runs)." }
                      topRegressions:
                        type: array
                        items:
                          type: object
                          properties:
                            application:   { type: string }
                            baselineP95Ms: { type: number, format: double }
                            recentP95Ms:   { type: number, format: double }
                            deltaPct:      { type: number, format: double }

  # ────────────────────────────────────────────────────────────────────────
  # Workflows
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/workflows/groups:
    get:
      tags: [workflows]
      summary: Application groups with workflow counts
      description: |
        The Workflows landing surface: every application group, who owns it, and
        how many workflows it holds. A workflow's load tests draw on its group's
        reserved capacity, which is why the group — not the application — is the
        unit of navigation.
      responses:
        "200":
          description: One row per group.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkflowGroupSummary" }

  /api/v1/workflows:
    get:
      tags: [workflows]
      summary: Workflows in one group
      description: Each row carries its most recent execution, so a list needs no follow-up call.
      parameters:
        - name: groupId
          in: query
          required: true
          schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,29}$" }
      responses:
        "200":
          description: The group's workflows, by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Workflow" }
        "404": { description: "No such group." }
    post:
      tags: [workflows]
      summary: Create a workflow
      description: |
        The graph is validated before it is stored — shape (acyclic, ≤ 64 tasks,
        ≤ 16 load tests, per-task config) and references (the applications named
        exist and belong to this group, the clusters allocated are reserved).
        Capacity only warns here: a draft outlives today's reservation, and the
        launch is where it is enforced.
      parameters:
        - $ref: "#/components/parameters/XActorHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveWorkflowRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workflow" }
        "400":
          description: "`WORKFLOW_INVALID` — the body carries every violation, so the builder can mark all the bad tasks at once."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowInvalidError" }
        "409": { description: "`WORKFLOW_NAME_TAKEN` — that name is used in this group." }

  /api/v1/workflows/validate:
    post:
      tags: [workflows]
      summary: Validate a draft without saving it
      description: |
        The same checks a save runs, plus the capacity picture and the
        design-time warnings: peak concurrent workers per cluster against the
        group's reservation. The peak is the
        graph's maximum-weight antichain — the most that can ever run at once —
        not a per-task maximum, and `capacity[].tasks` names the tasks behind
        each number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupId, graph]
              properties:
                groupId: { type: string }
                graph:   { $ref: "#/components/schemas/WorkflowGraph" }
      responses:
        "200":
          description: Errors, warnings and the per-cluster demand.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowValidation" }

  /api/v1/workflows/{workflowId}:
    parameters:
      - name: workflowId
        in: path
        required: true
        schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
    get:
      tags: [workflows]
      summary: One workflow
      description: >-
        Carries `lastExecution`, which is how a client knows an execution is in
        progress and that Run and Edit are therefore refused.
      responses:
        "200":
          description: The workflow and its graph.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workflow" }
        "404": { description: "No such workflow." }
    put:
      tags: [workflows]
      summary: Save a workflow
      description: |
        `revision` is required and must be the one the editor loaded; a stale
        value is `409 WORKFLOW_REVISION_CONFLICT` rather than an overwrite, so
        two operators on one canvas cannot silently discard each other's work.
      parameters:
        - $ref: "#/components/parameters/XActorHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveWorkflowRequest" }
      responses:
        "200":
          description: Saved; `revision` is bumped.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workflow" }
        "400": { description: "`WORKFLOW_INVALID`, or `BAD_REQUEST` when `revision` is missing." }
        "409":
          description: >-
            `WORKFLOW_REVISION_CONFLICT` — reload and re-apply;
            `WORKFLOW_RUNNING` — an execution is in progress, and editing would
            leave the canvas showing something that run is not doing;
            `WORKFLOW_NAME_TAKEN` for a duplicate name.
        "404": { description: "No such workflow." }
    delete:
      tags: [workflows]
      summary: Delete a workflow and its runs
      description: |
        Deletes the workflow and every execution recording it — nothing lists an
        execution except through its workflow, so leaving them would leave rows
        no surface can reach. The load tests' own runs are NOT deleted: a run is
        its own history, listed under its application.

        A run in progress refuses the delete unless `cancelRunning=true`, which
        stops it first. An operator who wants the workflow gone will cancel by
        hand and delete anyway, so the two steps are offered as one.
      parameters:
        - name: cancelRunning
          in: query
          required: false
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/XActorHeader"
      responses:
        "200":
          description: Deleted; the body says what it took with it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelledExecutions: { type: integer }
                  deletedExecutions:   { type: integer }
        "409": { description: "`WORKFLOW_RUNNING` — pass `cancelRunning=true` to stop it and delete." }

  /api/v1/workflows/{workflowId}/executions:
    parameters:
      - name: workflowId
        in: path
        required: true
        schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
    post:
      tags: [workflows]
      summary: Launch a workflow
      description: |
        Opens an execution with one task per node and lets the engine take it
        from the next tick. The capacity pre-flight is the hard gate: a graph
        whose peak exceeds the group's reservation is refused before any task
        runs, rather than passing its health checks, sending its "starting now"
        mail and then failing on the third load test.
      parameters:
        - $ref: "#/components/parameters/XActorHeader"
      responses:
        "202":
          description: Accepted; the execution is RUNNING with every task PENDING.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowExecution" }
        "409":
          description: |
            `WORKFLOW_CAPACITY_EXCEEDED` — the body names the clusters, the peak
            and the tasks that make it up; `WORKFLOW_ALREADY_RUNNING` — one
            execution of a workflow at a time, because the capacity pre-flight
            reasons about the graph in isolation and a second concurrent copy
            would be cleared against the same reservation; or
            `WORKFLOW_DISABLED`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowCapacityError" }
        "400": { description: "`WORKFLOW_INVALID` — the stored graph no longer validates (an application moved group, a cluster lost its reservation)." }
        "404": { description: "No such workflow." }
    get:
      tags: [workflows]
      summary: Execution history
      description: |
        Newest first, capped at 200. Task rows are omitted — the execution's own
        endpoint carries those. `archived=true` reads the archive instead; the
        two lists are never mixed, so a caller always knows which side it is
        acting on.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 25 }
        - name: archived
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Past and current executions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkflowExecution" }

  /api/v1/workflows/{workflowId}/executions/archive:
    parameters:
      - name: workflowId
        in: path
        required: true
        schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
    post:
      tags: [workflows]
      summary: Archive finished runs
      description: |
        Takes finished runs off the history without deleting anything. A run
        still going is skipped rather than refused — archiving one the engine is
        still advancing would hide it while it kept running, which the schema
        forbids outright.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecutionIdsRequest" }
      responses:
        "200":
          description: How many were archived.
          content:
            application/json:
              schema:
                type: object
                properties: { archived: { type: integer } }
        "400": { description: "`executionIds` is required and holds at most 200 ids." }

  /api/v1/workflows/{workflowId}/executions/restore:
    parameters:
      - name: workflowId
        in: path
        required: true
        schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
    post:
      tags: [workflows]
      summary: Put archived runs back on the history
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecutionIdsRequest" }
      responses:
        "200":
          description: How many were restored.
          content:
            application/json:
              schema:
                type: object
                properties: { restored: { type: integer } }

  /api/v1/workflows/{workflowId}/executions/delete:
    parameters:
      - name: workflowId
        in: path
        required: true
        schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
    post:
      tags: [workflows]
      summary: Delete archived runs permanently
      description: |
        Only rows already archived are eligible, which is what makes deleting
        the second, deliberate step; ids that are not archived are simply not
        deleted. The load tests' own runs are untouched.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecutionIdsRequest" }
      responses:
        "200":
          description: How many were deleted.
          content:
            application/json:
              schema:
                type: object
                properties: { deleted: { type: integer } }

  /api/v1/workflows/{workflowId}/executions/archivedCount:
    parameters:
      - name: workflowId
        in: path
        required: true
        schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
    get:
      tags: [workflows]
      summary: How many runs are archived
      responses:
        "200":
          description: The archive's size, so a client can offer it only when there is one.
          content:
            application/json:
              schema:
                type: object
                properties: { archived: { type: integer } }

  /api/v1/workflowExecutions/{executionId}:
    parameters:
      - name: executionId
        in: path
        required: true
        schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
    get:
      tags: [workflows]
      summary: One execution and its tasks
      description: |
        The graph is the snapshot taken at launch, so a workflow edited since
        still renders exactly what ran.
      responses:
        "200":
          description: The execution with every task row.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowExecution" }
        "404": { description: "No such execution." }

  /api/v1/workflowExecutions/{executionId}/runs:
    parameters:
      - name: executionId
        in: path
        required: true
        schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
    get:
      tags: [workflows]
      summary: Run ids this execution launched
      description: |
        In node order; the execution's metrics panel charts these and splits the
        series by application.
      responses:
        "200":
          description: Zero or more run ids.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  /api/v1/workflowExecutions/{executionId}/cancel:
    parameters:
      - name: executionId
        in: path
        required: true
        schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
    post:
      tags: [workflows]
      summary: Cancel an execution
      description: |
        Settles every open task and the execution. A run a load-test task
        already started keeps going — aborting someone's load test is its own
        decision, made on the run page.
      parameters:
        - $ref: "#/components/parameters/XActorHeader"
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowExecution" }
        "409": { description: "`EXECUTION_NOT_CANCELLABLE` — it already finished." }

  /api/v1/workflowExecutions/{executionId}/tasks/{taskId}/approve:
    parameters:
      - name: executionId
        in: path
        required: true
        schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
      - name: taskId
        in: path
        required: true
        schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
    post:
      tags: [workflows]
      summary: Approve a parked task
      description: |
        Settles the task and pulls the execution's next tick forward, so the
        branch continues within a tick instead of at the idle poll.
      parameters:
        - $ref: "#/components/parameters/XActorHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, description: "Why, in the approver's words; kept on the task." }
      responses:
        "200":
          description: Approved; the task is SUCCEEDED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowExecution" }
        "409": { description: "`TASK_NOT_AWAITING_APPROVAL` — somebody answered it, or it timed out." }

  /api/v1/workflowExecutions/{executionId}/tasks/{taskId}/reject:
    parameters:
      - name: executionId
        in: path
        required: true
        schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
      - name: taskId
        in: path
        required: true
        schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
    post:
      tags: [workflows]
      summary: Reject a parked task
      description: |
        Fails the task, which is what an `ON_FAILURE` edge out of an approval
        gate is for — "not now" gets its own path rather than ending the run.
      parameters:
        - $ref: "#/components/parameters/XActorHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        "200":
          description: Rejected; the task is FAILED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowExecution" }
        "409": { description: "`TASK_NOT_AWAITING_APPROVAL`." }

components:

  parameters:

    regionPath:
      name: region
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9]([-a-z0-9]{0,18}[a-z0-9])?$" }
      description: |
        The cluster's region id — lowercase DNS-1123, max 20 chars so a
        dynamic pod name `{groupId}-{region}-worker-{n}` stays a valid label.

    # AUDIT-TRAIL — shared X-Actor header on every state-changing run endpoint.
    XActorHeader:
      name: X-Actor
      in: header
      required: false
      schema: { type: string }
      description: |
        Who is performing this action. Recorded on the run's audit timeline
        (`GET /runs/{runId}/events`). Self-attested today (no auth locally);
        blank/absent → actor `anonymous`. The cloud auth filter will later
        derive this from the verified OIDC subject / IAM role instead, which
        flips the recorded `actorSource` from `headerActor` to
        `oidcSubject` / `iamRole`.

  schemas:

    # ── WORKFLOWS ──────────────────────────────────────────────────────
    # WorkflowGraph is both the wire shape the builder posts and the CLOB the
    # database stores. Nodes are discriminated on `type`; unknown fields are
    # ignored on read, so React Flow's own per-node keys survive a round trip.
    WorkflowGraph:
      type: object
      required: [v, nodes, edges]
      properties:
        v:
          type: integer
          enum: [1]
          description: Wire version. Anything else is rejected.
        nodes:
          type: array
          maxItems: 64
          description: "At most 64 tasks, of which at most 16 may be load tests — the caps that keep the capacity analysis exact and cheap."
          items: { $ref: "#/components/schemas/WorkflowNode" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/WorkflowEdge" }

    WorkflowEdge:
      type: object
      required: [id, source, target]
      properties:
        id:     { type: string }
        source: { type: string, description: "Node id the edge leaves." }
        target: { type: string, description: "Node id the edge enters." }
        condition:
          type: string
          enum: [ON_SUCCESS, ON_FAILURE, ALWAYS]
          default: ON_SUCCESS
          description: |
            When the target may run. `ALWAYS` means the source succeeded **or**
            failed — a source that was skipped or cancelled never ran, so it
            satisfies nothing. Drawing an `ON_FAILURE` edge also declares the
            source's failure *handled*, which is what lets a
            test-then-mail-either-way workflow finish SUCCEEDED.

    WorkflowNode:
      type: object
      required: [type, id, name, position]
      discriminator:
        propertyName: type
      properties:
        type:
          type: string
          enum: [HEALTH_CHECK, LOAD_TEST, EMAIL, DELAY, APPROVAL]
        id:       { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" }
        name:     { type: string, maxLength: 255 }
        position:
          type: object
          description: Canvas coordinates, round-tripped so a reopened builder looks unchanged.
          properties:
            x: { type: number }
            y: { type: number }
        joinPolicy:
          type: string
          enum: [ALL, ANY]
          default: ALL
          description: "With several inbound edges: `ALL` needs every one satisfied, `ANY` needs one."
        # ── HEALTH_CHECK ──
        application:
          type: string
          description: "HEALTH_CHECK / LOAD_TEST — the application, which must belong to the workflow's group."
        requirement:
          type: string
          enum: [ALL, ANY, AT_LEAST]
          default: ALL
          description: "HEALTH_CHECK — how many endpoints must return 2xx."
        minHealthy:  { type: integer, minimum: 1, description: "HEALTH_CHECK — required when `requirement` is AT_LEAST; clamped to the endpoint count." }
        attempts:        { type: integer, minimum: 1, maximum: 10, default: 1, description: "HEALTH_CHECK — tries, spanning ticks." }
        intervalSeconds: { type: integer, minimum: 5, maximum: 300, default: 15, description: "HEALTH_CHECK — gap between tries." }
        timeoutSeconds:  { type: integer, minimum: 1, maximum: 30, default: 5, description: "HEALTH_CHECK — per-endpoint request timeout." }
        # ── LOAD_TEST ──
        templateBlobId: { type: string, description: "LOAD_TEST — the saved template supplying the plan, data files and plugins." }
        fleetAllocation:
          type: array
          description: |
            LOAD_TEST — required and authoritative: the node pins the fleet, the
            template supplies the plan. Capacity has to be answerable without
            fetching every template, and the operator has to see the number the
            workflow will actually reserve. The template's own allocation is
            reused verbatim only when the counts match and `properties` is
            empty; otherwise the per-worker property snapshots are rebuilt from
            the template's `globalProperties`, because that is where a run's
            `-J` values live.
          items:
            type: object
            required: [region, count]
            properties:
              region: { type: string }
              count:  { type: integer, minimum: 1, maximum: 1000 }
        properties:
          type: object
          additionalProperties: { type: string, maxLength: 256 }
          description: "LOAD_TEST — `-J` overrides layered over the template's globals. Keys match `[A-Za-z_][A-Za-z0-9_.]{0,63}`."
        saveResults: { type: boolean, description: "LOAD_TEST — overrides the template's setting when present." }
        successWhen:
          type: string
          enum: [COMPLETED_ONLY, ANY_TERMINAL]
          default: COMPLETED_ONLY
          description: "LOAD_TEST — `ANY_TERMINAL` passes the task however the run ended."
        maxDurationMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          default: 120
          description: "LOAD_TEST — watchdog; the run is aborted and the task fails when it overruns."
        # ── EMAIL ──
        to:
          type: array
          items: { type: string }
          description: "EMAIL — empty inherits the group's `notifyTo`; `cc` and `bcc` inherit theirs the same way."
        cc:      { type: array, items: { type: string } }
        bcc:     { type: array, items: { type: string } }
        subject:
          type: string
          maxLength: 255
          description: |
            EMAIL — `${…}` placeholders resolved against the execution:
            `${workflow.name}`, `${applications}`, `${group.team}`,
            `${task.<id>.state}`, `${task.<id>.runId}`, `${execution.outcome}`.
            Use `${execution.outcome}` in a result email, not
            `${execution.state}` — a final report is sent while the execution is
            still RUNNING by definition, so the state is never the verdict.
        body:    { type: string, maxLength: 20000, description: "EMAIL — as `subject`. An unknown placeholder renders empty rather than failing the send." }
        includeSummary: { type: boolean, description: "EMAIL — append a table of every task's state, timing and result." }
        # ── DELAY ──
        seconds: { type: integer, minimum: 1, maximum: 86400, description: "DELAY — how long to wait." }
        # ── APPROVAL ──
        instructions: { type: string, maxLength: 4000, description: "APPROVAL — what the approver is being asked." }
        deadlineMinutes:
          type: integer
          minimum: 1
          maximum: 10080
          description: "APPROVAL — fail the task if nobody answers in time; absent waits indefinitely."

    Workflow:
      type: object
      required: [workflowId, groupId, name, graph, enabled, revision, createdAt, updatedAt]
      properties:
        workflowId:  { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
        groupId:     { type: string }
        name:        { type: string, description: "Unique within the group." }
        description: { type: string, nullable: true }
        graph:       { $ref: "#/components/schemas/WorkflowGraph" }
        enabled:     { type: boolean, description: "A disabled workflow cannot be launched." }
        revision:
          type: integer
          description: "Optimistic lock. Send the value you loaded on PUT; a stale one is 409."
        createdBy:   { type: string, nullable: true }
        createdAt:   { type: string, format: date-time }
        updatedBy:   { type: string, nullable: true }
        updatedAt:   { type: string, format: date-time }
        lastExecution:
          nullable: true
          description: Hydrated on list reads only.
          allOf: [{ $ref: "#/components/schemas/WorkflowExecutionSummary" }]

    WorkflowExecutionSummary:
      type: object
      properties:
        executionId: { type: string }
        state:       { type: string, enum: [RUNNING, SUCCEEDED, FAILED, CANCELLED] }
        startedAt:   { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    WorkflowExecution:
      type: object
      required: [executionId, workflowId, groupId, workflowName, graph, state, triggeredBy, startedAt]
      properties:
        executionId:  { type: string }
        workflowId:   { type: string }
        groupId:      { type: string }
        workflowName: { type: string, description: "Snapshot: a rename never rewrites history." }
        graph:        { $ref: "#/components/schemas/WorkflowGraph" }
        state:        { type: string, enum: [RUNNING, SUCCEEDED, FAILED, CANCELLED] }
        stateReason:  { type: string, nullable: true }
        triggeredBy:  { type: string }
        startedAt:    { type: string, format: date-time }
        completedAt:  { type: string, format: date-time, nullable: true }
        nextTickAt:
          type: string
          format: date-time
          nullable: true
          description: "When the engine will next advance it; non-null exactly while RUNNING."
        hiddenAt:
          type: string
          format: date-time
          nullable: true
          description: "Archived when set — off the default history, still readable by id, and the only rows a delete accepts."
        tasks:
          type: array
          items: { $ref: "#/components/schemas/WorkflowTask" }

    WorkflowTask:
      type: object
      required: [taskId, executionId, nodeId, type, name, state, attempt]
      properties:
        taskId:      { type: string }
        executionId: { type: string }
        nodeId:      { type: string, description: "The graph node this row instantiates." }
        type:        { type: string, enum: [HEALTH_CHECK, LOAD_TEST, EMAIL, DELAY, APPROVAL] }
        name:        { type: string }
        state:
          type: string
          enum: [PENDING, RUNNING, AWAITING_APPROVAL, SUCCEEDED, FAILED, SKIPPED, CANCELLED]
          description: "`SKIPPED` means its join can no longer be satisfied — an upstream branch went the other way."
        attempt:         { type: integer }
        applicationName: { type: string, nullable: true }
        runId:
          type: string
          nullable: true
          description: "LOAD_TEST only. A task launches at most one run, enforced by a unique index."
        startedAt:   { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        dueAt:
          type: string
          format: date-time
          nullable: true
          description: "When this task next wants attention — a delay's due time, an approval's deadline, a health check's next attempt, a load test's watchdog."
        result:      { type: object, nullable: true, description: "Per-type detail the UI renders." }
        errorReason: { type: string, nullable: true }

    ExecutionIdsRequest:
      type: object
      required: [executionIds]
      properties:
        executionIds:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string }

    WorkflowGroupSummary:
      type: object
      properties:
        groupId:       { type: string }
        name:          { type: string }
        description:   { type: string, nullable: true }
        teamName:      { type: string, nullable: true }
        workflowCount: { type: integer }
        notifyTo:      { type: array, items: { type: string } }
        notifyCc:      { type: array, items: { type: string } }
        notifyBcc:     { type: array, items: { type: string } }

    SaveWorkflowRequest:
      type: object
      required: [name, graph]
      properties:
        groupId:     { type: string, description: "Required on create; ignored on update — a workflow never changes group." }
        name:        { type: string, maxLength: 255 }
        description: { type: string, nullable: true }
        graph:       { $ref: "#/components/schemas/WorkflowGraph" }
        enabled:     { type: boolean, default: true }
        revision:    { type: integer, description: "Required on PUT: the revision the editor loaded." }

    WorkflowValidation:
      type: object
      properties:
        valid:    { type: boolean }
        errors:   { type: array, items: { type: string }, description: "Block a save." }
        warnings:
          type: array
          items: { type: string }
          description: |
            Never block a save. Two kinds land here: capacity the group has not
            reserved, and a chain of "on success" links whose failure would
            silence a downstream email — the most expensive workflow mistake,
            because it is invisible until the day something fails.
        capacity:
          type: array
          items:
            type: object
            properties:
              region:      { type: string }
              peakWorkers: { type: integer, description: "The most this graph can want at once in this cluster." }
              tasks:       { type: array, items: { type: string }, description: "The tasks that make up that peak." }
              reserved:    { type: integer, description: "The group's reservation in this cluster." }
              fits:        { type: boolean }

    WorkflowInvalidError:
      type: object
      properties:
        code:    { type: string, enum: [WORKFLOW_INVALID] }
        message: { type: string }
        validation: { $ref: "#/components/schemas/WorkflowValidation" }

    WorkflowCapacityError:
      type: object
      properties:
        code:    { type: string, enum: [WORKFLOW_CAPACITY_EXCEEDED, WORKFLOW_ALREADY_RUNNING, WORKFLOW_DISABLED] }
        message: { type: string }
        clusters:
          type: array
          items:
            type: object
            properties:
              region:      { type: string }
              peakWorkers: { type: integer }
              tasks:       { type: array, items: { type: string } }
              reserved:    { type: integer }
              fits:        { type: boolean }

    # ── AUTOMATION — CRON schedules ────────────────────────────────────
    # CronJobSummary mirrors CronJobSummary in jmeter-cloud-ui/src/api/automation.ts
    # verbatim — keep the field names aligned (the UI stub's one-line swap).
    CronJobSummary:
      type: object
      required: [cronJobId, name, cronExpression, timeZone, enabled, createdAt, kind]
      properties:
        cronJobId:       { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
        name:            { type: string, description: "Operator label; unique per application (or globally for report kinds)." }
        applicationName: { type: string, nullable: true, description: "Null for platform-wide report kinds (INFRA_READINESS / DAILY_REPORT)." }
        templateBlobId:
          type: string
          nullable: true
          description: "document-service blob (X-Type=template). Required for LAUNCH_RUN; null for DRAIN_REGION / PROVISION_REGION."
        cronExpression:  { type: string, description: "5-field unix, 6-field (with seconds), or @macro." }
        timeZone:        { type: string, description: "IANA zone id; nextFireAt is computed in it.", default: UTC }
        enabled:         { type: boolean }
        createdBy:       { type: string, nullable: true, description: "X-Actor at create time." }
        createdAt:       { type: string, format: date-time }
        lastFiredAt:     { type: string, format: date-time, nullable: true }
        lastFiredRunId:  { type: string, nullable: true }
        lastFireStatus:
          type: string
          nullable: true
          enum: [LAUNCHED, SKIPPED, FAILED, DISABLED]
        nextFireAt:      { type: string, format: date-time, nullable: true, description: "Null when disabled." }
        kind:
          type: string
          description: |
            AUTOMATION Phase C/E/D — dispatch:
              LAUNCH_RUN       fire a saved template via RunService.startRun;
              DRAIN_REGION     drain every IDLE worker of the app's group in the region without
                               replacement (skipped if the group is alwaysOn);
              PROVISION_REGION spin workers into the app's group's pool in the region up to groupCapacity.maxAvailable;
              INFRA_READINESS  platform-wide: email the daily infra-readiness report (goal #2);
              DAILY_REPORT     platform-wide: email the daily perf-test report (goal #1).
          enum: [LAUNCH_RUN, DRAIN_REGION, PROVISION_REGION, INFRA_READINESS, DAILY_REPORT]
        region:
          type: string
          nullable: true
          description: "Required for DRAIN_REGION / PROVISION_REGION; null otherwise."
        recipients:
          type: string
          nullable: true
          description: "Comma-separated report-email recipients (report kinds). Blank → AUTOMATION_REPORT_RECIPIENTS env fallback."
        customSubject:
          type: string
          nullable: true
          description: "AUTOMATION: optional custom email subject for report kinds; null → composer default."
        customIntro:
          type: string
          nullable: true
          description: "AUTOMATION: optional intro/note rendered above the report body for report kinds."

    CronJobListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CronJobSummary" }

    CronJobRequest:
      type: object
      required: [name, applicationName, cronExpression]
      properties:
        name:            { type: string, description: "≤ 128 chars, non-blank." }
        applicationName: { type: string, description: "Must be a registered application." }
        templateBlobId:
          type: string
          nullable: true
          description: "Required for kind=LAUNCH_RUN; must be fetchable from document-service and its application must match."
        cronExpression:  { type: string, description: "5-field unix, 6-field, or @macro. Validated server-side." }
        timeZone:        { type: string, nullable: true, description: "IANA zone id; defaults to UTC.", default: UTC }
        kind:
          type: string
          nullable: true
          description: "AUTOMATION Phase C/E/D — null defaults to LAUNCH_RUN. INFRA_READINESS and DAILY_REPORT are platform-wide reports (no application/template/region; just a cron + recipients)."
          enum: [LAUNCH_RUN, DRAIN_REGION, PROVISION_REGION, INFRA_READINESS, DAILY_REPORT]
        region:
          type: string
          nullable: true
          description: "Required for kind=DRAIN_REGION / PROVISION_REGION; must be a configured groupCapacity row of the application's group (else 400 REGION_NOT_CONFIGURED)."
        recipients:
          type: string
          nullable: true
          description: "Comma-separated emails for report kinds (INFRA_READINESS / DAILY_REPORT); blank uses the AUTOMATION_REPORT_RECIPIENTS env fallback."
        customSubject:
          type: string
          nullable: true
          description: "AUTOMATION — optional custom email subject for report kinds; blank → composer default."
        customIntro:
          type: string
          nullable: true
          description: "AUTOMATION — optional intro/note rendered above the report body for report kinds."

    CronJobFire:
      type: object
      required: [fireId, cronJobId, firedAt, outcome]
      properties:
        fireId:      { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
        cronJobId:   { type: string }
        firedAt:     { type: string, format: date-time }
        outcome:
          type: string
          enum: [LAUNCHED, SKIPPED, FAILED, DISABLED]
        runId:       { type: string, nullable: true, description: "Set for LAUNCHED." }
        errorReason: { type: string, nullable: true, description: "Diagnostic for SKIPPED / FAILED." }

    CronJobFireResult:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [LAUNCHED, SKIPPED, FAILED, DISABLED]
        runId: { type: string, nullable: true }
        error: { type: string, nullable: true }

    GroupCapacityEntry:
      type: object
      required: [region, maxAvailable]
      properties:
        region:        { type: string, description: "DNS-friendly region key (e.g. na-east, na-west)." }
        maxAvailable:  { type: integer, minimum: 0, maximum: 1000, description: "Operator-set ceiling for this (group, region) — every application in the group draws on it." }

    # Full row returned by PUT /capacity/{region} (carries timestamps).
    GroupCapacityRow:
      type: object
      required: [groupId, region, maxAvailable]
      properties:
        groupId:       { type: string }
        region:        { type: string }
        maxAvailable:  { type: integer, minimum: 0, maximum: 1000 }
        createdAt:     { type: string, format: date-time, nullable: true }
        updatedAt:     { type: string, format: date-time, nullable: true }

    ApplicationGroup:
      type: object
      required: [groupId, name, createdAt]
      properties:
        groupId:          { type: string, pattern: "^[a-z][a-z0-9_]{0,29}$", description: "What the group's workers send as `?groupId=`; upper-cased it prefixes the group's tables in the metrics schema (`cps` → `CPS_METRICS`, `CPS_METRICS_H`) and it equals `GROUP_REGISTRY.GROUP_ID` there." }
        name:             { type: string, description: "Display name, unique (e.g. `Servicing MQ`)." }
        description:      { type: string, nullable: true }
        grafanaLiveUrl:   { type: string, nullable: true, maxLength: 2000, description: "The group's live Grafana dashboard (reads `<P>_METRICS`) — the UI's \"Open in Grafana\" default for every application in the group. Absolute http(s) URL; the UI appends `from/to/refresh/var-application`." }
        grafanaHistoryUrl: { type: string, nullable: true, maxLength: 2000, description: "The history dashboard (reads `<P>_METRICS_H`); optional — a run older than `hotDays` opens it, otherwise the live URL." }
        hotDays:          { type: integer, minimum: 1, maximum: 3650, default: 7, description: "Days the live dashboard covers (the group's hot retention)." }
        recyclePolicy:
          type: string
          description: "The pool's recycle policy (the group's workers, whichever application ran on them). Default REUSE."
          enum: [REUSE, MAX_RUNS, MAX_AGE, BOTH, EVERY_RUN, DRAIN_AFTER_RUN]
        maxRunsPerPod:  { type: integer, nullable: true, minimum: 1, maximum: 10000, description: "Required for MAX_RUNS / BOTH; null otherwise." }
        podMaxAgeHours: { type: integer, nullable: true, minimum: 1, maximum: 720, description: "Required for MAX_AGE / BOTH; null otherwise." }
        alwaysOn:       { type: boolean, default: false, description: "When true, scheduled DRAIN_REGION jobs SKIP this group's workers (production-like, never auto-drained)." }
        createdAt:        { type: string, format: date-time }
        applicationCount: { type: integer, nullable: true, description: "VISIBLE (non-archived) applications in the group — matches the Applications list. Archived rows still block group deletion. Present on every response from this controller." }
        capacity:
          type: array
          nullable: true
          description: "The group's worker budget per region (GROUP-CAPACITY) — seeded at 0 per deployment region on create, edited through the capacity endpoints. Present on every response from this controller."
          items: { $ref: "#/components/schemas/GroupCapacityEntry" }

    CreateApplicationGroupRequest:
      type: object
      required: [groupId, name]
      properties:
        groupId:     { type: string, description: "`[a-z][a-z0-9_]{0,29}` — an identifier stem (its upper-case form names the tables); immutable once created." }
        name:        { type: string, description: "≤ 255 chars" }
        description: { type: string, nullable: true, description: "≤ 512 chars" }
        grafanaLiveUrl:    { type: string, nullable: true, description: "Absolute http(s) URL ≤ 2000 chars; 400 otherwise. Blank = none." }
        grafanaHistoryUrl: { type: string, nullable: true, description: "Same rule; optional." }
        hotDays:           { type: integer, nullable: true, description: "1..3650; null = 7." }
        recyclePolicy:     { type: string, nullable: true, enum: [REUSE, MAX_RUNS, MAX_AGE, BOTH, EVERY_RUN, DRAIN_AFTER_RUN], description: "Null defaults to REUSE. The thresholds must match the policy (400 otherwise)." }
        maxRunsPerPod:     { type: integer, nullable: true, minimum: 1, maximum: 10000 }
        podMaxAgeHours:    { type: integer, nullable: true, minimum: 1, maximum: 720 }
        alwaysOn:          { type: boolean, nullable: true, description: "Defaults to false on create." }

    UpdateApplicationGroupRequest:
      type: object
      required: [name]
      properties:
        name:        { type: string }
        description: { type: string, nullable: true }
        grafanaLiveUrl:    { type: string, nullable: true, description: "Replaced wholesale; blank/null clears." }
        grafanaHistoryUrl: { type: string, nullable: true, description: "Replaced wholesale; blank/null clears." }
        hotDays:           { type: integer, nullable: true, description: "Replaced wholesale; null = 7." }
        recyclePolicy:     { type: string, nullable: true, enum: [REUSE, MAX_RUNS, MAX_AGE, BOTH, EVERY_RUN, DRAIN_AFTER_RUN], description: "Replaced wholesale; null = REUSE with no thresholds." }
        maxRunsPerPod:     { type: integer, nullable: true, minimum: 1, maximum: 10000 }
        podMaxAgeHours:    { type: integer, nullable: true, minimum: 1, maximum: 720 }
        alwaysOn:          { type: boolean, nullable: true, description: "Null on PUT preserves the current value (no surprise flips for callers that don't know about it)." }

    Application:
      type: object
      required: [applicationId, name, healthEndpoints, createdAt, metricsGroupId]
      properties:
        applicationId:        { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
        name:                 { type: string, description: "DNS-friendly registered name. Drives URLs + cross-table joins on `run.application`." }
        sealId:               { type: string, nullable: true, description: "Operator-supplied identifier (e.g. internal catalog ID)." }
        description:          { type: string, nullable: true }
        metricsGroupId:       { type: string, description: "The application group the app belongs to — required. Its workers POST metrics with `?groupId=` set to this, and the group's worker pool (capacity, pods, recycle policy) is what the app's runs draw on." }
        metricsApplication:   { type: string, nullable: true, description: "The group classifier's value for this app's labels (`LABEL.APPLICATION`, e.g. `CPS-PCI`); defaults to the upper-cased name when grouped." }
        healthEndpoints:
          type: array
          description: "Health-check URLs polled every minute by ApplicationHealthPoller. Empty → polling disabled, status stays UNKNOWN."
          items: { type: string }
        createdAt:            { type: string, format: date-time }
        lastHealthCheckedAt:  { type: string, format: date-time, nullable: true }
        lastHealthStatus:
          type: string
          nullable: true
          enum: [HEALTHY, DEGRADED, UNHEALTHY, UNKNOWN]
        lastHealthDetails:
          type: array
          nullable: true
          description: "Per-endpoint poll snapshot — array of {url, statusCode, latencyMs, error?, ok}."
          items:
            type: object
            properties:
              url:        { type: string }
              statusCode: { type: integer, nullable: true }
              latencyMs:  { type: integer }
              error:      { type: string, nullable: true }
              ok:         { type: boolean }

    CreateApplicationRequest:
      type: object
      required: [name, metricsGroupId]
      description: "Capacity and the recycle policy are the group's — unknown fields such as `capacity` or `recyclePolicy` are ignored here."
      properties:
        name:            { type: string, description: "DNS-friendly: [a-z0-9]([-a-z0-9_]{0,62}[a-z0-9])?" }
        sealId:          { type: string, nullable: true, description: "≤ 128 chars" }
        description:     { type: string, nullable: true, description: "≤ 512 chars" }
        metricsGroupId:  { type: string, description: "An existing application group's id — required; 400 `INVALID_REQUEST` when blank or unknown." }
        metricsApplication: { type: string, nullable: true, description: "[A-Za-z0-9][A-Za-z0-9._-]{0,63}; null = upper-cased name." }
        healthEndpoints:
          type: array
          description: "Optional. Max 8 entries; each must be a valid http(s) URI ≤ 256 chars."
          items: { type: string }

    UpdateApplicationRequest:
      type: object
      required: [name, metricsGroupId]
      properties:
        name:            { type: string }
        sealId:          { type: string, nullable: true }
        description:     { type: string, nullable: true }
        metricsGroupId:  { type: string, description: "Replaced wholesale — required; an application always belongs to a group (400 when blank or unknown)." }
        metricsApplication: { type: string, nullable: true, description: "Replaced wholesale — null = upper-cased name." }
        healthEndpoints:
          type: array
          items: { type: string }

    StartRunRequest:
      type: object
      required: [testPlanBlobId]
      properties:
        testPlanBlobId:
          type: string
          description: document-service blob ID for the .jmx test plan to fan out.
          example: "01HXC2VQK4M9N6P5T0YBX2WZ4Q"
        dataFilesBlobId:
          type: string
          nullable: true
          description: Optional document-service blob ID for the data-files zip.
        application:
          type: string
          nullable: true
          description: |
            UI-D3 — application name this run is launched against; mirrors
            the testPlan blob's `X-Application` tag. Persisted on the run
            record so the `/applications/:appName` surface can filter
            `?application=<name>` without joining through document-service.
            Optional for API callers; the launcher form's application gate
            ensures it's always set when submitted from the UI.
          example: "checkout-svc"
        fleetAllocation:
          type: array
          description: |
            Track F multi-region allocation. One `(region, count)` entry
            per region the run should span. Required unless the legacy
            `fleetSize` + single-element `regions` shortcut is used.
            If both `fleetAllocation` and `fleetSize` are set,
            `fleetAllocation` wins and the run's `stateReason` records
            `ignored legacy fleetSize`.
          items: { $ref: "#/components/schemas/FleetAllocationEntry" }
        fleetSize:
          type: integer
          minimum: 1
          description: |
            **Legacy.** Total pods to claim across regions. Used when
            `fleetAllocation` is absent. When paired with a
            single-element `regions`, equivalent to
            `fleetAllocation:[{region:regions[0], count:fleetSize}]`.
            With an empty `regions`, claims freshest-heartbeat pods
            regardless of region (Step 14 behavior).
        regions:
          type: array
          description: |
            **Legacy.** Used only when `fleetAllocation` is absent. With
            a single entry, acts as the region filter for `fleetSize`.
            Multi-element `regions` is ignored — supply `fleetAllocation`
            instead.
          items: { type: string }
        pluginIds:
          type: array
          description: |
            Global-library plugin ids to stage onto every worker
            (`GET /api/v1/plugins`). Unknown ids reject the launch 400; the
            resolved set is snapshotted onto the run, so a later registry
            delete never affects this run or its scale-up joiners.
          items: { type: string }
        refreshDataFiles:
          type: boolean
          default: false
          description: |
            When true, every worker re-downloads `dataFilesBlobId` even if it
            already holds an intact staged copy of the same blob. One-shot
            launch flag — not persisted on the run, never applied to scale-up
            joiners (their reuse of the fleet's bundle is the point). Default
            false: unchanged data files are reused for a faster start.
        initiatedBy:
          type: string
          description: Free-form initiator identity (UI user, CI job, etc.). Auth model TBD.
        spinShortfall:
          type: boolean
          nullable: true
          default: false
          description: |
            When true, a shortfall during the
            claim phase triggers an on-the-fly spin to fill the gap
            rather than a 503 INSUFFICIENT_CAPACITY. Subject to the
            per-region `groupCapacity.maxAvailable` ceiling of the app's group: if
            filling the gap would exceed it, the response is 409
            `APPLICATION_CAPACITY_EXCEEDED` with the offending region.
            The UI's NewRunPage sets this only after the operator
            confirms a shortfall dialog rendered from the 503 body.
        saveResults:
          type: boolean
          nullable: true
          default: false
          description: |
            Save Results — when true, each worker zips + uploads its JTL to the
            Document Service on a clean COMPLETE (tagged with this run's
            application + runId + workerId). Threads to the local-orchestrator
            fan-out body as `autoUploadResults=true` and is persisted on the run
            record (`Run.saveResults`) so the run-detail page shows a
            "Download results" link (document-service
            `GET /api/v1/blob/run/{runId}/archive`). One `RESULTS_SAVED` audit
            event is emitted per worker as each upload lands. Default false.

    FleetAllocationEntry:
      type: object
      required: [region, count]
      properties:
        region:
          type: string
          description: |
            Region label. Must match a region that has had at least one
            pod registered — otherwise the request returns 400
            `UNKNOWN_REGION`.
          example: "us-east-1"
        count:
          type: integer
          minimum: 1
          description: Number of IDLE pods to claim in this region.
        perNodeProperties:
          type: array
          nullable: true
          description: |
            Track G (Step 31) — per-pod JMeter `-J` properties, indexed
            positionally. The i-th entry applies to the i-th claimed
            pod in this region; missing or null entries mean "no extra
            properties for that pod." Length may be less than `count`
            (trailing pods get no extras). Re-used by MID-TEST-SCALING
            Phase A's `scaleUp` endpoint.
          items:
            type: object
            additionalProperties: { type: string }

    Run:
      type: object
      required: [runId, originRegion, testPlanBlobId, initiatedBy, state, createdAt]
      properties:
        runId:           { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
        originRegion:    { type: string }
        testPlanBlobId:  { type: string }
        dataFilesBlobId: { type: string, nullable: true }
        application:     { type: string, nullable: true, description: "UI-D3 — application this run was launched against. NULL for legacy rows." }
        initiatedBy:     { type: string }
        state:           { $ref: "#/components/schemas/RunStateEnum" }
        stateReason:     { type: string, nullable: true }
        createdAt:       { type: string, format: date-time }
        startedAt:       { type: string, format: date-time, nullable: true }
        completedAt:     { type: string, format: date-time, nullable: true }
        saveResults:     { type: boolean, description: "Save Results — true if the run was launched with saveResults=true (each worker uploads its JTL to the Document Service on completion). Drives the run-detail \"Download results\" link (shown only for COMPLETED runs). Cleared to false when a run ends in any non-COMPLETED terminal state (ABORTED, or FAILED — e.g. all fan-outs rejected, or every worker lost/failed): those produce no clean combined upload, so the platform stops polling the dead workers and the UI must not offer a Download that 404s. Only a clean COMPLETED keeps it true. Note a worker that itself FAILED (non-zero exit / killed) never uploads regardless — the combined archive only ever contains the cleanly-COMPLETED workers." }
        fleetMembers:
          type: array
          items: { $ref: "#/components/schemas/RunFleetMember" }
        plugins:
          type: array
          description: The launch-time plugin snapshot — what every worker of this run stages, immune to later registry deletes.
          items: { $ref: "#/components/schemas/PluginRef" }

    RunFleetMember:
      type: object
      required: [runId, workerId, region, state, createdAt]
      properties:
        runId:            { type: string }
        workerId:         { type: string }
        region:           { type: string }
        state:            { $ref: "#/components/schemas/MemberStateEnum" }
        stateReason:      { type: string, nullable: true }
        fanoutStatusCode: { type: integer, nullable: true, description: "HTTP status returned by the POST /api/v1/test fan-out call." }
        podBaseUrl:       { type: string, nullable: true }
        createdAt:        { type: string, format: date-time }
        startedAt:        { type: string, format: date-time, nullable: true }
        completedAt:      { type: string, format: date-time, nullable: true }
        properties:
          type: object
          additionalProperties: { type: string }
          description: "Track G (Step 31) — per-node JMeter -J properties this pod was launched with. Empty object for nodes without extras."
        joinedAtSecond:
          type: integer
          format: int64
          nullable: true
          description: |
            NULL for original-fleet members
            (joined at run start). For mid-test scale-up joiners, the
            number of seconds since `run.startedAt` at which this
            worker joined. UI renders as a "joined +Xm" chip.
        runsServed:
          type: integer
          format: int64
          nullable: true
          description: |
            Joined from `pod.runsServed` at
            read time. Null when the pod row is gone (drained pod
            whose member row outlived it). UI uses this to flag a
            worker whose pod is near its recycle threshold.

    Plugin:
      type: object
      required: [pluginId, name, version, blobId, sha256, sizeBytes, fileName, createdBy, createdAt]
      properties:
        pluginId:   { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
        name:       { type: string, description: "Unique — one version per plugin; upgrade = delete + re-register." }
        version:    { type: string }
        blobId:     { type: string, description: "The document-service blob holding the .jar (single plugin) or .zip bundle." }
        sha256:     { type: string, description: "Server-computed at upload; unique — identical bytes cannot be registered twice." }
        sizeBytes:  { type: integer, format: int64 }
        fileName:   { type: string }
        description: { type: string, nullable: true }
        createdBy:  { type: string }
        createdAt:  { type: string, format: date-time }

    PluginRef:
      type: object
      required: [pluginId, name, version, blobId, fileName]
      description: A run's launch-time reference to one plugin — a snapshot, deliberately not a foreign key.
      properties:
        pluginId: { type: string }
        name:     { type: string }
        version:  { type: string }
        blobId:   { type: string }
        fileName: { type: string }

    RegisterPluginRequest:
      type: object
      required: [name, version, blobId]
      properties:
        name:        { type: string, description: "1–128 chars of [A-Za-z0-9 ._-], starting alphanumeric." }
        version:     { type: string, description: "1–64 chars, informational — uniqueness is by name and by content." }
        blobId:      { type: string, description: "A blob already uploaded with X-Type: plugin." }
        description: { type: string, nullable: true }

    PluginConflictResponse:
      type: object
      required: [code, message, existing, orphanBlobDeleted]
      properties:
        code:    { type: string, enum: [PLUGIN_NAME_TAKEN, PLUGIN_CONTENT_DUPLICATE] }
        message: { type: string }
        existing:
          type: object
          properties:
            pluginId: { type: string }
            name:     { type: string }
            version:  { type: string }
        orphanBlobDeleted:
          type: boolean
          description: True when the hub deleted the caller's now-orphan upload (never a blob a registry row references).

    ScaleUpRunRequest:
      type: object
      required: [allocations]
      description: |
        Body of `POST /api/v1/runs/{runId}/scaleUp`. Only the per-region
        allocation; the run's testPlan + dataFiles blob IDs come from
        the persisted run row.
      properties:
        allocations:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/FleetAllocationEntry" }

    ScaleUpRunResponse:
      type: object
      required: [run, requested, granted, partial]
      description: |
        Response of `POST /api/v1/runs/{runId}/scaleUp`. `run` is the
        post-scale snapshot (original + newly added members). `granted`
        is the actual number of new members opened; `partial` is true
        iff `granted < requested` (only possible with `bestEffort=true`).
      properties:
        run:         { $ref: "#/components/schemas/Run" }
        requested:   { type: integer, description: "Total workers requested across all allocation entries." }
        granted:     { type: integer, description: "Number of workers actually claimed and inserted." }
        partial:     { type: boolean, description: "True iff granted < requested (only with bestEffort=true)." }
        stateReason: { type: string, nullable: true, description: "Best-effort shortfall note, if any. Same shape as run.stateReason." }

    AbortRunRequest:
      type: object
      description: |
        Body of `POST /api/v1/runs/{runId}/abort`. Optional — an operator may
        abort with no body at all.
      properties:
        reason:
          type: string
          description: |
            Free-text note recorded on the `ABORT` audit event and the run's
            `stateReason`. PII-free by convention (the audit timeline is
            shared — don't put secrets here).

    DeleteRunRequest:
      type: object
      description: |
        Body of `DELETE /api/v1/runs/{runId}`. Optional — an operator may hide a
        run with no body at all.
      properties:
        reason:
          type: string
          description: |
            Free-text note recorded on the `DELETE` audit event. PII-free by
            convention (the audit timeline is shared — don't put secrets here).

    DeleteApplicationRequest:
      type: object
      description: |
        Body of `POST /api/v1/applications/{id}/purge`. Optional — an operator
        may purge with no body at all.
      properties:
        reason:
          type: string
          description: |
            Free-text note recorded on the `purgeAudit` tombstone. PII-free by
            convention.

    PurgeApplicationResponse:
      type: object
      description: |
        Response of `POST /api/v1/applications/{id}/purge`. Summarises what the
        hard delete reclaimed across the app and its runs.
      properties:
        applicationId:
          type: string
        runsPurged:
          type: integer
          description: Number of the app's runs that were purged.
        metricRowsDeleted:
          type: integer
          format: int64
          description: 'Total fact rows removed from the group''s `<GROUP_ID>_METRICS` across all the app''s runs.'
        blobsDeleted:
          type: integer
          description: Total document-service blobs removed across all the app's runs.
        blobStepComplete:
          type: boolean
          description: |
            False when document-service was unreachable for at least one run and
            some result blobs were left for a future retention sweep.

    PurgeRunResponse:
      type: object
      description: |
        Response of `POST /api/v1/runs/{runId}/purge`. Summarises what the hard
        delete reclaimed.
      properties:
        runId:
          type: string
          description: The purged run's id.
        metricRowsDeleted:
          type: integer
          format: int64
          description: 'Fact rows removed from the group''s `<GROUP_ID>_METRICS`.'
        blobsDeleted:
          type: integer
          description: |
            document-service blobs removed (result blobs + any unshared
            testPlan/dataFiles blobs).
        blobStepComplete:
          type: boolean
          description: |
            False when document-service was unreachable and the blob cleanup was
            skipped — the DB purge still completed; orphaned result blobs remain
            for a future retention sweep.

    UpdateRunPropertiesRequest:
      type: object
      required: [properties]
      description: |
        Body of `POST /api/v1/runs/{runId}/properties`. Omit `workerIds` to
        target every ACCEPTED/RUNNING member; an id that is not an active
        member rejects the whole request 400. Property rules mirror the
        worker's: keys `[A-Za-z_][A-Za-z0-9_.]{0,63}`, values ≤ 256 chars,
        no control characters, at most 50 entries.
      properties:
        workerIds:
          type: array
          items: { type: string }
        properties:
          type: object
          additionalProperties: { type: string }

    UpdateRunPropertiesResponse:
      type: object
      description: One result row per targeted worker, plus the applied key set.
      properties:
        runId: { type: string }
        requested: { type: integer }
        results:
          type: array
          items:
            type: object
            properties:
              workerId: { type: string }
              ok: { type: boolean }
              statusCode: { type: integer }
              error: { type: string, nullable: true }
        applied:
          type: array
          items: { type: string }

    ScaleDownRunRequest:
      type: object
      description: |
        Body of `POST /api/v1/runs/{runId}/scaleDown`. Supply EXACTLY
        ONE of `workerIds` or `allocations`. MID-TEST-SCALING Phase B.
      properties:
        workerIds:
          type: array
          description: "Explicit list of pod ids to drain."
          items: { type: string }
        allocations:
          type: array
          description: |
            Per-region drain count. The service picks the N most-recently-
            created RUNNING members in each named region (youngest-first).
          items: { $ref: "#/components/schemas/FleetAllocationEntry" }

    ScaleDownRunResponse:
      type: object
      required: [run, drained, skipped]
      description: |
        Response of `POST /api/v1/runs/{runId}/scaleDown`. `run` is the
        post-scale snapshot (drained members appear in DRAINING / DRAINED).
        `drained` lists workerIds that were targeted and accepted by their
        local-orch. `skipped` lists targets that were already terminal,
        already DRAINING, or whose drain RPC failed — each with a
        one-line reason.
      properties:
        run: { $ref: "#/components/schemas/Run" }
        drained:
          type: array
          items: { type: string }
        skipped:
          type: array
          items:
            type: object
            required: [workerId, reason]
            properties:
              workerId: { type: string }
              reason:   { type: string }

    RunStatus:
      type: object
      required: [runId, state, members]
      properties:
        runId:       { type: string }
        state:       { $ref: "#/components/schemas/RunStateEnum" }
        stateReason: { type: string, nullable: true }
        startedAt:   { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        members:
          type: array
          items: { $ref: "#/components/schemas/RunFleetMember" }

    # AUDIT-TRAIL — one append-only event per state-changing operator action.
    RunEvent:
      type: object
      required: [eventId, runId, eventType, actor, actorSource, payload, result, occurredAt]
      properties:
        eventId:     { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$", description: "ULID. Idempotency key — a same-id retry is dropped." }
        runId:       { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
        eventType:
          type: string
          enum: [RUN_START, SCALE_UP, SCALE_DOWN, DRAIN_WORKER, ABORT, STOP, DELETE, PROPERTIES_UPDATED, DATA_FILES_REUSED, DATA_FILES_UPLOADED, TEST_PLAN_UPLOADED, PLUGINS_UPLOADED, ARTIFACTS_CLEARED, RUN_COMPLETED, RUN_FAILED, RUN_ABORTED, WORKERS_RECYCLED, RESULTS_SAVED]
          description: |
            What happened. DRAIN_WORKER is a single-explicit-workerId drain;
            multi-worker / region drains are SCALE_DOWN. ABORT is an
            operator-initiated force-terminate (`POST /runs/{id}/abort`) — the
            operator is the cause of the terminal transition, so a manual abort
            emits ABORT (not a system RUN_ABORTED). DELETE is an operator
            soft-delete (`DELETE /runs/{id}`) — the run is hidden, not erased,
            so the event is retained. RUN_COMPLETED / RUN_FAILED /
            RUN_ABORTED, WORKERS_RECYCLED, RESULTS_SAVED, ARTIFACTS_CLEARED and
            the fan-out provenance events (DATA_FILES_REUSED /
            DATA_FILES_UPLOADED per fan-out; TEST_PLAN_UPLOADED and
            PLUGINS_UPLOADED once, on the original launch) are
            platform-detected (actorSource=system), not operator actions.
        actor:       { type: string, description: "Who performed the action (X-Actor header; default `anonymous`)." }
        actorSource:
          type: string
          enum: [anonymous, headerActor, oidcSubject, iamRole, system]
          description: "How the actor identity was learned, so auditors can weigh trust. `system` = platform-initiated (automation / internal), not a human."
        payload:
          type: object
          additionalProperties: true
          description: |
            Per-event-type contract (no PII). Shapes:
            `RUN_START` → `{ application, fleetAllocation: [{region,count}], requested, granted }`;
            `SCALE_UP` → `{ allocations: [{region,count}], bestEffort, requested, granted, partial }`;
            `SCALE_DOWN` → `{ workerIds, allocations: [{region,count}], drained, skipped: [{target,reason}] }`;
            `DRAIN_WORKER` → `{ workerId, drained, skipped }`;
            `ABORT` → `{ reason, aborted: [workerId], skipped: [{target,reason}] }`;
            `DELETE` → `{ reason }`;
            `RUN_COMPLETED` / `RUN_FAILED` / `RUN_ABORTED` → `{ finalState, reason }`;
            `RESULTS_SAVED` → `{ workerId, target }`;
            `PROPERTIES_UPDATED` → `{ workerIds, properties, ok, failed }`;
            `DATA_FILES_REUSED` / `DATA_FILES_UPLOADED` → `{ dataFilesBlobId, refreshRequested, reused: [workerId], downloaded: [workerId] }`;
            `TEST_PLAN_UPLOADED` → `{ testPlanBlobId, workers: [workerId] }`;
            `PLUGINS_UPLOADED` → `{ plugins: ["name@version"], workers: [workerId] }`;
            `ARTIFACTS_CLEARED` → `{ workerId }`.
        result:
          type: string
          description: "`ok` / `partial` (best-effort partial grant or some drains skipped) / `failed` / `aborted` (run terminal outcome) / `rejected:CODE` (the action was refused; CODE is the same ErrorResponse.code the caller saw)."
        occurredAt:  { type: string, format: date-time }

    RunMetricsRollup:
      type: object
      required: [runId, state, byLabel]
      properties:
        runId: { type: string }
        state: { $ref: "#/components/schemas/RunStateEnum" }
        byLabel:
          type: array
          items:
            type: object
            properties:
              label:            { type: string }
              application:      { type: string, nullable: true, description: "The group classifier's value for the label (`LABEL.APPLICATION`)." }
              totalThroughput:  { type: integer, format: int64 }
              totalErrors:      { type: integer, format: int64 }
              errorRate:        { type: number, format: double, description: "totalErrors / samples (JMeter's success flag; a fraction, not a percentage)." }
              httpErrors:       { type: integer, format: int64, description: "HTTP 4xx + 5xx samples — the dashboard's \"Error %\" numerator." }
              httpErrorRate:    { type: number, format: double, description: "httpErrors / samples (a fraction)." }
              throughputRps:    { type: number, format: double, description: "Samples over the span the label's rows cover." }
              avgMs:            { type: number, format: double, description: "Throughput-weighted mean response time." }
              avgP50Ms:         { type: number, format: double }
              avgP90Ms:         { type: number, format: double }
              avgP95Ms:         { type: number, format: double }
              avgP99Ms:         { type: number, format: double }
              maxMs:            { type: number, format: double }
              maxActiveThreads: { type: integer, format: int64 }
              firstSecond:      { type: integer, format: int64 }
              lastSecond:       { type: integer, format: int64 }
              rowCount:         { type: integer, format: int64 }

    TimeseriesPoint:
      type: object
      required: [sec, v]
      description: One sample. `sec` is a Unix epoch second; `v` is the metric value.
      properties:
        sec: { type: integer, format: int64, description: "Unix epoch second" }
        v:   { type: number,  format: double, description: "Metric value (TPS / ms / percentage / count)" }

    MetricsSeries:
      type: object
      description: "The series the UI charts (the total, and each region / application split)."
      required: [tps, avgRtMs, errorPct, statusCodes]
      properties:
        tps:
          type: array
          description: "Samples per second in the bucket."
          items: { $ref: "#/components/schemas/TimeseriesPoint" }
        avgRtMs:
          type: array
          description: "Throughput-weighted mean response time."
          items: { $ref: "#/components/schemas/TimeseriesPoint" }
        errorPct:
          type: array
          description: "100 × (HTTP 4xx + 5xx) / samples per bucket."
          items: { $ref: "#/components/schemas/TimeseriesPoint" }
        p90Ms:
          type: array
          description: "Throughput-weighted mean of the per-worker p90s."
          items: { $ref: "#/components/schemas/TimeseriesPoint" }
        p95Ms:
          type: array
          description: "Throughput-weighted mean of the per-worker p95s."
          items: { $ref: "#/components/schemas/TimeseriesPoint" }
        p99Ms:
          type: array
          items: { $ref: "#/components/schemas/TimeseriesPoint" }
        statusCodes:
          type: object
          description: "Per-status-code timeseries. Keys are status code strings (HTTP code or JMeter's non-HTTP marker); values are TimeseriesPoint arrays."
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/TimeseriesPoint" }

    MetricsTimeseries:
      type: object
      required: [runId, bucketSize, series]
      properties:
        runId:      { type: string }
        bucketSize:
          type: integer
          enum: [15, 30, 60]
          description: "Seconds per point — the bucket width."
        fromSecond: { type: integer, format: int64, nullable: true, description: "First bucket start (epoch second); null when the series are empty." }
        toSecond:   { type: integer, format: int64, nullable: true, description: "Last bucket start; null when the series are empty." }
        series: { $ref: "#/components/schemas/MetricsSeries" }
        regions:
          type: object
          description: "Per-region split (`WORKER.REGION`), present only with `byRegion=true`; `series` is its exact fold."
          additionalProperties: { $ref: "#/components/schemas/MetricsSeries" }
        applications:
          type: object
          description: "Per-application split (`LABEL.APPLICATION`), present only with `byApplication=true`."
          additionalProperties: { $ref: "#/components/schemas/MetricsSeries" }
        labels:
          type: object
          description: "Per-label split (`LABEL.LABEL_KEY`), present only with `byLabel=true` — the `labelLimit` busiest labels by samples (10 by default), busiest first."
          additionalProperties: { $ref: "#/components/schemas/MetricsSeries" }
        labelsTotal:
          type: integer
          description: "With `byLabel=true`: how many labels matched `labelPrefix` before the cap."

    RunSummary:
      type: object
      required: [runId, total, byApplication]
      description: The run's headline numbers over one range — `GET /runs/{runId}/summary`.
      properties:
        runId:      { type: string }
        fromSecond: { type: integer, format: int64, nullable: true, description: "First window in the range (epoch second); null when empty." }
        toSecond:   { type: integer, format: int64, nullable: true, description: "Last window in the range; null when empty." }
        total:      { $ref: "#/components/schemas/RunSummaryStats" }
        byApplication:
          type: array
          description: One row per `LABEL.APPLICATION`, busiest first; `application` is set on these rows only.
          items: { $ref: "#/components/schemas/RunSummaryStats" }

    RunSummaryStats:
      type: object
      required: [samples, errors, tps, errorPct, avgMs, p90Ms, p95Ms, p99Ms, maxMs, maxActiveThreads]
      properties:
        application:      { type: string, description: "Only on the per-application rows." }
        samples:          { type: integer, format: int64 }
        errors:           { type: integer, format: int64, description: "HTTP 4xx + 5xx samples." }
        tps:              { type: number, format: double, description: "Samples over the span the rows cover (`MAX(WINDOW_SECOND) - MIN + 15`)." }
        errorPct:         { type: number, format: double, description: "100 × errors / samples (4xx + 5xx)." }
        avgMs:            { type: number, format: double, description: "Throughput-weighted mean response time." }
        p90Ms:            { type: number, format: double }
        p95Ms:            { type: number, format: double }
        p99Ms:            { type: number, format: double }
        maxMs:            { type: number, format: double }
        maxActiveThreads: { type: integer, format: int64, description: "Peak of any worker's active threads in a window." }

    MetricsTimeseriesBatch:
      type: object
      required: [runs, missing]
      description: |
        HM-5 — batched timeseries response for the comparison view.
        `runs` is keyed by runId (preserves the order from the `ids`
        query param so the UI can map the first id to its left column);
        `missing` lists ids that did not resolve to a known run.
      properties:
        runs:
          type: object
          description: "Per-run timeseries keyed by runId. Order matches the `ids` query parameter."
          additionalProperties: { $ref: "#/components/schemas/MetricsTimeseries" }
        missing:
          type: array
          description: "Run ids that did not resolve to a known run; the UI calls these out so the operator knows which side of the comparison is empty."
          items: { type: string }

    RunStateEnum:
      type: string
      enum: [PREPARING, STARTING, RUNNING, DRAINING, COMPLETED, FAILED, ABORTED]

    MemberStateEnum:
      type: string
      description: |
        Per-pod lifecycle within a fleet run. `DRAINING` (MID-TEST-SCALING
        Phase B) marks a worker the operator drained via
        `POST /runs/{runId}/scaleDown`; `DRAINED` is the successful
        terminal — distinct from `COMPLETED` (natural end) and `ABORTED`
        (forced stop). Drain-timeout escalations land `ABORTED` with
        reason `drainTimeoutExpired`.
      enum: [PENDING, REQUESTED, ACCEPTED, RUNNING, DRAINING, COMPLETED, FAILED, ABORTED, DRAINED]

    RegisterPodRequest:
      type: object
      required: [podId, baseUrl, groupId]
      properties:
        podId:
          type: string
          description: |
            Pod identity. Matches `WorkerMetricBatch.workerId` so the metrics
            join works. Typically the K8s pod name / Docker container
            hostname.
        region:
          type: string
          description: Region label (defaults to `us-east-1` when omitted).
        baseUrl:
          type: string
          description: Where the global-orchestrator can reach this pod's REST API.
        groupId:
          type: string
          description: |
            The application group whose pool this pod belongs to. Set by the
            local-orchestrator from its `GROUP_ID` env var, which the regional
            provisioner stamps when creating the worker. Required —
            `pod.groupId` is NOT NULL and an FK to `applicationGroup`; a
            registration without it returns 400 `INVALID_REQUEST`.

    HeartbeatRequest:
      type: object
      required: [podId]
      properties:
        podId: { type: string }

    Pod:
      type: object
      required: [podId, region, baseUrl, state, lastHeartbeat, registeredAt]
      properties:
        podId:         { type: string }
        region:        { type: string }
        baseUrl:       { type: string }
        state:         { type: string, enum: [IDLE, LOST] }
        lastHeartbeat: { type: string, format: date-time }
        registeredAt:  { type: string, format: date-time }
        groupId:
          type: string
          description: The application group whose pool this pod belongs to (GROUP-CAPACITY); any application in the group may claim it.
        source:
          type: string
          enum: [DYNAMIC, STATIC]
          description: |
            Who owns this worker's lifecycle. `DYNAMIC`: the
            control plane created it and may restart / recycle / destroy it;
            liveness comes from the worker's own heartbeat. `STATIC`: the
            operator deployed and declared it; the control plane only uses
            it, and `StaticPodProbe` maintains its liveness. Defaults to
            `DYNAMIC` for every row that predates the column.

    RegionCapacity:
      type: object
      required: [region, totalPods, idlePods, lostPods]
      properties:
        region:     { type: string, example: "us-east-1" }
        totalPods:  { type: integer, format: int64, description: "Every pod ever registered to this region (any state)." }
        idlePods:   { type: integer, format: int64, description: "IDLE pods not currently held by an active run — what POST /runs could claim now." }
        lostPods:   { type: integer, format: int64, description: "Pods marked LOST by the sweeper (heartbeat stale)." }

    # ── Phase 3 capacity-rework response schemas ──────────────────────────
    CapacitySnapshot:
      type: object
      required: [groupId, region, maxAvailable, provisioned, ready, inUse, spinnable, pods]
      properties:
        groupId:       { type: string }
        region:        { type: string }
        maxAvailable:  { type: integer, description: "Operator-set ceiling from groupCapacity.maxAvailable." }
        provisioned:   { type: integer, description: "ready + inUse — pods that exist as containers right now." }
        ready:         { type: integer, description: "Pods running + idle (not currently held by any run)." }
        inUse:         { type: integer, description: "Pods currently held by an active runFleetMember." }
        spinnable:     { type: integer, description: "maxAvailable - provisioned, clamped at 0. What POST /pods can create right now." }
        pods:
          type: array
          items: { $ref: "#/components/schemas/PodView" }
    PodView:
      type: object
      required: [podName, state, containerRunning, runsServed]
      properties:
        podName:          { type: string, example: "payments-us-east-worker-1" }
        state:            { type: string, enum: [READY, IN_USE, LOST, STARTING, UNKNOWN, RECYCLING],
                            description: "RECYCLING is reported when the pod row is in DRAINING_FOR_RECYCLE state (WORKER-HYGIENE Phase D)." }
        source:           { type: string, enum: [DYNAMIC, STATIC], description: "DYNAMIC = spun by the regional; STATIC = operator-declared (CLUSTER-CAPACITY — both share the pool)." }
        containerRunning: { type: boolean, description: "Spun pods: live readback from the region's Pod list. Declared workers: registry state (not LOST). False on region outages." }
        lastHeartbeat:    { type: string, format: date-time, nullable: true }
        blockedBy:        { $ref: "#/components/schemas/PodBlockedBy", nullable: true }
        runsServed:       { type: integer, format: int64, description: "WORKER-HYGIENE Phase F1 — count of runs claimed against this pod." }
        imageDigest:      { type: string, nullable: true, description: "WORKER-HYGIENE Phase F1 — sha256 ID of the image; null for legacy rows." }
        provisionedAt:    { type: string, format: date-time, nullable: true, description: "WORKER-HYGIENE Phase F1 — container-create timestamp; null for legacy rows." }
    PodBlockedBy:
      type: object
      description: "Set on a PodView when state=IN_USE. Surfaces the run holding the pod so the UI can render 'cannot drain — running test {runId}'."
      properties:
        runId:       { type: string }
        state:       { type: string, description: "Run state — PREPARING / STARTING / RUNNING / DRAINING." }
        startedAt:   { type: string, format: date-time, nullable: true }
        initiatedBy: { type: string }
    SpinPodResponse:
      type: object
      required: [podName, groupId, region, baseUrl, provisioned, maxAvailable]
      properties:
        podName:       { type: string, example: "cps-na-east-worker-1" }
        groupId:       { type: string }
        region:        { type: string }
        baseUrl:       { type: string, example: "http://payments-us-east-worker-1:8080" }
        provisioned:   { type: integer, description: "Provisioned count after this spin." }
        maxAvailable:  { type: integer }
        ready:
          type: boolean
          description: "True when the kubelet reported the pod ready within the wait; false means it is still STARTING and becomes READY through the liveness probe."
    PlatformHealth:
      type: object
      required: [status, checkedAt, components]
      properties:
        status:     { type: string, enum: [UP, DEGRADED, DOWN, UNKNOWN] }
        checkedAt:  { type: string, format: date-time }
        components:
          type: array
          items: { $ref: "#/components/schemas/PlatformHealthComponent" }
      example:
        status: DEGRADED
        checkedAt: "2026-08-30T02:30:00Z"
        components:
          - { id: global-orchestrator, name: Global orchestrator, kind: service, status: UP, detail: provisioning DYNAMIC,
              components: [ { id: db.globalrunDataSource, name: "Oracle · run state", kind: dependency, status: UP, detail: Oracle },
                            { id: db.metricsDataSource, name: "Oracle · metrics", kind: dependency, status: UP, detail: Oracle },
                            { id: redis, name: Cache, kind: dependency, status: UP } ] }
          - { id: metrics-consumer, name: Metrics consumer, kind: service, status: UP, detail: "idle — last envelope 12 min ago (normal between runs)", url: "http://metrics-consumer:8083", latencyMs: 4 }
          - { id: document-service, name: Document service, kind: service, status: UP, detail: 721 GB free, url: "http://document-service:8084", latencyMs: 3 }
          - { id: regions, name: Data centers, kind: regions, status: DEGRADED, detail: 1 of 2 region(s) down,
              components: [ { id: region.na-east, name: na-east, kind: region, status: DOWN, detail: regional orchestrator unreachable,
                              components: [ { id: region.na-east.regional-orchestrator, name: Regional orchestrator, kind: regional-orchestrator, status: DOWN, detail: "HTTP connect timed out", url: "http://na-east-control-plane:30088" },
                                            { id: region.na-east.workers, name: Workers, kind: workers, status: UP, detail: "1 idle · 0 busy", facts: { total: 1, idle: 1, busy: 0, lost: 0 } } ] } ] }
    PlatformHealthComponent:
      type: object
      required: [id, name, kind, status]
      properties:
        id:         { type: string, description: "Stable identifier (`metrics-consumer`, `region.na-east.workers`)." }
        name:       { type: string, description: "What the operator reads." }
        kind:       { type: string, enum: [service, dependency, regions, region, regional-orchestrator, workers] }
        status:     { type: string, enum: [UP, DEGRADED, DOWN, UNKNOWN] }
        detail:     { type: string, nullable: true, description: "One line: the reason when not UP, the interesting fact when UP." }
        url:        { type: string, nullable: true }
        checkedAt:  { type: string, format: date-time, nullable: true }
        latencyMs:  { type: integer, format: int64, nullable: true }
        facts:      { type: object, nullable: true, additionalProperties: true, description: "Small typed facts (worker counts, versions, free space)." }
        components:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/PlatformHealthComponent" }

    PlatformCapabilities:
      type: object
      required: [regions, maxClustersPerGroup]
      properties:
        regions:
          type: array
          items: { type: string }
          description: |
            The registered clusters' region ids (runtime registry — empty
            until the first cluster is added). The API and schema keep saying
            `region` everywhere; "cluster" is the UI's display word.
        maxClustersPerGroup:
          type: integer
          description: How many clusters one application group may reserve capacity on (default 2).
    DeclarePodRequest:
      type: object
      required: [baseUrl]
      properties:
        baseUrl:
          type: string
          maxLength: 512
          description: |
            Absolute http(s) address the control plane can reach this worker
            at, e.g. `http://payments-na-east-worker-1.workers:8080`. No
            embedded credentials, query string or fragment. A trailing slash
            is normalised away.
          example: http://payments-na-east-worker-1.workers:8080
    DeclaredPodResponse:
      type: object
      required: [podName, groupId, region, baseUrl, source, reachable, declared, maxAvailable]
      properties:
        podName:       { type: string }
        groupId:       { type: string }
        region:        { type: string }
        baseUrl:       { type: string }
        source:        { type: string, enum: [STATIC] }
        reachable:
          type: boolean
          description: |
            Whether the worker answered its health endpoint at declare time.
            False only when `?force=true` was used.
        declared:
          type: integer
          description: Declared workers for this (group, region) after the call.
        maxAvailable:
          type: integer
          description: The group's reservation on the cluster (unchanged by a declare).
    CapacityExceededResponse:
      type: object
      required: [code, message, provisioned, maxAvailable]
      properties:
        code:         { type: string, enum: [APPLICATION_CAPACITY_EXCEEDED] }
        message:      { type: string }
        provisioned:  { type: integer }
        maxAvailable: { type: integer }
    CapacityShrinkResponse:
      type: object
      required: [code, message, provisioned, requested]
      properties:
        code:        { type: string, enum: [CAPACITY_SHRINK_BELOW_PROVISIONED] }
        message:     { type: string }
        provisioned: { type: integer }
        requested:   { type: integer }
    PodInUseResponse:
      type: object
      required: [code, message, podName, blockedBy]
      properties:
        code:      { type: string, enum: [POD_IN_USE] }
        message:   { type: string }
        podName:   { type: string }
        blockedBy: { $ref: "#/components/schemas/PodBlockedBy" }

    ClusterStatus:
      type: object
      required: [region, label, regionalUrl, maxWorkers, reservedWorkers, provisionedWorkers, probing]
      properties:
        region: { type: string, example: na-east }
        label: { type: string, example: "NA East (kind)", description: "The display name — what the UI shows as the Cluster." }
        regionalUrl: { type: string, example: "http://na-east-control-plane:30088" }
        maxWorkers: { type: integer, example: 20, maximum: 20, description: "The cluster ceiling group reservations must fit under — hard cap 20 (the 180 GB grant at 9 GB per worker)." }
        reservedWorkers: { type: integer, example: 12, description: "SUM of every group's reservation on this cluster." }
        provisionedWorkers: { type: integer, format: int64, example: 7, description: "Worker rows (spun + declared) in the registry for this region." }
        reachable: { type: boolean, nullable: true, description: "Last probe verdict; null before the first probe." }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        lastError: { type: string, nullable: true }
        capabilities:
          type: object
          nullable: true
          properties:
            region: { type: string }
            namespace: { type: string }
            headlessService: { type: string }
            image: { type: string }
            localOrchestratorPort: { type: integer }
            version: { type: string }
            workersFree: { type: integer, nullable: true }
            workerMemoryMb: { type: integer, format: int64, nullable: true }
            workerEphemeralStorage: { type: string, nullable: true }
        lastValidatedAt: { type: string, format: date-time, nullable: true }
        lastProbe:
          type: object
          nullable: true
          description: |
            The last test-provisioning probe's verdict. Absent while one is
            running — `LAST_PROBE_STATUS = RUNNING` is the cross-replica claim
            and surfaces as `probing`, not as a verdict.
          properties:
            at: { type: string, format: date-time }
            status: { type: string, enum: [PASS, FAIL] }
            detail: { type: string }
        probing: { type: boolean, description: "True while a test-provisioning probe holds this cluster's slot — read from the row, so every hub replica agrees." }

    RegisterClusterRequest:
      type: object
      required: [region, label, regionalUrl]
      properties:
        region: { type: string, pattern: "^[a-z0-9]([-a-z0-9]{0,18}[a-z0-9])?$", example: na-east }
        label: { type: string, maxLength: 255, example: "NA East (kind)", description: "Unique display name — two clusters must never present as one." }
        regionalUrl: { type: string, maxLength: 512, example: "http://na-east-control-plane:30088", description: "Unique — one regional serves exactly one cluster." }
        maxWorkers: { type: integer, minimum: 1, maximum: 20, default: 20 }

    UpdateClusterRequest:
      type: object
      description: Null fields keep their current value; a changed regionalUrl re-runs validation.
      properties:
        label: { type: string, maxLength: 255, nullable: true }
        regionalUrl: { type: string, maxLength: 512, nullable: true }
        maxWorkers: { type: integer, minimum: 1, maximum: 20, nullable: true }

    ClusterCheck:
      type: object
      required: [name, ok, detail, code]
      properties:
        name: { type: string, enum: [endpointReachable, regionMatches, imageConfigured, rbacPods, rbacPodsLog, rbacResourceQuotas, quotaHeadroom, provisioningCheck] }
        ok: { type: boolean }
        detail: { type: string, description: "What passed, or exactly what is wrong." }
        code: { type: string, description: The stable error code this check reports when it fails. }

    ClusterRegistrationResponse:
      type: object
      required: [cluster]
      properties:
        cluster: { $ref: "#/components/schemas/ClusterStatus" }
        checks:
          type: array
          items: { $ref: "#/components/schemas/ClusterCheck" }

    ClusterValidationError:
      type: object
      required: [code, message, region, checks]
      properties:
        code: { type: string, enum: [INVALID_CLUSTER_URL, CLUSTER_UNREACHABLE, REGION_MISMATCH, NO_WORKER_IMAGE, RBAC_DENIED, QUOTA_EXHAUSTED] }
        message: { type: string }
        region: { type: string }
        checks:
          type: array
          items: { $ref: "#/components/schemas/ClusterCheck" }

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - REGION_UNREACHABLE
            - REGIONAL_CALL_FAILED
            - RUN_NOT_FOUND
            - INVALID_REQUEST
            - INTERNAL_ERROR
            - INSUFFICIENT_CAPACITY
            - POD_NOT_REGISTERED
            - UNKNOWN_REGION
            - FLEET_SIZE_EXCEEDED
            # Phase 3 capacity rework error codes — surfaced by CapacityController.
            - APPLICATION_NOT_FOUND
            - CAPACITY_REGION_NOT_FOUND
            - APPLICATION_CAPACITY_EXCEEDED
            - CAPACITY_SHRINK_BELOW_PROVISIONED
            - POD_NOT_FOUND
            - POD_IN_USE
            # CLUSTER-CAPACITY — the cluster registry + reservations.
            - CLUSTER_NOT_REGISTERED
            - CLUSTER_EXISTS
            - CLUSTER_NAME_TAKEN
            - CLUSTER_URL_TAKEN
            - CLUSTER_IN_USE
            - CLUSTER_SHRINK_BELOW_RESERVED
            - CLUSTER_CAPACITY_EXCEEDED
            - GROUP_CLUSTER_LIMIT
            - POD_SOURCE_STATIC
            - POD_SOURCE_DYNAMIC
            - PROBE_IN_PROGRESS
            # AI analysis error codes — surfaced by AiController.
            - AI_DISABLED
            - AI_QUOTA_EXCEEDED
            - AI_UPSTREAM_ERROR
        message: { type: string }
        shortfall:
          type: array
          description: |
            Present on `INSUFFICIENT_CAPACITY` responses — per-region
            breakdown of requested-vs-claimed counts so the UI can
            highlight which regions fell short.
          items:
            type: object
            properties:
              region:    { type: string }
              requested: { type: integer }
              claimed:   { type: integer }
        regions:
          type: array
          description: Present on `UNKNOWN_REGION` — the region names the caller specified that the registry has never seen.
          items: { type: string }
        requested:
          type: integer
          description: Present on `FLEET_SIZE_EXCEEDED` — the total allocation count the caller submitted.
        max:
          type: integer
          description: Present on `FLEET_SIZE_EXCEEDED` — the per-run fleet-size cap.

    # ──────────────────────────────────────────────────────────────────────
    # AI analysis
    # ──────────────────────────────────────────────────────────────────────
    AiStatus:
      type: object
      description: AI feature probe — whether analysis is configured + which model.
      properties:
        enabled: { type: boolean, description: "True when an ANTHROPIC_API_KEY is configured server-side." }
        model:   { type: string, description: "Model id the analysis endpoints use, e.g. claude-sonnet-4-6." }

    AiPingResponse:
      type: object
      description: Smoke-test reply + token counts.
      properties:
        reply:     { type: string }
        tokensIn:  { type: integer }
        tokensOut: { type: integer }

    RunInsights:
      type: object
      description: |
        AI-1 — Claude's reading of a single run. Advisory, never authoritative.
        `fromCache=true` means this load was served from the durable aiResponse
        table (no Claude bill); `cachedAt` is when the response was produced.
      properties:
        runId:         { type: string }
        model:         { type: string }
        promptVersion: { type: string, example: v1 }
        summary:       { type: string, description: "3–5 sentence plain-text overview." }
        findings:
          type: array
          items:
            type: object
            properties:
              severity: { type: string, enum: [info, warn, crit] }
              title:    { type: string }
              detail:   { type: string }
        tokensIn:  { type: integer }
        tokensOut: { type: integer }
        cachedAt:  { type: string, format: date-time }
        fromCache: { type: boolean }

    CompareInsights:
      type: object
      description: |
        AI-2 — Claude's reading of the delta between two runs (B relative to A).
        Advisory, never authoritative. Cached on the sorted run pair.
      properties:
        runIds:
          type: array
          items: { type: string }
          description: "The two run ids in the operator's submitted order (A, B)."
        model:         { type: string }
        promptVersion: { type: string, example: v1 }
        summary:       { type: string, description: "3–5 sentence comparison of B relative to A." }
        findings:
          type: array
          items:
            type: object
            properties:
              metric:  { type: string, example: avgRtMs }
              verdict: { type: string, enum: [regression, improvement, "no significant change"] }
              delta:   { type: string, example: "+12.3%" }
        tokensIn:  { type: integer }
        tokensOut: { type: integer }
        cachedAt:  { type: string, format: date-time }
        fromCache: { type: boolean }
