# jmeter-global-orchestrator subsystem — Compose fragment.

services:

  global-orchestrator:
    build:
      context: .
    image: jmeter-global-orchestrator:dev
    profiles: [default]
    # Reliability: self-heal on crash/OOM
    # or host reboot. The control plane (run fan-out, pod registry, sweeper)
    # must come back automatically.
    restart: unless-stopped
    depends_on:
      oracle:
        condition: service_healthy
      flyway-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${GLOBAL_ORCHESTRATOR_HTTP_PORT:-8082}:8082"
    # Worker provisioning happens inside each region's cluster through its
    # jmeter-regional-orchestrator, so this container holds no cluster
    # credential, mounts no docker socket and runs as the image's
    # unprivileged user. On compose alone the platform is STATIC (declare
    # workers); point REGIONS at the kind regions for DYNAMIC.
    environment:
      HTTP_PORT:                "8082"
      HTTP_BIND_ADDRESS:        0.0.0.0
      # ORACLE-MIGRATION (2026-08-28): one PDB, three role identities —
      # metrics reader (rollups), metrics purger (DELETE only), run-state
      # writer. Wired by config/DataSourceConfig.java, which quotes the
      # bare camelCase usernames for Oracle.
      ORACLE_METRICS_URL:              jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      ORACLE_METRICS_READER_USER:      ${ORACLE_METRICS_READER_USER:-metricsReader}
      ORACLE_METRICS_READER_PASSWORD:  ${ORACLE_METRICS_READER_PASSWORD:-localdev}
      ORACLE_METRICS_PURGER_USER:      ${ORACLE_METRICS_PURGER_USER:-metricsPurger}
      ORACLE_METRICS_PURGER_PASSWORD:  ${ORACLE_METRICS_PURGER_PASSWORD:-localdev}
      ORACLE_GLOBALRUN_URL:            jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      ORACLE_GLOBALRUN_WRITER_USER:    ${ORACLE_GLOBALRUN_WRITER_USER:-globalOrchestratorWriter}
      ORACLE_GLOBALRUN_WRITER_PASSWORD: ${ORACLE_GLOBALRUN_WRITER_PASSWORD:-localdev}
      TZ:                          UTC
      # Phase 6: LOCAL_ORCHESTRATOR_URLS removed. Worker discovery is
      # via the runtime pod registry (Step 15) and PodProvisioner
      # creates per-app workers on demand; the static URL list is dead.
      GLOBAL_ORCHESTRATOR_REGION:             ${GLOBAL_ORCHESTRATOR_REGION:-us-east-1}
      GLOBAL_ORCHESTRATOR_FANOUT_THREADS:     ${GLOBAL_ORCHESTRATOR_FANOUT_THREADS:-32}
      # STATIC-FLEET — whether this deployment may create workers at all.
      # STATIC is the platform default (2026-07-27): workers are deployed and
      # owned by the operator, spin / restart / teardown answer 409, and the
      # reconciler + recycler are not wired.
      # NOTE FOR LOCAL DEV: compose alone has no cluster, so spin answers
      # 409 (STATIC) or 503 REGION_UNREACHABLE (DYNAMIC with no routed
      # region). For the spin-a-worker loop bring up the kind regions
      # (infra/deploy/k8s/local/bootstrapRegions.sh) and set
      # PROVISIONING_MODE=DYNAMIC + REGIONS=id=url,… in .env.
      # REGIONS lists the deployment's regions (= data centers), each
      # optionally with its regional orchestrator URL — `id` is direct,
      # `id=url` is routed through that cluster's jmeter-regional-orchestrator.
      PROVISIONING_MODE:                      ${PROVISIONING_MODE:-STATIC}
      REGIONS:                                ${REGIONS:-}
      DOCUMENT_SERVICE_URL:                   ${DOCUMENT_SERVICE_URL:-http://document-service:8084}
      # CACHE C-0 (2026-05-26) — shared Redis cache. Consumed by
      # application.yml's spring.data.redis.* placeholders.
      REDIS_HOST:                             ${REDIS_HOST:-redis}
      REDIS_PORT:                             ${REDIS_PORT:-6379}
      # AUTOMATION Phase E — SMTP target for report emails (MailHog in dev).
      MAIL_HOST:                              ${MAIL_HOST:-mailhog}
      MAIL_PORT:                              ${MAIL_PORT:-1025}
      # AI analysis — server-side Claude proxy. The key lives in
      # the repo-root .env (a local secret — do NOT commit it) and is forwarded
      # here. Empty default → AI disabled (503 AI_DISABLED; the UI hides its
      # buttons), so the stack boots fine without a key. Model + daily cap are
      # tunable from .env without a rebuild. Consumed by application.yml's
      # globalOrchestrator.ai.* placeholders.
      ANTHROPIC_API_KEY:        ${ANTHROPIC_API_KEY:-}
      AI_MODEL:                 ${AI_MODEL:-claude-sonnet-4-6}
      AI_DAILY_INVOCATION_CAP:  ${AI_DAILY_INVOCATION_CAP:-200}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # CACHE C-0 (2026-05-26) — shared cache backing store. The
  # global-orchestrator's @Cacheable / @CacheEvict layer (Spring Cache over
  # spring-data-redis) reads/writes here so every orchestrator instance shares
  # one cache. Local dev runs a single unauthenticated KRaft-style instance,
  # mirroring the no-auth-locally posture of the database; the cloud
  # deployment swaps in a managed Redis (ElastiCache) via REDIS_HOST/REDIS_PORT
  # with no code change. AOF persistence is off — the cache is rebuildable from
  # the database on restart, so durability buys nothing here.
  redis:
    image: redis:7-alpine
    profiles: [default]
    restart: unless-stopped   # Reliability (Round 5): self-heal — the cache is rebuildable from the database on restart.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # AUTOMATION Phase E — local SMTP sink for the daily report emails. MailHog
  # accepts SMTP on 1025 and exposes a web UI + REST API on 8025 so the full
  # email path is testable locally. SMTP is the only backend — a cloud
  # deployment points spring.mail at its own relay instead of MailHog.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    profiles: [default]
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
