# Umbrella for ONE local kind cluster: every service's token-free `local`
# overlay + the local Oracle. The `kubectl apply -k` analog of the top-level
# docker-compose.yml include list. The hosted platform does not use an
# umbrella — each service deploys through its own jules.yml pipeline into its
# own namespace (PRIVATE-CLOUD-ALIGNMENT Track 7, D10).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jmeter-cloud
labels:
  - pairs:
      app.kubernetes.io/part-of: jmeter-cloud
    includeSelectors: false
resources:
  - ../../../../oracle/kube/overlays/kind
  - ../../../../jmeter-metrics-consumer/kube/kustomize/overlays/local
  - ../../../../document-service/kube/kustomize/overlays/local
  - ../../../../jmeter-global-orchestrator/kube/kustomize/overlays/local
  - ../../../../jmeter-regional-orchestrator/kube/kustomize/overlays/local   # carries the Namespace
  - ../../../../jmeter-cloud-ui/kube/kustomize/overlays/local
