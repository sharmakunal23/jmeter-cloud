# KUBE-0 — umbrella kustomization, privateCloud flavor: the real hosting
# target. Composes the per-service privateCloud overlays (private-registry
# images, Secrets via git-ignored secretGenerator env files, Ingress for
# the UI, storageClass on PVCs, corporate SMTP instead of MailHog).
#
# Usage (kubeconfig pointed at the private cluster):
#   kubectl apply -k infra/deploy/k8s/privateCloud
#
# Service entries are commented in as their KUBE-* phase lands
# (the KUBE track) — kustomize fails on paths that don't
# exist yet, so this file always builds clean.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jmeter-cloud
labels:
  - pairs:
      app.kubernetes.io/part-of: jmeter-cloud
    includeSelectors: false
resources:
  - ../namespace
  - ../../../../postgres/kube/overlays/privateCloud
  - ../../../../jmeter-metrics-consumer/kube/overlays/privateCloud
  - ../../../../document-service/kube/overlays/privateCloud
  - ../../../../jmeter-global-orchestrator/kube/overlays/privateCloud
  # One regional in the hub cluster serves the region named below; other
  # data centers apply jmeter-regional-orchestrator/kube/overlays/privateCloud
  # on their own cluster and are listed in the global's REGIONS.
  - ../../../../jmeter-regional-orchestrator/kube/base
  - ../../../../jmeter-cloud-ui/kube/overlays/privateCloud
  - ../../../../grafana/kube/overlays/privateCloud
  # KUBE-11 — default-deny NetworkPolicies. Enable ONLY on a CNI that
  # enforces them, after filling the placeholders + verifying kubelet
  # probes (see ../privateCloudHardening.md §3):
  # - networkPolicies.yaml
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: jmeter-regional-orchestrator
      spec:
        template:
          spec:
            containers:
              - name: regional-orchestrator
                env:
                  - name: REGION
                    value: na-east
