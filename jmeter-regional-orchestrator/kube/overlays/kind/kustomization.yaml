# kind overlay — one regional cluster. REGION is stamped by the bootstrap
# (infra/deploy/k8s/local/bootstrapRegions.sh) via `kustomize edit` or an
# env patch; the NodePort lets the compose hub reach this cluster at
# http://<cluster>-control-plane:30088 once the node joins the compose
# network. Worker memory is sized for a validation cluster, not for load.
# Side-load images first (BuildKit attestations break `kind load`):
#   docker build --provenance=false -t jmeter-regional-orchestrator:dev jmeter-regional-orchestrator/
#   kind load docker-image jmeter-regional-orchestrator:dev jmeter-local-orchestrator:dev --name <cluster>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../infra/deploy/k8s/namespace
  - ../../base
patches:
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: jmeter-regional-orchestrator
      spec:
        type: NodePort
        ports:
          - name: http
            port: 8088
            targetPort: http
            nodePort: 30088
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: jmeter-regional-orchestrator
      spec:
        template:
          spec:
            containers:
              - name: regional-orchestrator
                env:
                  - name: REGION
                    value: local
                  # Validation sizing: a 512m JMeter child + the worker's 1g
                  # orchestrator heap fit in 1536Mi. Production keeps the
                  # worker defaults (2g child, 6144Mi).
                  - name: PODPROVISIONER_WORKER_MEMORY_MB
                    value: "1536"
                  - name: PODPROVISIONER_JMETER_JVM_ARGS
                    value: "-Xms256m -Xmx512m"
