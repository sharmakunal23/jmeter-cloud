# privateCloud overlay — one per data-center cluster. Set REGION, the three
# hub URLs as reachable from inside this cluster, and the registry
# references, then apply. No credentials: this service holds none beyond
# its ServiceAccount.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../infra/deploy/k8s/namespace
  - ../../base
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: jmeter-regional-orchestrator
      spec:
        template:
          spec:
            containers:
              - name: regional-orchestrator
                env:
                  - name: REGION
                    value: na-east
                  - name: PODPROVISIONER_METRICS_INGEST_URL
                    value: https://jmeter-cloud.internal.example.com/api/v1/ingest
                  - name: DOCUMENT_SERVICE_URL
                    value: https://jmeter-cloud.internal.example.com
# Private-registry rewrite — the `images:` transformer rewrites only THIS
# service's image; the worker image is stamped at runtime from
# PODPROVISIONER_IMAGE and must be patched separately. Pin repo:tag@sha256:
# currentImageDigest() returns the configured reference, so a re-tag mid-run
# triggers IMAGE_MISMATCH recycle drains.
# images:
#   - name: jmeter-regional-orchestrator
#     newName: registry.internal.example.com/jmeter-cloud/jmeter-regional-orchestrator
#     newTag: "1.0.0"
