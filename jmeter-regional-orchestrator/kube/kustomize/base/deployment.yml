# Generated once by the Track 7 layout (2026-08-30); hand-maintained since.
# jmeter-regional-orchestrator — the hub's arm inside a data center: creates worker Pods (fabric8) and relays worker calls.
# Environment-neutral shape: probes, security context, resources, the env the
# service needs in every tier. Everything that differs per tier (image, URLs,
# replicas, memory, volumes, profile) is patched by kube/kustomize/overlays/<env>.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jmeter-regional-orchestrator
  labels:
    app: jmeter-regional-orchestrator
spec:
  replicas: 1
  revisionHistoryLimit: 4
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jmeter-regional-orchestrator
  template:
    metadata:
      labels:
        app: jmeter-regional-orchestrator
    spec:
      enableServiceLinks: false        # kubelet injects <SVC>_PORT=tcp://… per Service; those collide with ${ORACLE_PORT:1521}-style bindings
      serviceAccountName: jmeter-regional-orchestrator
      securityContext:
        runAsNonRoot: true             # runAsUser / fsGroup are tier values (the PV labels) — set by the overlays
      imagePullSecrets:
        - name: image-pull-secret
      containers:
        - name: regional-orchestrator
          image: ${containerImageUri}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8088
          envFrom:
            - configMapRef:
                name: app-runtime-jmeter-regional-orchestrator     # generated by the overlay: SPRING_PROFILES_ACTIVE
          env:
            - name: JAVA_OPTS
              value: "-Xms128m -Xmx256m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -XX:+UseContainerSupport"
            - name: HTTP_PORT
              value: "8088"
            - name: TZ
              value: UTC
            - name: PODPROVISIONER_HEADLESS_SERVICE
              value: workers
            - name: SERVER_FORWARD_HEADERS_STRATEGY
              value: NATIVE
            - name: SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES
              value: .*
            - name: INFO_KUBE_ENV
              value: "${environment}"
            - name: INFO_KUBE_CLUSTER
              value: "${cluster}"
            - name: INFO_KUBE_IMAGE
              value: "${containerImageUri}"
            - name: INFO_KUBE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: INFO_KUBE_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: INFO_KUBE_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: INFO_KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # Three-probe pattern: startup + liveness follow the PROCESS (never a
          # dependency — a database or storage blip must not restart every
          # replica); readiness follows the dependencies and only gates traffic.
          startupProbe:
            httpGet:
              path: /actuator/keepalive
              port: http
              httpHeaders:
                - name: x-forwarded-proto
                  value: https
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 30       # 150 s boot budget
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
              httpHeaders:
                - name: x-forwarded-proto
                  value: https
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/keepalive
              port: http
              httpHeaders:
                - name: x-forwarded-proto
                  value: https
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            # requests == limits for memory (Guaranteed QoS: the JVM's heap is
            # fixed, so the node's OOM killer never picks this pod first). The
            # CPU limit exists because the platform's namespace quota counts
            # limits.cpu; it is generous enough not to throttle at steady state.
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 768Mi
