# Generated once by the Track 7 layout (2026-08-30); hand-maintained since.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# `test` tier: ${…} tokens are resolved by the jules deploy step (namespace,
# cluster-host, containerImageUri); nothing here is environment-specific by hand.
resources:
  - ../../base/
  - ingress.yml
  - network-policy-custom.yml
patches:
  - path: deployment.yml
namespace: ${namespace}
configMapGenerator:
  - name: app-runtime-jmeter-regional-orchestrator
    literals:
      - SPRING_PROFILES_ACTIVE=test
# Secrets are created out of band before the first apply (never committed):
#   kubectl -n <namespace> create secret generic metrics-ingest-auth --from-literal=… (authorization (the whole `Bearer <token>` value the workers send))
