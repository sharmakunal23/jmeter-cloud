# Generated once by the Track 7 layout (2026-08-30); hand-maintained since.
# Strategic-merge patch over the base Deployment for the `prod` tier.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jmeter-regional-orchestrator
spec:
  replicas: 1
  template:
    spec:
      securityContext:
        runAsUser: 214818            # MUST equal the PV label UID (test/prod storage) and the image's least-privilege user
        fsGroup: 99                 # MUST equal the PV label GID
      containers:
        - name: regional-orchestrator
          image: ${containerImageUri}
          env:
            - name: REGION
              value: "${cluster}"
            - name: PODPROVISIONER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PODPROVISIONER_IMAGE
              value: "REPLACE_ME_REGISTRY/c<sealId>/jmeter-local-orchestrator@sha256:REPLACE_ME_WORKER_DIGEST"
            - name: PODPROVISIONER_METRICS_INGEST_URL
              value: "https://metrics-consumer.REPLACE_ME_PLATFORM_DOMAIN/api/v1/ingest"
            - name: DOCUMENT_SERVICE_URL
              value: "https://document-service.REPLACE_ME_PLATFORM_DOMAIN"
            - name: PODPROVISIONER_METRICS_INGEST_AUTH
              valueFrom:
                secretKeyRef:
                  name: metrics-ingest-auth
                  key: authorization
            # Worker Pod shape on this platform (Track 8) — read the namespace's
            # ResourceQuota + LimitRange first (`kubectl get resourcequota,limitrange -n <ns>`).
            - name: PODPROVISIONER_WORKER_CPU_LIMIT
              value: "2"                     # the quota counts limits.cpu
            # The 9 GB worker footprint (CLUSTER-CAPACITY): 5 Gi memory + 4 Gi
            # ephemeral -> 20 workers fit a 180 GB cluster grant.
            #
            # A limit must fit both JVMs WHOLE, not just their -Xmx (the platform
            # already lost workers to exactly that). With both heaps at 1536m the
            # two PROCESSES land at ~2 Gi each — the "2 GB local-orch + 2 GB
            # JMeter" split — and the container must also hold page cache:
            #   orchestrator 1536 heap + 192 metaspace + 96 code + ~200 stacks/GC/JVM ~= 2.0 Gi
            #   JMeter       1536 heap + 192 metaspace + 96 code + 128 direct
            #                           + ~300 thread stacks + ~150 GC/JVM           ~= 2.3 Gi
            #   -> ~4.3 Gi committed worst case, ~0.7 Gi left for page cache.
            # Raising either -Xmx means raising memory with it; a 2 g JMeter heap
            # needs 6144 here (10 GB/worker, 18 per cluster).
            - name: PODPROVISIONER_WORKER_MEMORY_MB
              value: "5120"
            - name: PODPROVISIONER_WORKER_EPHEMERAL_STORAGE
              value: 4Gi                     # under the LimitRange max 10Gi; request == limit (ratio 1); the JTL lives here, bounded by the worker's RUN_ARTIFACT_RETENTION_* knobs
            - name: PODPROVISIONER_IMAGE_PULL_SECRET
              value: image-pull-secret
            - name: PODPROVISIONER_RUN_AS_USER
              value: "214818"                # the worker image's least-privilege user
            - name: PODPROVISIONER_RUN_AS_GROUP
              value: "99"
            - name: PODPROVISIONER_EXTRA_LABELS
              value: app=jmeter-worker
            - name: PODPROVISIONER_WORKER_JAVA_OPTS
              value: -Xms1536m -Xmx1536m -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=96m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+ExitOnOutOfMemoryError -XX:+UseContainerSupport
            - name: PODPROVISIONER_JMETER_JVM_ARGS
              value: -Xms1536m -Xmx1536m -XX:MaxMetaspaceSize=192m -XX:MaxDirectMemorySize=128m -XX:ReservedCodeCacheSize=96m -XX:+ExitOnOutOfMemoryError
          resources:
            requests:
              memory: 768Mi
              ephemeral-storage: 10Gi
            limits:
              memory: 768Mi
              ephemeral-storage: 10Gi
