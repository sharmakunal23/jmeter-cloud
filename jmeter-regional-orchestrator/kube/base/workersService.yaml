# Headless Service giving every managed worker Pod the stable DNS name
# {podName}.workers (the provisioner sets hostname={podName} +
# subdomain=workers). The selector is the provisioner's managedBy label —
# ProvisionerProperties.MANAGED_BY — and must change with it.
apiVersion: v1
kind: Service
metadata:
  name: workers
spec:
  clusterIP: None
  # Pending pods must be resolvable too — the global records the baseUrl
  # before the worker is Ready.
  publishNotReadyAddresses: true
  selector:
    com.perf.jmeterCloud.managedBy: regional-orchestrator
  ports:
    - name: http
      port: 8080
      targetPort: 8080
