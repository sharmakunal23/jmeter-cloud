# jmeter-regional-orchestrator base — one per cluster, in the platform
# namespace. The workers Service and the pods-only Role live here because
# this service is what creates the worker Pods they select and govern.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jmeter-cloud
labels:
  - pairs:
      app.kubernetes.io/part-of: jmeter-cloud
    includeSelectors: false
resources:
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - workersService.yaml
