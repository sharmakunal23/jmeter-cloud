<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#fafaf9"/>
  <text x="30" y="30" font-size="15" font-weight="700" fill="#0f172a">jmeter-regional-orchestrator — the hub's arm inside one cluster</text>
  <text x="30" y="48" font-size="10" fill="#64748b">Stateless. The global calls it; it creates Pods, reports their liveness and relays worker calls. Workers reach the hub for data only.</text>

  <!-- HUB band -->
  <rect x="30" y="66" width="840" height="84" rx="8" fill="none" stroke="#bfdbfe"/>
  <text x="42" y="82" font-size="10" font-weight="600" letter-spacing="1" fill="#1e3a8a">HUB · ANYWHERE</text>

  <rect x="42" y="90" width="224" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="154" y="110" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">global-orchestrator</text>
  <text x="154" y="126" text-anchor="middle" font-size="10" fill="#475569">8082 · runs · pod registry · claims</text>

  <rect x="520" y="90" width="170" height="50" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="605" y="110" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">metrics-consumer</text>
  <text x="605" y="126" text-anchor="middle" font-size="10" fill="#475569">8083 · ingest</text>

  <rect x="704" y="90" width="156" height="50" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="782" y="110" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">document-service</text>
  <text x="782" y="126" text-anchor="middle" font-size="10" fill="#475569">8084 · artifacts · results</text>

  <!-- CLUSTER band -->
  <rect x="30" y="200" width="840" height="200" rx="8" fill="none" stroke="#99f6e4"/>
  <text x="42" y="216" font-size="10" font-weight="600" letter-spacing="1" fill="#115e59">CLUSTER na-east</text>

  <rect x="42" y="228" width="224" height="66" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="154" y="248" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">jmeter-regional-orchestrator</text>
  <text x="154" y="264" text-anchor="middle" font-size="10" fill="#475569">8088 · pods · liveness · relay</text>
  <text x="154" y="280" text-anchor="middle" font-size="10" fill="#475569">no state · never dials the hub</text>

  <rect x="42" y="340" width="224" height="46" rx="6" fill="#ffffff" stroke="#5eead4" stroke-width="1.3"/>
  <text x="154" y="359" text-anchor="middle" font-size="12" font-weight="600" fill="#115e59">Kubernetes API</text>
  <text x="154" y="375" text-anchor="middle" font-size="10" fill="#475569">ServiceAccount · pods-only Role</text>

  <rect x="400" y="228" width="460" height="158" rx="6" fill="none" stroke="#5eead4" stroke-width="1.3" stroke-dasharray="3,3"/>
  <text x="630" y="246" text-anchor="middle" font-size="11" font-weight="600" fill="#115e59">worker Pods · {podName}.workers · 8080</text>
  <rect x="420" y="258" width="200" height="40" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.3"/>
  <text x="520" y="282" text-anchor="middle" font-size="11" font-weight="600" fill="#115e59">payments-na-east-worker-1</text>
  <rect x="640" y="258" width="200" height="40" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.3"/>
  <text x="740" y="282" text-anchor="middle" font-size="11" font-weight="600" fill="#115e59">payments-na-east-worker-N</text>
  <text x="630" y="326" text-anchor="middle" font-size="10" fill="#475569">bare Pods · restartPolicy Never · requests == limits</text>
  <text x="630" y="342" text-anchor="middle" font-size="10" fill="#475569">stamped: METRICS_INGEST_URL · DOCUMENT_SERVICE_URL · JMETER_JVM_ARGS</text>
  <text x="630" y="366" text-anchor="middle" font-size="9" fill="#64748b">as seen from inside the cluster — bridge Services on kind, ingress hostnames in a cloud</text>

  <!-- arrows -->
  <g stroke="#64748b" stroke-width="1.3" fill="none" marker-end="url(#a)">
    <!-- global -> regional -->
    <path d="M180,140 V226"/>
    <!-- regional -> Kubernetes API -->
    <path d="M180,294 V338"/>
    <!-- regional -> workers (relay) -->
    <path d="M266,262 H398"/>
    <!-- workers -> metrics-consumer -->
    <path d="M605,226 V142"/>
    <!-- workers -> document-service -->
    <path d="M782,226 V142"/>
  </g>

  <g font-size="9" fill="#64748b">
    <text x="188" y="170">/api/v1/pods · /api/v1/workers (liveness) · /workers/status</text>
    <text x="188" y="182">/api/v1/workers/{podName}/… · one URL per registered cluster</text>
    <text x="188" y="322">create · delete · list Pod</text>
    <text x="272" y="256">relay: POST /test · drain · abort · logs</text>
    <text x="616" y="186" fill="#94a3b8">no heartbeats —</text>
    <text x="616" y="197" fill="#94a3b8">the Pod list is liveness</text>
    <text x="611" y="170">ingest</text>
    <text x="788" y="170">artifacts · results</text>
  </g>
</svg>
