# prometheus.yml — scrape config for the local stack.
#
# Scrapes:
#   • The 3 platform Spring Boot services' /actuator/prometheus
#     (global-orchestrator, metrics-consumer, document-service).
#   • Dynamically-spawned worker pods (jmeter-local-orchestrator
#     instances) via docker_sd_config — auto-discovered through the
#     Docker socket by their `com.perf.jmeterCloud.role=local-orchestrator`
#     label. The PodProvisioner spins these on demand per (app, region);
#     the static orchestrator-1/-2 entries that used to live here were
#     deleted with that rework.
#   • kafka-exporter for broker / topic / consumer-group metrics.
#   • postgres_exporter for connection / query / cache metrics.
#
# Cloud equivalent: Amazon Managed Prometheus per region, scraping the
# same /actuator/prometheus endpoints via the AMP scraper.

global:
  scrape_interval:     15s
  evaluation_interval: 15s

# SECURITY S-0 — abuse-signal alert rules. Mounted alongside this file by the
# grafana/docker-compose.yml prometheus service. No alertmanager locally, so
# these only surface in the Prometheus UI's Alerts tab; wire routing in cloud.
rule_files:
  - /etc/prometheus/securityAlerts.yml

scrape_configs:

  # ── Platform Spring Boot services (static targets — these are
  # always present per docker-compose) ──────────────────────────────
  - job_name: global-orchestrator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['global-orchestrator:8082']
        labels: { service: global-orchestrator, role: globalOrchestrator }

  - job_name: metrics-consumer
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['metrics-consumer:8083']
        labels: { service: metrics-consumer, role: metricsConsumer }

  - job_name: document-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['document-service:8084']
        labels: { service: document-service, role: documentService }

  # ── Worker pods (dynamic — discovered via Docker SD) ──────────────
  # PodProvisioner spawns local-orchestrator containers on demand and
  # tags them with `com.perf.jmeterCloud.role=local-orchestrator`. The
  # docker_sd filter below matches that label and adds each container
  # as a scrape target as soon as it appears (refresh every 15s; the
  # default Docker SD refresh would be much slower).
  #
  # IMPORTANT: prometheus needs read access to /var/run/docker.sock for
  # this to work — see grafana/docker-compose.yml where the socket is
  # bind-mounted into the prometheus container.
  - job_name: worker-pods
    metrics_path: /actuator/prometheus
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["com.perf.jmeterCloud.role=local-orchestrator"]
    relabel_configs:
      # Use the container name (minus the leading slash that Docker
      # always adds) as the scrape target. Docker DNS resolves names
      # within the user-defined network, so `payments-east-worker-1:8080`
      # is reachable from the prometheus container.
      - source_labels: [__meta_docker_container_name]
        regex: '/(.+)'
        target_label: __address__
        replacement: '${1}:8080'
      # service label = container name (so the per-pod dashboards
      # uniquely identify each worker). The Worker Pod JVM dashboard
      # filters by instance, which Prometheus sets to __address__ by
      # default — that gives us `<container>:8080` instance values.
      - source_labels: [__meta_docker_container_name]
        regex: '/(.+)'
        target_label: service
        replacement: '${1}'
      # role=localOrchestrator (camelCase — matches the dashboard's
      # existing PromQL queries that were written before docker SD
      # landed).
      - target_label: role
        replacement: localOrchestrator
      # Surface the PodProvisioner labels so dashboards can filter
      # by application + region without a separate template variable.
      # Docker SD lowercases label names and replaces dots with
      # underscores, so `com.perf.jmeterCloud.applicationName` becomes
      # `__meta_docker_container_label_com_perf_jmetercloud_applicationname`.
      - source_labels: [__meta_docker_container_label_com_perf_jmetercloud_applicationname]
        target_label: applicationName
      - source_labels: [__meta_docker_container_label_com_perf_jmetercloud_region]
        target_label: region

  # ── Exporters ─────────────────────────────────────────────────────
  - job_name: kafka-exporter
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: postgres-exporter
    static_configs:
      - targets: ['postgres-exporter:9187']

  # ── Prometheus self-scrape ────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
