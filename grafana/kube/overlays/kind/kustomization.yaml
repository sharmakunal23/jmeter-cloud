# KUBE-7 — kind overlay. Dev credentials match the compose defaults
# (admin/admin + metricsReader/localdev — already public in this repo).
# grafana/grafana:11.4.0 is a public multi-arch image — the kubelet pulls
# it from the registry; no `kind load` needed (and side-loading multi-arch
# manifests fails anyway).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
secretGenerator:
  - name: grafana-credentials
    literals:
      - adminUser=admin
      - adminPassword=admin
      - metricsReaderPassword=localdev
    options:
      disableNameSuffixHash: true
