# KUBE-7 — Kubernetes copy of grafana/provisioning/datasources/postgres.yml.
#
# NEAR-VERBATIM copy (kustomize cannot reference files outside this
# kustomization root). If you touch one, touch both — with ONE deliberate
# delta: the password is `$__env{METRICS_READER_PASSWORD}` (Grafana's
# provisioning env interpolation) instead of the inline `localdev`, so
# the privateCloud cluster never carries a DB password inside a
# ConfigMap. The Deployment injects METRICS_READER_PASSWORD from the
# `grafana-credentials` Secret; the kind overlay generates it with
# `localdev`, restoring exact compose behavior.
#
# `url: postgres:5432` resolves unchanged by Service-name parity.

apiVersion: 1

# SLIMDOWN SL-D (2026-07-21): purge the retired datasources from any
# pre-existing data volume — moot on a fresh emptyDir, but kept verbatim
# so the two copies stay diffable line-for-line (and correct if an
# operator adds a PVC).
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Jaeger
    orgId: 1

datasources:
  - name: Postgres
    type: postgres
    access: proxy
    # Default since SLIMDOWN SL-D — the only datasource left (Prometheus,
    # which previously held the flag, retired with the scrape stack).
    isDefault: true
    url: postgres:5432
    user: metricsReader
    secureJsonData:
      password: $__env{METRICS_READER_PASSWORD}
    jsonData:
      database: jmetercloud_metrics
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
