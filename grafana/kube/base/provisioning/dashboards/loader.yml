# Grafana dashboard provisioning — file-based loader.
#
# Auto-discovers every JSON dashboard under /var/lib/grafana/dashboards
# (mapped from grafana/dashboards in the repo) and reloads on changes.

apiVersion: 1

providers:
  - name: jmetercloud
    orgId: 1
    folder: jmeter-cloud
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
