# KUBE-7 — Service-name parity: `grafana` matches the compose service
# name, so the UI's VITE_GRAFANA_URL deep-link target and any future
# in-cluster consumer resolve unchanged. On kind there is no host port —
# use `kubectl -n jmeter-cloud port-forward svc/grafana 3000:3000` (which
# also keeps the UI's default http://localhost:3000 deep-link working).
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
