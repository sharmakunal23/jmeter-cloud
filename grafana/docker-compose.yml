# grafana subsystem — Compose fragment.
#
# Brings up Grafana only — HTTP UI on host port 3000. Provisioning is
# mounted from grafana/provisioning so the Postgres datasource + the
# dashboard loader are auto-configured on boot; the Application
# Performance dashboard (perTestLiveMetrics) is mounted from
# grafana/dashboards and reads metrics."workerMetric" directly.
#
# SLIMDOWN SL-D (2026-07-21): prometheus, postgres-exporter and jaeger
# left this fragment — the hosting infra provides observability, and the
# surviving dashboard needs none of them (operator decision D-1). Don't
# reintroduce scrape/trace infra here; if a future dashboard needs a
# non-Postgres datasource, that's an infra conversation first.
#
# Local dev posture: anonymous read access on Grafana so the dashboard
# is clickable without logging in.

services:

  grafana:
    image: grafana/grafana:11.4.0
    profiles: [default]
    restart: unless-stopped   # Reliability (Round 5): self-heal.
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      # Anonymous viewer-level access for local dev — no login wall on
      # dashboards. Operators wanting to edit log in as admin/admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER:    ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Allow the run-detail page (http://localhost:8086/runs/...) to
      # embed Grafana panels in an iframe. Without this Grafana sets
      # X-Frame-Options: deny and the iframe blocks. The matching
      # CSP frame-ancestors directive lists the UI origins that are
      # allowed to embed; default '*' lets any local-dev origin work.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SAMESITE: "none"
      # CSP must also relax frame-ancestors so the X-Frame-Options
      # equivalent in modern Grafana doesn't block the embed.
      GF_SECURITY_CONTENT_SECURITY_POLICY: "false"
      # Disable update / report telemetry pings.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  grafana-data:
