# Grafana datasource provisioning — Postgres.
#
# Connects to the metrics database as metricsReader (the read-only user
# from the Step 9 GRANT split). The perTestLiveMetrics dashboard runs
# SQL queries against metrics."workerMetric" through this datasource.
#
# Cloud equivalent: AWS RDS endpoint, IAM-DB authentication. The
# username + password fields go away in cloud and are replaced by an
# IAM-assumed role.

apiVersion: 1

# SLIMDOWN SL-D (2026-07-21): purge the retired datasources from any
# pre-existing grafana-data volume — deleting their provisioning files
# alone does not remove previously-registered datasources.
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Jaeger
    orgId: 1

datasources:
  - name: Postgres
    type: postgres
    access: proxy
    # Default since SLIMDOWN SL-D — the only datasource left (Prometheus,
    # which previously held the flag, retired with the scrape stack).
    isDefault: true
    url: postgres:5432
    user: metricsReader
    secureJsonData:
      password: localdev
    jsonData:
      database: jmetercloud_metrics
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
