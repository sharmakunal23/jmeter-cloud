# KUBE-8 — privateCloud overlay. No bridge here: postgres, redis,
# metrics-consumer and document-service must be REAL Services (or
# ExternalName aliases) created in the jmeter-orchestrator-k8s namespace
# by the operator — the compose-bridge is a kind-local construct.
# DB/redis/mail endpoints + credentials come via env patches on the
# Deployment (the app's application.yml env bindings), e.g.:
# patches:
#   - patch: |
#       apiVersion: apps/v1
#       kind: Deployment
#       metadata: {name: jmeter-orchestrator-k8s}
#       spec:
#         template:
#           spec:
#             containers:
#               - name: orchestrator
#                 env:
#                   - {name: POSTGRES_K8SRUN_URL, value: "jdbc:postgresql://postgres:5432/jmetercloud_k8srun"}
#     target: {kind: Deployment, name: jmeter-orchestrator-k8s}
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

# Private-registry rewrite — set the real registry, then uncomment. NOTE:
# the `images:` transformer only rewrites the ORCHESTRATOR's image; the
# worker image is stamped at runtime from PODPROVISIONER_IMAGE, which must
# be patched to a registry reference separately (pin repo:tag@sha256 —
# `currentImageDigest()` returns the CONFIGURED reference, so a re-tag
# mid-run triggers IMAGE_MISMATCH recycle drains exactly like a local
# rebuild; see infra/deploy/k8s/README.md "Images & registry").
# images:
#   - name: jmeter-orchestrator-k8s
#     newName: registry.internal.example.com/jmeter-cloud/jmeter-orchestrator-k8s
#     newTag: "1.0.0"
# patches:
#   - patch: |
#       apiVersion: apps/v1
#       kind: Deployment
#       metadata: {name: jmeter-orchestrator-k8s}
#       spec:
#         template:
#           spec:
#             containers:
#               - name: orchestrator
#                 env:
#                   - {name: PODPROVISIONER_IMAGE, value: "registry.internal.example.com/jmeter-cloud/jmeter-local-orchestrator:1.0.0@sha256:<digest>"}
#     target: {kind: Deployment, name: jmeter-orchestrator-k8s}
