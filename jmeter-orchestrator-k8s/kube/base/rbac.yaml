# K8S-ORCHESTRATOR C-7 — least-privilege identity for the orchestrator.
# Namespace-scoped Role, pods only, no secrets/exec/portforward verbs: the
# ServiceAccount is the new blast-radius surface (SECURITY note in the
# track doc) and becomes IRSA-mapped at the EKS step. The kustomization's
# namespace transformer stamps the namespace (incl. the RoleBinding's
# ServiceAccount subject).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jmeter-orchestrator-k8s
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: worker-pod-manager
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jmeter-orchestrator-k8s-worker-pod-manager
subjects:
  - kind: ServiceAccount
    name: jmeter-orchestrator-k8s
roleRef:
  kind: Role
  name: worker-pod-manager
  apiGroup: rbac.authorization.k8s.io
