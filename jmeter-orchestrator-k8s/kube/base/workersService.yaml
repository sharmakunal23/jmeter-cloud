# K8S-ORCHESTRATOR C-7 / D-6 — headless Service giving every managed worker
# Pod the stable DNS name {podName}.workers.jmeter-orchestrator-k8s.svc
# (short form {podName}.workers inside the namespace). The provisioner sets
# hostname={podName} + subdomain=workers on each Pod; this selector matches
# the managedBy label it stamps. The name `workers` is safe to keep despite
# the global-orchestrator owning a `workers` Service too — they live in
# different namespaces (see namespace.yaml).
apiVersion: v1
kind: Service
metadata:
  name: workers
spec:
  clusterIP: None
  # Pending pods must be resolvable too — the control plane records the
  # baseUrl before the worker is Ready.
  publishNotReadyAddresses: true
  selector:
    jmetercloud.io/managedBy: k8s-orchestrator
  ports:
    - name: http
      port: 8080
      targetPort: 8080
