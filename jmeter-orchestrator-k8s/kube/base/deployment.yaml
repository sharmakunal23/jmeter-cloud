# K8S-ORCHESTRATOR C-7 / D-9 — the orchestrator itself runs in-cluster so
# workers reach it at plain Service DNS (GLOBAL_ORCHESTRATOR_URL default
# http://jmeter-orchestrator-k8s:8088) and the fabric8 client picks up the
# ServiceAccount without any kubeconfig.
#
# Dependencies (postgres, redis, metrics-consumer, document-service) are
# expected to resolve by their compose service names — on kind the
# `kube/local/bootstrap.sh bridge` Services provide them (pointing at the
# compose containers, in THIS namespace); on a full in-cluster deployment
# they'd be real Services instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jmeter-orchestrator-k8s
  labels:
    app: jmeter-orchestrator-k8s
spec:
  # Single replica by default. Every background path is multi-instance safe
  # (MULTI-INSTANCE audit, 2026-07-24 — DB-claim schedulers, guarded terminal
  # transitions, deterministic audit ids); what stays per-instance is the
  # in-memory rate limiter (N replicas = N× the effective limit). See the
  # scaling-posture section in infra/deploy/k8s/README.md before scaling out.
  replicas: 1
  strategy:
    # MULTI-INSTANCE (2026-07-24): with the default RollingUpdate, a
    # single-replica deploy still briefly runs old + new pods at once — two
    # orchestrators on DIFFERENT images, each seeing the other's freshly-spun
    # workers as IMAGE_MISMATCH. maxSurge 0 makes the swap strictly
    # stop-then-start, so the mixed-image window doesn't exist at replicas: 1
    # (the RecycleEvaluator grace window covers it when replicas > 1).
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: jmeter-orchestrator-k8s
  template:
    metadata:
      labels:
        app: jmeter-orchestrator-k8s
    spec:
      serviceAccountName: jmeter-orchestrator-k8s
      # The bridge Services (redis, postgres, ...) share this namespace;
      # with service links on, the kubelet injects REDIS_PORT=tcp://...
      # style env vars that collide with the app's ${REDIS_PORT:6379}
      # binding (Spring fails to bind tcp://... to int). Docker-link env
      # injection is legacy — DNS is the discovery mechanism here.
      enableServiceLinks: false
      containers:
        - name: orchestrator
          image: jmeter-orchestrator-k8s:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8088
          env:
            - name: HTTP_PORT
              value: "8088"
            # STATIC-FLEET — whether this deployment may create worker Pods
            # at all. STATIC is the platform default (2026-07-27): workers
            # are deployed and declared by the operator, spin / restart /
            # teardown answer 409, and PodReconciler + PodRecycler are not
            # wired (the reconciler would read the declared fleet as orphaned
            # and delete it). Set DYNAMIC to let the fabric8 K8sPodProvisioner
            # below own worker lifecycle — this service's original mode, and
            # still the right choice when it holds pods-create rights in the
            # worker namespace. See infra/deploy/k8s/staticFleet.md.
            - name: PROVISIONING_MODE
              value: STATIC
            - name: PROVISIONING_REGIONS
              value: ""
            # Provisioner — namespace + headless service match these
            # manifests (KUBE-8: the app default is still jmeter-cloud;
            # this override is what puts worker Pods in the isolated
            # namespace).
            - name: PODPROVISIONER_NAMESPACE
              value: jmeter-orchestrator-k8s
            - name: PODPROVISIONER_HEADLESS_SERVICE
              value: workers
            - name: PODPROVISIONER_IMAGE
              value: jmeter-local-orchestrator:dev
            - name: GLOBAL_ORCHESTRATOR_URL
              value: http://jmeter-orchestrator-k8s:8088
          resources:
            requests:
              memory: 1536Mi
            limits:
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: 30
            periodSeconds: 10
