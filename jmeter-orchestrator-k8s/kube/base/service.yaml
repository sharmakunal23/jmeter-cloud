# K8S-ORCHESTRATOR C-7 — the orchestrator's own Service; workers call back
# to it at http://jmeter-orchestrator-k8s:8088 (same-namespace short name).
apiVersion: v1
kind: Service
metadata:
  name: jmeter-orchestrator-k8s
spec:
  selector:
    app: jmeter-orchestrator-k8s
  ports:
    - name: http
      port: 8088
      targetPort: 8088
