# KUBE-8 — jmeter-orchestrator-k8s base, restructured from the flat
# k8s/*.yaml files to the platform's kube/ convention. Standalone — deliberately NOT part of
# the infra/deploy/k8s umbrella: this track deploys into its own
# namespace (see namespace.yaml for the coexistence rationale) via
# kube/local/bootstrap.sh (kind) or the privateCloud overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jmeter-orchestrator-k8s
labels:
  - pairs:
      app.kubernetes.io/part-of: jmeter-orchestrator-k8s
    includeSelectors: false
resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - workersService.yaml
